      {clue:"What Great Lake is the only one located entirely within the United States?",answer:"Lake Michigan"},
      {clue:"What US city is known as the 'Gateway to the West' and is home to a famous arch?",answer:"St. Louis, Missouri"}
    ],
    "Science & Nature":[
      {clue:"What is the chemical symbol for gold?",answer:"Au"},
      {clue:"What planet in our solar system has the most moons?",answer:"Saturn"},
      {clue:"What is the powerhouse of the cell?",answer:"Mitochondria"},
      {clue:"What is the name of the force that keeps planets in orbit around the sun?",answer:"Gravity"},
      {clue:"How many bones are in the adult human body?",answer:"206"}
    ],
    "History":[
      {clue:"In what year did the Berlin Wall fall?",answer:"1989"},
      {clue:"What was the name of the first artificial satellite launched into space, sent by the Soviet Union in 1957?",answer:"Sputnik"},
      {clue:"What US president signed the Civil Rights Act of 1964?",answer:"Lyndon B. Johnson"},
      {clue:"What ancient wonder of the world was located in Alexandria, Egypt?",answer:"The Lighthouse of Alexandria"},
      {clue:"What was the name of the ship that sank in 1912 after hitting an iceberg on its maiden voyage?",answer:"RMS Titanic"}
    ],
    "Food & Drink":[
      {clue:"What country is the origin of the dish sushi?",answer:"Japan"},
      {clue:"What grain is used to make bourbon whiskey?",answer:"Corn (at least 51%)"},
      {clue:"What is the most consumed beverage in the world after water?",answer:"Tea"},
      {clue:"What vitamin is produced by the human body when exposed to sunlight?",answer:"Vitamin D"},
      {clue:"What fruit is known as the 'king of fruits' in Southeast Asia and is famous for its strong smell?",answer:"Durian"}
    ],
    "Pop Culture":[
      {clue:"What social media platform introduced the concept of 'Stories,' later copied by Instagram and Facebook?",answer:"Snapchat"},
      {clue:"What video game franchise features characters named Mario, Luigi, and Princess Peach?",answer:"Super Mario (Nintendo)"},
      {clue:"What does the acronym 'GOAT' stand for in sports and pop culture?",answer:"Greatest Of All Time"},
      {clue:"What company makes the iPhone?",answer:"Apple"},
      {clue:"What is the name of the fictional wizard school in the Harry Potter series?",answer:"Hogwarts"}
    ]
  }
];

// ── TIEBREAKER ──
const tiebreaker = {
  "Micro":   {clue:"The demand curve for a perfectly competitive firm is perfectly elastic. Why?",answer:"Because the firm is a price taker — it can sell any quantity at the market price",explain:"In perfect competition, each firm is so small relative to the market that its output decisions have no effect on the market price. It faces a horizontal demand curve at the market price, meaning it can sell all it wants at that price. Charging more loses all customers; charging less is unnecessary. This makes price equal to marginal revenue for competitive firms."},
  "Macro":   {clue:"What term describes the total value of goods and services produced by a country's residents regardless of where they are located?",answer:"Gross National Product (GNP)",explain:"GNP measures output by a country's residents (citizens and permanent residents) wherever they are located in the world, while GDP measures output produced within a country's borders regardless of who produces it. For most large countries GNP and GDP are close, but they differ for countries with large numbers of workers abroad (like the Philippines) or large foreign investment (like Ireland)."},
  "Management":{clue:"What term describes the maximum number of subordinates a manager can effectively supervise?",answer:"Span of control",explain:"Span of control refers to the number of employees reporting directly to one manager. Narrow spans (few direct reports) create tall hierarchies with more management layers; wide spans create flat organizations with fewer layers. The optimal span depends on task complexity, employee skill, and the degree of standardization. Modern organizations have trended toward wider spans as communication technology and employee autonomy have improved."},
  "Marketing":{clue:"What is the term for the process of dividing a market into distinct groups of buyers with different needs, characteristics, or behaviors?",answer:"Market segmentation",explain:"Market segmentation divides a heterogeneous market into smaller, more homogeneous groups that respond similarly to marketing strategies. Effective segmentation bases include demographics, psychographics, geography, and behavior. Segmentation enables targeted marketing — firms can tailor products, pricing, promotion, and distribution to the specific needs of each segment rather than using a one-size-fits-all approach."},
  "Quantitative":{clue:"In hypothesis testing, what is the probability of rejecting a true null hypothesis?",answer:"Alpha (α) — the significance level",explain:"Alpha (α) is the Type I error rate — the probability of incorrectly rejecting a null hypothesis that is actually true (a false positive). Researchers typically set α = 0.05, meaning they accept a 5% chance of a Type I error. The p-value is then compared to α: if p < α, we reject the null. Choosing a smaller α reduces Type I errors but increases Type II errors (failing to reject a false null)."},
  "Policy":  {clue:"What economic term describes a good that is non-excludable and non-rival in consumption, leading to the free-rider problem?",answer:"Public good",explain:"A public good is non-excludable (you can't prevent people from using it) and non-rival (one person's use doesn't diminish others'). National defense and public fireworks are classic examples. Because of the free-rider problem — people benefit without paying — private markets undersupply public goods, creating a rationale for government provision. Most goods are not pure public goods; many have elements of both publicness and privateness."},
  "Finance": {clue:"What financial ratio measures a company's ability to meet short-term obligations using only its most liquid assets, excluding inventory?",answer:"Quick ratio (acid-test ratio)",explain:"The quick ratio = (Current Assets - Inventory) / Current Liabilities. It is a stricter liquidity test than the current ratio because inventory may not be quickly convertible to cash. A quick ratio of 1.0 or above generally indicates adequate short-term liquidity. It is particularly important for businesses with slow-moving inventory, like manufacturers, where inventory could take months to convert to cash."},
  "Potpourri":{clue:"What is the name of the annual economic symposium hosted by the Kansas City Federal Reserve Bank in Wyoming?",answer:"Jackson Hole Economic Symposium",explain:"The Jackson Hole Economic Symposium has been held annually since 1978 near Jackson Hole, Wyoming. It is one of the most prestigious gatherings in global central banking, bringing together central bank governors, finance ministers, and leading economists. Fed chairs often use the event to signal major policy shifts — Ben Bernanke signaled QE2 there in 2010, and Jerome Powell announced the Fed's new average inflation targeting framework there in 2020."}
};

let currentRound = 0;
let isTiebreaker = false;
let teams = [{name:"Team 1",score:0},{name:"Team 2",score:0}];
let usedByRound = [{},{},{},{},{},{},{},{},{},{},{},{},{},{}];
let currentCell = null;
let timerInterval = null;
let timerCount = 10;
let stealMode = false;
let stealFromTeam = -1;

function switchRound(r) {
  currentRound = r;
  isTiebreaker = (r === 13);
  document.querySelectorAll('.round-btn').forEach((b,i) => b.classList.toggle('active', i===r));
  const grid = document.getElementById('grid');
  grid.className = isTiebreaker ? 'tiebreak' : 'normal';
  renderGrid();
}

function renderScores() {
  document.getElementById('scoreboard').innerHTML = teams.map((t,i) => `
    <div class="team-block">
      <input value="${t.name}" oninput="teams[${i}].name=this.value" />
      <div class="score" id="score${i}" onclick="openScorePanel(${i})" title="Click to adjust" style="cursor:pointer;">${t.score}</div>
    </div>
  `).join('');
}

function openScorePanel(i) {
  const existing = document.getElementById('score-panel');
  if (existing) existing.remove();
  const panel = document.createElement('div');
  panel.id = 'score-panel';
  panel.style.cssText = 'position:fixed;top:80px;right:20px;background:#3a0a0a;border:2px solid #e8d080;border-radius:8px;padding:16px 20px;z-index:400;text-align:center;min-width:200px;';
  panel.innerHTML = `
    <div style="font-family:Anton,sans-serif;font-size:14px;letter-spacing:2px;color:#e8d080;margin-bottom:10px;">${teams[i].name}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px;">
      ${[5,10,15,20,25].map(v => `
        <button onclick="nudgeScore(${i},${v})"  style="font-family:Barlow,sans-serif;font-weight:600;font-size:13px;padding:5px 10px;border-radius:4px;border:none;background:#2d7a3a;color:white;cursor:pointer;">+${v}</button>
        <button onclick="nudgeScore(${i},-${v})" style="font-family:Barlow,sans-serif;font-weight:600;font-size:13px;padding:5px 10px;border-radius:4px;border:none;background:#5a0e0e;border:1px solid rgba(255,255,255,0.3);color:white;cursor:pointer;">-${v}</button>
      `).join('')}
    </div>
    <button onclick="document.getElementById('score-panel').remove()" style="font-family:Barlow,sans-serif;font-weight:600;font-size:12px;padding:5px 14px;border-radius:4px;border:none;background:rgba(255,255,255,0.15);color:white;cursor:pointer;">Done</button>
  `;
  document.body.appendChild(panel);
}

function nudgeScore(i, amt) {
  teams[i].score += amt;
  renderScores();
}

function renderGrid() {
  const used = usedByRound[currentRound];
  const grid = document.getElementById('grid');
  let html = '';
  const isPotpourriRound = !isTiebreaker && currentRound < rounds.length &&
    !Object.keys(rounds[currentRound]).includes('Micro');
  const cats = isTiebreaker ? categories :
    (isPotpourriRound ? Object.keys(rounds[currentRound]) : categories);

  if (isTiebreaker) {
    html = cats.map(c => `<div class="cat-header">${c}</div>`).join('');
    html += cats.map((c,col) => {
      const key = `${col}-0`;
      const isUsed = !!used[key];
      return `<div class="cell tiebreak-cell${isUsed?' used':''}" onclick="openTiebreaker(${col})">${isUsed ? '—' : 'TB'}</div>`;
    }).join('');
  } else {
    html = cats.map(c => `<div class="cat-header">${c}</div>`).join('');
    for (let row=0; row<5; row++) {
      for (let col=0; col<cats.length; col++) {
        const key = `${col}-${row}`;
        const isUsed = !!used[key];
        html += `<div class="cell${isUsed?' used':''}" onclick="openCell(${col},${row})">${isUsed ? '—' : points[row]}</div>`;
      }
    }
  }
  grid.style.gridTemplateColumns = `repeat(${cats.length}, minmax(0, 1fr))`;
  grid.style.gridTemplateRows = isTiebreaker ? 'repeat(2, 1fr)' : 'repeat(6, 1fr)';
  grid.innerHTML = html;
}

function openTiebreaker(col) {
  const key = `${col}-0`;
  if (usedByRound[currentRound][key]) return;
  currentCell = {col, row:0, key};
  stealMode = false; stealFromTeam = -1;
  const cat = categories[col];
  const q = tiebreaker[cat];
  document.getElementById('m-cat').textContent = cat + ' — Tiebreaker';
  document.getElementById('m-pts').textContent = 'TB';
  document.getElementById('m-clue').textContent = q.clue;
  document.getElementById('m-answer').textContent = 'Answer: ' + q.answer;
  document.getElementById('peek-answer').textContent = q.answer;
  document.getElementById('peek-answer').className = '';
  document.getElementById('peek-btn').textContent = '👁 peek';
  document.getElementById('m-answer').className = 'modal-answer';
  document.getElementById('steal-banner').className = '';
  document.getElementById('award-row').className = 'award-row';
  stopTimer();
  document.getElementById('timer-ring-wrap').className = '';
  hide('btn-reveal'); show('btn-buzz'); hide('btn-correct'); hide('btn-wrong'); hide('btn-nosteal'); show('btn-noanswer'); hide('btn-explain');
  document.getElementById('modal-bg').className = 'open';
}

function openCell(col, row) {
  const key = `${col}-${row}`;
  if (usedByRound[currentRound][key]) return;
  currentCell = {col, row, key};
  stealMode = false; stealFromTeam = -1;
  const roundCats = Object.keys(rounds[currentRound]);
  const cat = roundCats[col];
  const q = rounds[currentRound][cat][row];
  document.getElementById('m-cat').textContent = cat + ' — Round ' + (currentRound+1);
  document.getElementById('m-pts').textContent = points[row] + ' pts';
  document.getElementById('m-clue').textContent = q.clue;
  document.getElementById('m-answer').textContent = 'Answer: ' + q.answer;
  document.getElementById('peek-answer').textContent = q.answer;
  document.getElementById('peek-answer').className = '';
  document.getElementById('peek-btn').textContent = '👁 peek';
  document.getElementById('m-answer').className = 'modal-answer';
  const choicesEl = document.getElementById('m-choices');
  if (q.choices) { choicesEl.innerHTML = q.choices.map(c=>`<div class="choice-item">${c}</div>`).join(''); choicesEl.className='visible'; }
  else { choicesEl.innerHTML=''; choicesEl.className=''; }
  document.getElementById('steal-banner').className = '';
  document.getElementById('award-row').className = 'award-row';
  stopTimer();
  document.getElementById('timer-ring-wrap').className = 'visible';
  hide('btn-reveal'); show('btn-buzz'); hide('btn-correct'); hide('btn-wrong'); hide('btn-nosteal'); show('btn-noanswer'); hide('btn-explain');
  document.getElementById('modal-bg').className = 'open';
  timerCount = 13;
  setTimer(13, 13);
  timerInterval = setInterval(() => {
    timerCount--;
    setTimer(timerCount, 13);
    if (timerCount <= 0) { stopTimer(); triggerSteal(-1); }
  }, 1000);
}

function revealAnswer() {
  document.getElementById('m-answer').className = 'modal-answer visible';
  hide('btn-reveal');
  show('btn-explain');
}

function startBuzz() {
  stopTimer();
  timerCount = 5;
  setTimer(5, 5);
  document.getElementById('timer-ring-wrap').className = 'visible';
  document.getElementById('btn-buzz').disabled = true;
  show('btn-reveal'); show('btn-correct'); show('btn-wrong'); hide('btn-noanswer');
  timerInterval = setInterval(() => {
    timerCount--;
    setTimer(timerCount, 5);
    if (timerCount <= 0) {
      stopTimer();
      if (stealMode) { markQuestionDead(true); }
      else { triggerSteal(-1); }
    }
  }, 1000);
}

function setTimer(n, maxN) {
  maxN = maxN || 13;
  const arc = document.getElementById('timer-arc');
  const num = document.getElementById('timer-num');
  arc.style.strokeDashoffset = CIRC * (1 - n/maxN);
  arc.style.stroke = n <= 3 ? '#ff4444' : (n <= Math.floor(maxN/2) ? '#ffaa00' : '#e8d080');
  num.textContent = Math.max(n, 0);
  num.style.fill = n <= 3 ? '#ff4444' : '#ffffff';
}

function stopTimer() {
  clearInterval(timerInterval); timerInterval = null;
  const b = document.getElementById('btn-buzz');
  if (b) b.disabled = false;
}

function handleWrong() {
  stopTimer();
  document.getElementById('timer-ring-wrap').className = '';
  if (stealMode) {
    const pts = points[currentCell.row];
    const stealTeam = stealFromTeam === 0 ? 1 : 0;
    teams[stealTeam].score -= pts;
    renderScores();
    markQuestionDead(true);
    return;
  }
  const pts = isTiebreaker ? 1 : points[currentCell.row];
  const row = document.getElementById('award-row');
  if (isTiebreaker) {
    row.innerHTML = `<div class="award-label">Deduct 1 pt from:</div>` +
      teams.map((t,i) => `<button class="award-btn" onclick="deductAndSteal(${i},1)">${t.name}</button>`).join('');
  } else {
    row.innerHTML = `<div class="award-label">Deduct ${pts} pts from:</div>` +
      teams.map((t,i) => `<button class="award-btn" onclick="deductAndSteal(${i},${pts})">${t.name}</button>`).join('');
  }
  row.className = 'award-row visible';
  hide('btn-correct'); hide('btn-wrong'); hide('btn-buzz');
}

function deductAndSteal(teamIdx, pts) {
  if (teamIdx >= 0) { teams[teamIdx].score -= pts; renderScores(); stealFromTeam = teamIdx; }
  triggerSteal(teamIdx);
}

function triggerSteal(wrongTeamIdx) {
  stealMode = true;
  document.getElementById('award-row').className = 'award-row';
  const otherName = wrongTeamIdx >= 0 ? teams[wrongTeamIdx === 0 ? 1 : 0].name : 'Other team';
  const banner = document.getElementById('steal-banner');
  banner.textContent = wrongTeamIdx >= 0 ? `⚡ STEAL — ${otherName} can buzz in!` : `⏱ Time's up — steal opportunity!`;
  banner.className = 'visible';
  show('btn-buzz'); show('btn-correct'); show('btn-wrong'); show('btn-nosteal'); hide('btn-noanswer');
  document.getElementById('btn-buzz').disabled = false;
  document.getElementById('timer-ring-wrap').className = '';
  setTimer(5, 5); timerCount = 5;
}

function showAward(correct) {
  stopTimer();
  document.getElementById('timer-ring-wrap').className = '';
  const pts = isTiebreaker ? 'Tiebreaker' : points[currentCell.row];
  const row = document.getElementById('award-row');
  if (isTiebreaker) {
    row.innerHTML = `<div class="award-label">Award 1 pt to:</div>` +
      teams.map((t,i) => `<button class="award-btn" onclick="applyScore(${i},1)">${t.name}</button>`).join('') +
      `<button class="award-btn" onclick="applyScore(-1,0)">No team</button>`;
  } else {
    row.innerHTML = `<div class="award-label">Award ${pts} pts to:</div>` +
      teams.map((t,i) => `<button class="award-btn" onclick="applyScore(${i},${pts})">${t.name}</button>`).join('') +
      `<button class="award-btn" onclick="applyScore(-1,0)">No team</button>`;
  }
  row.className = 'award-row visible';
  hide('btn-correct'); hide('btn-wrong'); hide('btn-buzz'); hide('btn-nosteal');
}

function applyScore(teamIdx, pts) {
  if (teamIdx >= 0) { teams[teamIdx].score += pts; renderScores(); }
  usedByRound[currentRound][currentCell.key] = true;
  renderGrid();
  closeModal();
}

function markQuestionDead(showBanner) {
  stopTimer();
  if (showBanner) {
    document.getElementById('steal-banner').textContent = '❌ Question dead — no further points';
    document.getElementById('steal-banner').className = 'visible';
  }
  hide('btn-buzz'); hide('btn-correct'); hide('btn-wrong'); hide('btn-nosteal'); hide('btn-noanswer');
  show('btn-reveal');
  usedByRound[currentRound][currentCell.key] = true;
  renderGrid();
}

function showExplanation() {
  if (!currentCell) return;
  const cat = categories[currentCell.col];
  let q;
  if (isTiebreaker) { q = tiebreaker[cat]; }
  else { q = rounds[currentRound][cat][currentCell.row]; }
  document.getElementById('explain-body').innerHTML = `
    <div class="explain-q">${cat} — ${isTiebreaker ? 'Tiebreaker' : points[currentCell.row] + ' pts'}</div>
    <div class="explain-a">✓ ${q.answer}</div>
    <div class="explain-text">${q.explain}</div>
  `;
  document.getElementById('explain-panel').classList.add('open');
}

function closeExplain() { document.getElementById('explain-panel').classList.remove('open'); }

function closeModal() {
  stopTimer();
  closeExplain();
  const sp = document.getElementById('score-panel');
  if (sp) sp.remove();
  document.getElementById('modal-bg').className = '';
  document.getElementById('timer-ring-wrap').className = '';
  document.getElementById('award-row').className = 'award-row';
  document.getElementById('steal-banner').className = '';
  document.getElementById('peek-answer').className = '';
  document.getElementById('peek-btn').textContent = '👁 peek';
  currentCell = null; stealMode = false;
}

function resetRound() {
  if (!confirm('Reset ' + (isTiebreaker ? 'Tiebreaker' : 'Round ' + (currentRound+1)) + '?')) return;
  usedByRound[currentRound] = {};
  renderGrid();
}

function togglePeek() {
  const el = document.getElementById('peek-answer');
  const btn = document.getElementById('peek-btn');
  if (el.classList.contains('visible')) { el.className = ''; btn.textContent = '👁 peek'; }
  else { el.className = 'visible'; btn.textContent = '🙈 hide'; }
}

function show(id) { document.getElementById(id).style.display = 'inline-block'; }
function hide(id) { document.getElementById(id).style.display = 'none'; }

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
renderScores();
renderGrid();
</script>

</html>
