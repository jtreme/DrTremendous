<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Treme Quiz Bowl Jeopardy</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --red: #8f1a1a; --red-hover: #b52222; --red-dark: #5a0e0e;
    --gold: #e8d080; --gold-dark: #c4a832;
    --white: #ffffff; --green: #2d7a3a; --wrong-red: #3a0a0a;
  }
  body { background: #1a0505; color: var(--white); font-family: 'Barlow', sans-serif; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

  #header { background: var(--red-dark); border-bottom: 3px solid var(--gold); padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
  #header h1 { font-family: 'Anton', sans-serif; font-size: 26px; letter-spacing: 3px; color: var(--gold); text-transform: uppercase; }
  .round-selector { display: flex; gap: 8px; }
  .round-btn { font-family: 'Barlow', sans-serif; font-weight: 600; font-size: 13px; padding: 6px 14px; border-radius: 4px; border: 2px solid var(--gold); background: transparent; color: var(--gold); cursor: pointer; transition: all 0.15s; text-transform: uppercase; letter-spacing: 1px; }
  .round-btn.active, .round-btn:hover { background: var(--gold); color: var(--red-dark); }
  .round-btn.tiebreaker { border-color: #ff8844; color: #ff8844; }
  .round-btn.tiebreaker.active, .round-btn.tiebreaker:hover { background: #ff8844; color: #1a0505; }

  .scoreboard { display: flex; gap: 16px; }
  .team-block { text-align: center; }
  .team-block input { background: transparent; border: none; border-bottom: 1px solid var(--gold-dark); color: var(--gold); font-family: 'Barlow', sans-serif; font-size: 18px; font-weight: 600; text-align: center; width: 110px; letter-spacing: 1px; text-transform: uppercase; outline: none; }
  .team-block .score { font-family: 'Anton', sans-serif; font-size: 36px; color: var(--white); line-height: 1.1; cursor: pointer; }

  #board-wrap { flex: 1; padding: 10px 12px 8px; display: flex; flex-direction: column; overflow: hidden; }
  #grid { display: grid; gap: 6px; flex: 1; overflow: hidden; }
  #grid.normal { grid-template-columns: repeat(8, minmax(0, 1fr)); grid-template-rows: repeat(6, 1fr); }
  #grid.tiebreak { grid-template-columns: repeat(8, minmax(0, 1fr)); grid-template-rows: repeat(2, 1fr); }

  .cat-header { background: var(--red); border: 2px solid var(--gold-dark); border-radius: 4px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 8px 4px; font-family: 'Anton', sans-serif; font-size: 26px; letter-spacing: 1.5px; color: var(--gold); text-transform: uppercase; }
  .cell { background: var(--red); border: 2px solid var(--gold-dark); border-radius: 4px; display: flex; align-items: center; justify-content: center; font-family: 'Anton', sans-serif; font-size: 38px; color: var(--gold); cursor: pointer; transition: background 0.12s, transform 0.1s; user-select: none; }
  .cell:hover { background: var(--red-hover); transform: scale(1.03); }
  .cell.used { background: #2a0808; border-color: #4a1010; color: #4a1010; cursor: default; font-size: 20px; }
  .cell.used:hover { transform: none; background: #2a0808; }
  .cell.tiebreak-cell { font-size: 22px; }

  #footer { padding: 6px 12px; display: flex; justify-content: flex-end; flex-shrink: 0; }
  .reset-btn { background: none; border: none; color: rgba(255,255,255,0.35); font-size: 12px; cursor: pointer; font-family: 'Barlow', sans-serif; text-decoration: underline; }
  .reset-btn:hover { color: rgba(255,255,255,0.7); }

  #modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.88); z-index: 200; align-items: center; justify-content: center; padding: 40px; }
  #modal-bg.open { display: flex; }
  #modal { background: var(--red-dark); border: 3px solid var(--gold); border-radius: 8px; width: 100%; max-width: 860px; padding: 28px 48px; text-align: center; position: relative; }
  #m-cat { font-family: 'Barlow', sans-serif; font-weight: 600; font-size: 14px; letter-spacing: 3px; text-transform: uppercase; color: var(--gold-dark); margin-bottom: 6px; }
  #m-pts { font-family: 'Anton', sans-serif; font-size: 46px; color: var(--gold); line-height: 1; margin-bottom: 16px; }
  #m-clue { font-family: 'Barlow', sans-serif; font-size: 34px; font-weight: 600; line-height: 1.5; color: var(--white); margin: 24px 0 24px; min-height: 60px; }
  #m-answer { display: none; background: rgba(232,208,128,0.15); border: 3px solid var(--gold); border-radius: 8px; padding: 20px 32px; font-size: 30px; font-weight: 600; color: var(--white); margin: 24px 0 36px; }
  #m-answer.visible { display: block; }
  #m-choices { display: none; text-align: left; margin-bottom: 16px; }
  #m-choices.visible { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .choice-item { background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.15); border-radius: 6px; padding: 10px 16px; font-size: 20px; font-weight: 600; color: var(--white); }

  #timer-ring-wrap { display: none; justify-content: center; margin: 20px 0; }
  #timer-ring-wrap.visible { display: flex; }
  #timer-svg { width: 120px; height: 120px; }
  #timer-track { fill: none; stroke: rgba(255,255,255,0.15); stroke-width: 8; }
  #timer-arc { fill: none; stroke: var(--gold); stroke-width: 8; stroke-linecap: round; stroke-dasharray: 345; stroke-dashoffset: 0; transform: rotate(-90deg); transform-origin: 60px 60px; transition: stroke-dashoffset 0.9s linear, stroke 0.3s; }
  #timer-num { font-family: 'Anton', sans-serif; font-size: 38px; fill: var(--white); dominant-baseline: middle; text-anchor: middle; }

  #steal-banner { display: none; background: rgba(255,200,50,0.12); border: 1px solid var(--gold-dark); border-radius: 6px; padding: 8px 20px; font-size: 16px; font-weight: 600; color: var(--gold); margin-bottom: 12px; letter-spacing: 1px; }
  #steal-banner.visible { display: block; }

  .btn-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .mbtn { font-family: 'Barlow', sans-serif; font-weight: 600; font-size: 14px; letter-spacing: 1px; text-transform: uppercase; padding: 10px 20px; border-radius: 4px; border: none; cursor: pointer; color: #fff !important; transition: opacity 0.15s; }
  .mbtn:hover { opacity: 0.85; }
  .mbtn:disabled { opacity: 0.35; cursor: default; }
  .mbtn-reveal  { background: rgba(255,255,255,0.2); }
  .mbtn-close   { background: rgba(255,255,255,0.2); }
  .mbtn-buzz    { background: #b87d00; font-size: 15px; padding: 11px 26px; }
  .mbtn-correct { background: var(--green); }
  .mbtn-wrong   { background: var(--wrong-red); border: 1px solid rgba(255,255,255,0.25) !important; }
  .mbtn-nosteal { background: rgba(255,255,255,0.15); }
  .mbtn-explain { background: #4a2a7a; }

  .award-row { display: none; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 12px; align-items: center; }
  .award-row.visible { display: flex; }
  .award-label { font-size: 13px; color: rgba(255,255,255,0.6); letter-spacing: 1px; text-transform: uppercase; width: 100%; text-align: center; margin-bottom: 4px; }
  .award-btn { font-family: 'Barlow', sans-serif; font-weight: 600; font-size: 14px; padding: 8px 18px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.1); color: white; cursor: pointer; }
  .award-btn:hover { background: rgba(255,255,255,0.25); }

  .hint { font-size: 11px; color: rgba(255,255,255,0.3); margin-top: 12px; }

  #peek-wrap { position: absolute; bottom: 8px; right: 12px; text-align: right; }
  #peek-btn { font-family: 'Barlow', sans-serif; font-size: 11px; font-weight: 600; background: none; border: none; color: rgba(255,255,255,0.22); cursor: pointer; text-transform: uppercase; letter-spacing: 1px; padding: 2px 4px; }
  #peek-btn:hover { color: rgba(255,255,255,0.55); }
  #peek-answer { display: none; font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 3px; max-width: 220px; text-align: right; line-height: 1.4; }
  #peek-answer.visible { display: block; }

  /* EXPLAIN PANEL */
  #explain-panel { position: fixed; top: 0; right: -440px; width: 420px; height: 100vh; background: #1a0a2a; border-left: 2px solid var(--gold); z-index: 300; display: flex; flex-direction: column; transition: right 0.35s ease; }
  #explain-panel.open { right: 0; }
  #explain-header { background: #2a1040; border-bottom: 1px solid var(--gold); padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; font-family: 'Anton', sans-serif; font-size: 15px; letter-spacing: 2px; color: var(--gold); flex-shrink: 0; }
  #explain-close { background: none; border: none; color: rgba(255,255,255,0.5); font-size: 18px; cursor: pointer; }
  #explain-close:hover { color: white; }
  #explain-body { padding: 20px 18px; font-family: 'Barlow', sans-serif; font-size: 15px; line-height: 1.75; color: rgba(255,255,255,0.88); overflow-y: auto; flex: 1; }
  .explain-q { font-size: 12px; color: var(--gold); font-weight: 600; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 1px; }
  .explain-a { font-size: 13px; color: #7dd87d; font-weight: 600; margin-bottom: 14px; }
  .explain-text { font-size: 15px; line-height: 1.75; color: rgba(255,255,255,0.88); }
</style>
</head>
<body>

<div id="header">
  <div style="display:flex;align-items:center;gap:12px;flex-shrink:0">
    <a href="https://drtremendous.netlify.app/" title="Back to Dr.Tremendous"
       style="display:flex;align-items:center;gap:7px;text-decoration:none;color:var(--gold)">
      <img src="trex.png" alt="" style="height:30px;width:auto;display:block">
      <span style="font-family:'Barlow',sans-serif;font-weight:600;font-size:13px;letter-spacing:1px;white-space:nowrap">Dr.Tremendous</span>
    </a>
    <h1 style="white-space:nowrap">Treme Quiz Bowl Jeopardy</h1>
  </div>
  <div class="round-selector">
    <button class="round-btn active" onclick="switchRound(0)">Round 1</button>

    <button class="round-btn" onclick="switchRound(4)">Round 5</button>
    <button class="round-btn" onclick="switchRound(5)">Round 6</button>
    <button class="round-btn" onclick="switchRound(6)">Round 7</button>

    <button class="round-btn" onclick="switchRound(8)">Round 9</button>
    <button class="round-btn" onclick="switchRound(9)">Round 10</button>
    <button class="round-btn" onclick="switchRound(10)">Round 11</button>

       <a class="round-btn" href="quizbowl-jeopardy-2026.html" style="text-decoration:none;display:inline-block">2026</a>

<div id="board-wrap"><div id="grid" class="normal"></div></div>

<div id="modal-bg">
  <div id="modal">
    <div id="m-cat"></div>

    <div id="m-clue"></div>
    <div id="m-choices"></div>
    <div id="m-answer"></div>
    <div id="steal-banner"></div>
    <div id="timer-ring-wrap">
      <svg id="timer-svg" viewBox="0 0 120 120">
        <circle id="timer-track" cx="60" cy="60" r="55"/>
        <circle id="timer-arc"   cx="60" cy="60" r="55"/>
        <text   id="timer-num"   x="60"  y="60">13</text>
      </svg>
    </div>
    <div class="btn-row">
      <button class="mbtn mbtn-reveal"  id="btn-reveal"  onclick="revealAnswer()" style="display:none">Reveal Answer</button>
      <button class="mbtn mbtn-buzz"    id="btn-buzz"    onclick="startBuzz()" style="display:none">⏱ Buzz In</button>
      <button class="mbtn mbtn-nosteal" id="btn-noanswer" onclick="markQuestionDead(false)" style="display:none">No Answer</button>

<script>
const categories = ["Micro","Macro","Management","Marketing","Quantitative","Policy","Finance","Potpourri"];
const points = [5,10,15,20,25];
const CIRC = 2 * Math.PI * 55;

// ─── ROUND DATA ───────────────────────────────────────────────────────────────
const rounds = [

  // ── ROUND 1 ──
  {
    "Micro":[
      {clue:"A minimum price established by law is often called this.",answer:"A price floor",explain:"A price floor is a government-imposed minimum price below which a good cannot legally be sold. It is typically set above the equilibrium price to support producers — the classic example is minimum wage in labor markets. When the floor is above equilibrium, it creates a surplus because quantity supplied exceeds quantity demanded."},
      {clue:"The highest valued alternative that must be sacrificed as a result of choosing a particular option is called this.",answer:"Opportunity cost",explain:"Opportunity cost is the value of the next-best alternative you give up when making a decision. It captures the idea that resources are scarce and every choice involves a tradeoff. For example, going to college has an opportunity cost of the wages you could have earned working full-time instead."},
      {clue:"What is a graphical representation showing various combinations of two goods that provide the same level of satisfaction to a consumer?",answer:"Indifference curve",choices:["A. Production possibilities frontier","B. Budget constraint line","C. Indifference curve","D. Demand curve"],explain:"An indifference curve maps all combinations of two goods that yield the same total utility to a consumer, so they are indifferent between any point on the curve. Curves further from the origin represent higher utility. The slope of the curve is the marginal rate of substitution — the rate at which the consumer is willing to trade one good for the other."},
      {clue:"The result of dividing total fixed cost by the level of output is called this.",answer:"Average fixed cost",explain:"Average fixed cost (AFC) is total fixed cost divided by quantity produced. Because fixed costs do not change with output, AFC continuously falls as output rises — this is called the spreading effect. AFC never reaches zero but approaches it asymptotically as production increases."},
      {clue:"What is the difference between long run average variable cost and long run average total cost?",answer:"There is no difference — everything is variable in the long run",explain:"In the long run, all inputs — including capital, plant size, and equipment — can be adjusted. This means there are no fixed costs in the long run, so average variable cost and average total cost are identical. The long-run average cost curve is often depicted as an envelope of short-run average total cost curves."}
    ],
    "Macro":[
      {clue:"What index is commonly used to measure the inflation rate for US consumers?",answer:"Consumer Price Index (CPI)",explain:"The Consumer Price Index measures the average change over time in the prices paid by urban consumers for a market basket of goods and services. It is calculated by the Bureau of Labor Statistics and is the most widely used measure of inflation affecting households. The CPI is used to adjust Social Security payments, tax brackets, and many wage contracts."},
      {clue:"How does GDP account for goods and services whose values are not established by markets, such as household work or volunteer services?",answer:"They are generally ignored — not part of GDP",explain:"GDP measures market transactions, so non-market activities like unpaid household work, volunteer services, and the underground economy are excluded. This is a known limitation of GDP as a welfare measure — two countries with identical GDPs could have very different standards of living if one relies heavily on non-market production."},
      {clue:"The government borrows money to increase spending, which drives up interest rates and reduces private investment. This effect is known as:",answer:"Crowding-out effect",choices:["A. Crowding-out effect","B. Fiscal drag","C. Ricardian equivalence","D. Demand-pull inflation"],explain:"Crowding out occurs when government borrowing increases the demand for loanable funds, pushing interest rates up and making it more expensive for private firms to borrow and invest. This partially offsets the stimulative effect of fiscal policy. The degree of crowding out depends on how sensitive investment is to interest rates and the slope of the LM curve."},
      {clue:"What are the two tools of fiscal policy?",answer:"Taxation and government expenditure",explain:"Fiscal policy refers to the government's use of spending and taxation to influence the economy. Increasing government spending or cutting taxes is expansionary fiscal policy — it raises aggregate demand. Decreasing spending or raising taxes is contractionary. These tools are managed by Congress and the President, distinguishing fiscal from monetary policy."},
      {clue:"Name the four components of aggregate demand.",answer:"Consumption, investment, government spending, net exports",explain:"Aggregate demand (AD) is the total demand for all goods and services in an economy: AD = C + I + G + NX. Consumption (C) is the largest component, driven by household income. Investment (I) includes business spending on capital. Government spending (G) excludes transfer payments. Net exports (NX) is exports minus imports."}
    ],
    "Management":[
      {clue:"Which function of management involves setting objectives and outlining how to achieve them?",answer:"Planning",explain:"Planning is the first and foundational function of management, involving setting organizational goals and determining the best course of action to achieve them. It requires analyzing the current situation, forecasting future conditions, and allocating resources strategically. Without planning, the other management functions — organizing, leading, and controlling — lack direction."},
      {clue:"Which leadership style inspires and motivates employees to innovate and create change?",answer:"Transformational leadership",choices:["A. Transactional leadership","B. Autocratic leadership","C. Transformational leadership","D. Laissez-faire leadership"],explain:"Transformational leaders inspire followers by articulating a compelling vision and appealing to higher ideals rather than just offering rewards. They encourage creativity, challenge the status quo, and develop their followers' potential. Research consistently shows transformational leadership is associated with higher employee satisfaction and organizational performance compared to transactional approaches."},
      {clue:"What management tool involves breaking down goals into specific, measurable, achievable, relevant, and time-bound steps?",answer:"SMART goals",explain:"SMART is an acronym for Specific, Measurable, Achievable, Relevant, and Time-bound. The framework turns vague ambitions into actionable targets — for example, 'increase sales by 10% in Q3' is SMART while 'do better in sales' is not. SMART goals improve accountability, focus effort, and make progress easier to track and evaluate."},
      {clue:"What type of inventory management method focuses on keeping raw material inventory to a minimum and receiving supplies only when needed?",answer:"Just-in-time (JIT) inventory",choices:["A. First-in, first-out (FIFO)","B. Just-in-time (JIT) inventory","C. Last-in, first-out (LIFO)","D. Economic order quantity (EOQ)"],explain:"Just-in-time inventory management, pioneered by Toyota, aims to reduce carrying costs by receiving goods only as they are needed in the production process. This minimizes warehouse space and reduces waste, but it requires highly reliable suppliers and tight coordination. JIT systems are vulnerable to supply chain disruptions, as seen during the COVID-19 pandemic."},
      {clue:"Which management theory classifies needs into five levels, including physiological, safety, social, esteem, and self-actualization?",answer:"Maslow's Hierarchy of Needs",choices:["A. Theory X","B. Maslow's Hierarchy of Needs","C. Herzberg's Two-Factor Theory","D. McGregor's Theory Y"],explain:"Abraham Maslow's 1943 theory proposes that human needs are arranged in a pyramid: physiological needs (food, shelter) must be met before safety needs, which precede social belonging, then esteem, and finally self-actualization. In management, it suggests employees must have basic needs met before higher-order motivators like recognition or meaningful work will drive performance."}
    ],
    "Marketing":[
      {clue:"When shipping goods, what does C.O.D. stand for?",answer:"Cash on delivery",explain:"Cash on delivery (COD) is a payment arrangement where the buyer pays for goods at the time of delivery rather than in advance. It protects buyers from non-delivery but creates risk for sellers if the buyer refuses to pay. COD was historically common in mail-order businesses and is still used in some e-commerce markets, particularly in developing countries."},
      {clue:"An industry with a few interdependent sellers is called this.",answer:"An oligopoly",explain:"An oligopoly is a market structure dominated by a small number of large firms, each of which must consider competitors' reactions when making pricing or output decisions — this interdependence is the defining feature. Examples include the US airline industry, wireless carriers, and major soft drink companies. Oligopolies often result in strategic behavior modeled using game theory."},
      {clue:"Buying a commodity in one market and selling it in another market with a price difference to make a profit is called this.",answer:"Arbitrage",explain:"Arbitrage exploits price differences for the same asset across markets, generating a risk-free profit. In financial markets, arbitrageurs buy where prices are low and simultaneously sell where prices are high, forcing prices to converge. The law of one price states that arbitrage will eliminate persistent price differences in competitive markets."},
      {clue:"Which food marketing channel includes brand names like Pepsi and Doritos?",answer:"National Brand Channel",choices:["A. National Brand Channel","B. Private Label Channel","C. Store Brand Channel","D. Wholesale Channel"],explain:"National brands are marketed directly by manufacturers on a nationwide basis and are typically sold at a premium price point due to heavy advertising investment. They contrast with private label (store brand) products, which are manufactured for and sold under a retailer's own brand. National brands compete on perceived quality and brand equity."},
      {clue:"What can be said about price elasticity of demand if a monopolist is operating at an output level that maximizes profit?",answer:"Demand is elastic",choices:["A. Demand is elastic","B. Demand is inelastic","C. Demand is unit elastic","D. Cannot be determined"],explain:"A profit-maximizing monopolist always operates in the elastic portion of its demand curve (where |Ed| > 1). This is because marginal revenue is positive only when demand is elastic — if demand were inelastic, the monopolist could raise price and increase total revenue, meaning it was not yet at the profit-maximizing point."}
    ],
    "Quantitative":[
      {clue:"The statistical name for an average.",answer:"Mean",explain:"The mean is the arithmetic average, calculated by summing all values and dividing by the number of observations. It is the most commonly used measure of central tendency but is sensitive to outliers. For skewed distributions, the median may be a better measure of the 'typical' value."},
      {clue:"The likelihood or chance that a particular event will occur is called this.",answer:"Probability",explain:"Probability quantifies uncertainty, ranging from 0 (impossible) to 1 (certain). It can be interpreted as the long-run relative frequency of an event in repeated trials (frequentist view) or as a degree of belief (Bayesian view). The rules of probability — addition, multiplication, and complement rules — form the foundation of statistical inference."},
      {clue:"In a normal population, what percent of observed values should be within 2 standard deviations of the mean?",answer:"95 percent",explain:"This is the empirical rule (68-95-99.7 rule) for normal distributions: approximately 68% of values fall within 1 standard deviation, 95% within 2, and 99.7% within 3. This rule underpins the construction of 95% confidence intervals and is fundamental to hypothesis testing in applied econometrics and statistics."},
      {clue:"What type of graph uses circles to represent variables within a rectangular universe?",answer:"Venn diagram",choices:["A. Venn diagram","B. Bar chart","C. Scatter plot","D. Histogram"],explain:"Venn diagrams use overlapping circles to show logical relationships between sets. The overlap (intersection) represents elements belonging to both sets, while the union covers all elements in either set. They are commonly used in probability to illustrate joint and conditional probabilities and in logic to visualize set operations."},
      {clue:"What Greek letter is commonly used to denote a difference between two numbers or a change in a variable?",answer:"Delta (Δ)",choices:["A. Alpha","B. Beta","C. Delta","D. Gamma"],explain:"Delta (Δ) is the Greek letter used in mathematics and economics to denote change or difference — for example, ΔY/ΔX represents the change in Y for a given change in X, which is the slope of a linear function. In calculus this extends to derivatives. Lowercase delta (δ) is also used in some contexts, while uppercase Delta is standard for discrete changes."}
    ],
    "Policy":[
      {clue:"In Canadian farm policy, the acronym GRIP stands for:",answer:"Gross Revenue Insurance Program",explain:"GRIP was a Canadian agricultural safety net program that guaranteed farmers a minimum level of gross revenue based on historical averages, protecting against both price and yield risks simultaneously. It combined crop insurance with price stabilization elements. Programs like GRIP reflect the broader challenge governments face in stabilizing farm income without creating market distortions."},
      {clue:"The US's EEP program would be an example of what type of trade policy?",answer:"Export subsidy",explain:"The Export Enhancement Program (EEP) was a US agricultural policy that provided bonuses to exporters to help US commodities compete in world markets at prices below domestic levels. Export subsidies are controversial because they depress world prices, harm competing exporters in other countries, and are restricted under WTO agreements."},
      {clue:"The difference between the price actually paid for a good and the maximum amount that a consumer is willing to pay is called this.",answer:"Consumer surplus",explain:"Consumer surplus measures the net benefit consumers receive from a transaction — it's the area below the demand curve and above the market price. It is a key measure of economic welfare in policy analysis. Policies that raise prices (like tariffs or price floors) reduce consumer surplus, while policies that lower prices increase it."},
      {clue:"A domestic agricultural policy tool that limits the quantity of a commodity that can be sold in a market.",answer:"Market quota",explain:"Market quotas restrict the total quantity of a commodity that can be sold, effectively creating an artificial scarcity that supports higher prices. They are used in programs like US tobacco and peanut quotas historically. Quotas create quota rents — benefits to quota holders — and can lead to inefficiency if quotas are not tradeable."},
      {clue:"Riparian Rights and Prior Appropriation are examples of:",answer:"Doctrines used for water rights",choices:["A. Doctrines used for water rights","B. Land tenure systems","C. Agricultural trade policies","D. Property tax classifications"],explain:"Riparian rights grant water use to landowners adjacent to a water source, common in the eastern US where water is relatively abundant. Prior appropriation, common in the arid western US, allocates water based on 'first in time, first in right' — senior users have priority in times of scarcity. These doctrines have major implications for agricultural water allocation and conflict."}
    ],
    "Finance":[
      {clue:"What are the resources owned and controlled by the business called?",answer:"Assets",explain:"Assets are economic resources owned or controlled by a firm that are expected to provide future economic benefits. They are listed on the left side of the balance sheet and classified as current (convertible to cash within a year, like inventory and receivables) or long-term (like property, plant, and equipment). Assets must equal liabilities plus owners' equity by the accounting equation."},
      {clue:"An interest expense of $12,000 per year on a $100,000 loan implies a simple APR of:",answer:"12 percent",explain:"Simple APR (Annual Percentage Rate) is calculated as annual interest divided by the principal: $12,000 / $100,000 = 0.12, or 12%. APR is distinguished from APY (Annual Percentage Yield), which accounts for compounding. Lenders are legally required to disclose APR so borrowers can compare loan costs on a standardized basis."},
      {clue:"The prime interest rate is defined as:",answer:"The interest rate banks charge their best customers",explain:"The prime rate is the benchmark interest rate that commercial banks charge their most creditworthy — typically large corporate — borrowers. It is typically set about 3 percentage points above the federal funds rate and moves in tandem with Fed policy decisions. Consumer loan rates, like credit cards and home equity lines, are often expressed as prime plus a spread."},
      {clue:"The current ratio is calculated by dividing these two items.",answer:"Current assets divided by current liabilities (CA/CL)",explain:"The current ratio measures short-term liquidity — a firm's ability to pay obligations due within a year using assets that can be converted to cash within a year. A ratio above 1.0 means current assets exceed current liabilities. A ratio that is too high may indicate inefficient use of assets, while a ratio below 1.0 signals potential liquidity problems."},
      {clue:"The adjusted basis of an asset for tax purposes is determined by:",answer:"Cost basis less depreciation",explain:"Adjusted basis starts with the original cost basis of an asset and subtracts accumulated depreciation deductions taken over the asset's life. When the asset is sold, capital gain or loss is calculated as the sale price minus the adjusted basis. This is important because depreciation deductions reduce basis, meaning selling a fully depreciated asset for any positive price generates a taxable gain."}

  // ── ROUND 2 ──
  {
    "Micro":[
      {clue:"The type of demand that represents desire backed up by the willingness to pay is called this.",answer:"Effective demand",explain:"Effective demand distinguishes actual market demand — backed by purchasing power — from mere desire or need without the ability to pay. It is the foundation of market analysis because prices are determined by what consumers are both willing and able to pay. John Maynard Keynes also used the term in a macroeconomic sense to describe total spending in an economy."},
      {clue:"Average Physical Product (APP) is determined by dividing total output by this.",answer:"The level of input (X)",explain:"Average Physical Product measures output per unit of input — total physical product (TPP) divided by the quantity of input used. It shows the average productivity of each unit of input. APP rises when marginal product exceeds it and falls when marginal product falls below it, so the APP curve intersects the MPP curve at APP's maximum."},
      {clue:"Measuring elasticity by taking the average price elasticity between two points on the demand curve is called this.",answer:"Arc elasticity",explain:"Arc elasticity calculates elasticity between two distinct points on a demand curve using the midpoint (average) of price and quantity as the base, avoiding the problem of getting different values depending on which point is used as the starting point. It is the most common method for estimating elasticity from observed price-quantity data."},
      {clue:"An industry that experiences higher resource costs as output expands is called this.",answer:"An increasing cost industry",explain:"In an increasing cost industry, as the industry expands output (attracting more firms), input prices rise — often because inputs are specialized or limited in supply. This causes each firm's cost curves to shift up, so the long-run supply curve slopes upward. It contrasts with constant cost industries (flat supply) and decreasing cost industries (downward-sloping)."},
      {clue:"Assume a total cost function: TC = 25 + 4.5Q. What happens to total cost when Q increases by 10 units?",answer:"TC increases by $45",explain:"In the linear cost function TC = 25 + 4.5Q, the fixed cost is $25 (the constant) and the variable cost per unit is $4.50 (the coefficient on Q). When Q rises by 10, total variable cost rises by 4.5 × 10 = $45. Fixed costs don't change, so total cost rises by exactly $45. The marginal cost is constant at $4.50 per unit."}
    ],
    "Macro":[
      {clue:"Economic thought which suggests the government ought to play a very limited role in the economy is called this.",answer:"Laissez-faire",explain:"Laissez-faire, French for 'let do' or 'leave alone,' is the economic philosophy that markets function best with minimal government intervention. Associated with Adam Smith and classical economics, it argues that the invisible hand of market competition allocates resources efficiently without central direction. It contrasts sharply with Keynesian economics, which advocates active fiscal policy."},
      {clue:"If a country's imports exceed exports, the country is said to have:",answer:"A balance of trade deficit",explain:"A trade deficit (negative net exports) means a country is buying more from abroad than it is selling, which requires borrowing from or selling assets to foreign nations. The US has run persistent trade deficits for decades. Trade deficits are not inherently bad — they can reflect strong domestic demand — but they do represent claims on future national income."},
      {clue:"What is it called when an increase in the money supply fails to reduce interest rates and stimulate economic growth?",answer:"Liquidity trap",choices:["A. Inflation spiral","B. Liquidity trap","C. Fiscal cliff","D. Crowding out"],explain:"A liquidity trap occurs when interest rates are already near zero and people hoard money rather than invest or spend, making monetary policy ineffective. Keynes described this as a situation where monetary expansion fails to stimulate the economy. Japan's 'lost decade' in the 1990s and the period after the 2008 financial crisis are often cited as examples."},
      {clue:"The demand for money can be divided into two components. What are they?",answer:"Transactions demand and asset (speculative) demand",explain:"Transactions demand for money arises from the need to pay for everyday purchases — it is positively related to income. Asset (speculative) demand arises from the desire to hold money as a store of value rather than riskier assets — it is inversely related to the interest rate. Together they form total money demand, which is the foundation of the LM curve in IS-LM analysis."},
      {clue:"The Federal Open Market Committee decides to SELL government securities. This is an example of:",answer:"Contractionary monetary policy",explain:"When the Fed sells government securities, banks pay for them, reducing bank reserves and shrinking the money supply. This tends to raise interest rates, reducing borrowing and spending — a contractionary effect aimed at fighting inflation. Open market operations are the Fed's primary monetary policy tool, with buying securities being expansionary and selling being contractionary."}
    ],
    "Management":[
      {clue:"The process whereby a manager assigns responsibility to others along with the needed authority to carry out the task is called this.",answer:"Delegation",explain:"Delegation is the process of assigning tasks, authority, and accountability to subordinates. Effective delegation multiplies a manager's capacity, develops employees' skills, and empowers teams. The key principle is that authority must match responsibility — a manager cannot hold someone accountable for a task without giving them the authority needed to accomplish it."},
      {clue:"What are the three levels of management in a typical organization?",answer:"Top-level, middle-level, and first-line (supervisory) management",explain:"Top-level managers (CEO, CFO) set overall strategy and organizational direction. Middle managers translate strategy into operational plans and coordinate departments. First-line (supervisory) managers directly oversee frontline employees and day-to-day operations. Each level has distinct responsibilities, time horizons, and skill emphases — conceptual skills matter most at the top, technical skills at the front line."},
      {clue:"Which conflict resolution style involves finding a mutually acceptable solution where both parties give up something?",answer:"Compromising",choices:["A. Avoiding","B. Competing","C. Compromising","D. Accommodating"],explain:"Compromising is a conflict resolution strategy where each party gives up something to reach a mutually acceptable middle ground. It is appropriate when parties have equal power, when a temporary settlement is needed, or when collaboration has failed. It differs from collaborating (win-win) and differs from accommodating (one party gives in completely)."},
      {clue:"Which management tool uses a diagram to map out tasks, timelines, and dependencies in project management?",answer:"Gantt chart",choices:["A. Gantt chart","B. Decision tree","C. Balanced Scorecard","D. PERT chart"],explain:"A Gantt chart is a horizontal bar chart that displays project tasks along a timeline, showing start and end dates, duration, and sometimes dependencies between tasks. Developed by Henry Gantt in the early 1900s, it remains one of the most widely used project management tools. Modern software like Microsoft Project and Asana generate dynamic Gantt charts automatically."},
      {clue:"What does PERT stand for, and what is a PERT analysis used for?",answer:"Program Evaluation and Review Technique — planning and controlling a project",explain:"PERT was developed by the US Navy in the 1950s for the Polaris submarine missile program. It maps all project activities as a network, identifies dependencies, and calculates the critical path — the longest sequence of tasks that determines the minimum project duration. PERT also incorporates probabilistic time estimates (optimistic, most likely, pessimistic) to account for uncertainty."}
    ],
    "Marketing":[
      {clue:"What type of analysis focuses on historic price patterns as a tool for predicting price behavior?",answer:"Technical analysis",explain:"Technical analysis uses historical price and volume data — charts, trend lines, and indicators — to forecast future price movements, based on the premise that past patterns repeat. It contrasts with fundamental analysis, which values assets based on underlying economic factors. Technical analysis is widely used in commodity and futures markets, including agricultural commodities."},
      {clue:"What name is commonly given to products that are priced below cost to attract customers into a store?",answer:"Loss leaders",choices:["A. Discount goods","B. Loss leaders","C. Promotional items","D. Clearance products"],explain:"Loss leaders are products sold at or below cost intentionally to draw customers into a store, with the expectation that they will purchase other, more profitable items. Grocery stores commonly use this strategy with staples like milk or bread. Loss leader pricing can be anticompetitive if used to drive out rivals, making it legally restricted in some states."},
      {clue:"What is known about a call option's strike price if it is above the underlying futures price?",answer:"The option is out of the money",explain:"A call option gives the holder the right to buy at the strike price. If the strike price exceeds the current futures price, exercising the option would mean paying more than the market price — so the option has no intrinsic value and is 'out of the money.' It still has time value if expiration is in the future. An option is 'in the money' when exercising it is immediately profitable."},
      {clue:"The four stages in the product life cycle are:",answer:"Introduction, growth, maturity, and decline",explain:"The product life cycle (PLC) describes how a product's sales and profits evolve over time. Introduction involves high costs and low sales as awareness builds. Growth sees rapid sales increases as the market expands. Maturity is the longest stage, with peak sales and intense competition. Decline occurs as substitutes emerge or consumer preferences shift. Marketing strategies should change with each stage."},
      {clue:"What law states that under competitive market conditions, all prices within a market are equalized due to arbitrage?",answer:"Law of One Price (LOOP)",explain:"The Law of One Price states that in competitive markets with no transaction costs or trade barriers, identical goods must sell for the same price everywhere when expressed in the same currency. Arbitrage — buying low and selling high across locations — enforces this equality. Purchasing Power Parity (PPP) is an international application of LOOP to exchange rates."}
    ],
    "Quantitative":[
      {clue:"The numerator refers to what part of a fraction?",answer:"The top part",explain:"In a fraction, the numerator is the top number representing the part being counted, while the denominator (bottom) represents the total. For example, in 3/4, the numerator 3 indicates three parts out of four. In statistics, many key ratios like the t-statistic have a numerator representing the effect size and a denominator representing variability."},
      {clue:"A range estimate with a specified level of reliability describes this.",answer:"A confidence interval",explain:"A confidence interval provides a range of plausible values for a population parameter, along with a confidence level (typically 95%). A 95% CI means that if we repeated the sampling procedure many times, 95% of the constructed intervals would contain the true parameter. It is more informative than a point estimate because it conveys both the estimate and its precision."},
      {clue:"The number of independent observations used in calculating a statistic is referred to as:",answer:"Degrees of freedom",explain:"Degrees of freedom (df) represent the number of independent pieces of information available to estimate a parameter. When estimating a mean, df = n - 1 because one constraint (the sample mean itself) is used. Degrees of freedom affect which t-distribution to use in hypothesis tests — smaller samples have fewer df and fatter tails, reflecting greater uncertainty."},
      {clue:"What distribution provides good approximations of the binomial distribution when the probability of success is small and the number of trials is large?",answer:"Poisson distribution",explain:"The Poisson distribution models the number of rare events occurring in a fixed interval of time or space. It is parameterized by λ (the average rate), and when a binomial distribution has large n and small p, the Poisson with λ = np provides a good approximation. Applications include modeling insurance claims, equipment failures, and arrivals at a service point."},
      {clue:"When observations are not symmetrically distributed around the mean, the problem is called this.",answer:"Skewness",choices:["A. Skewness","B. Kurtosis","C. Variance","D. Dispersion"],explain:"Skewness measures the asymmetry of a distribution. A positively skewed distribution has a long right tail (mean > median), common in income distributions. A negatively skewed distribution has a long left tail. In regression, skewed residuals can violate OLS assumptions and affect inference. Skewness is measured by the third standardized moment of the distribution."}
    ],
    "Policy":[
      {clue:"Name the controversial U.S. Act originally enacted in 1973 to protect endangered and threatened species.",answer:"Endangered Species Act",explain:"The Endangered Species Act (ESA) prohibits federal agencies from taking actions that jeopardize listed species and makes it illegal to 'take' (harm, harass, or kill) endangered animals. It is administered by the US Fish & Wildlife Service and NOAA. The ESA has been controversial because species protection can conflict with agricultural, development, and resource extraction activities, raising issues of regulatory takings and economic costs."},
      {clue:"In U.S. agricultural policy, what does the acronym CCC stand for?",answer:"Commodity Credit Corporation",explain:"The Commodity Credit Corporation is a government-owned corporation administered by USDA that finances price and income support programs for farmers. It provides loans, purchases, and payments under farm bill programs. The CCC is the funding mechanism behind many commodity programs — when prices fall below loan rates, farmers can forfeit their crop to the CCC instead of repaying loans."},
      {clue:"When no one is found to be legally entitled, title to property reverts to the government. What is this called?",answer:"Escheat",choices:["A. Eminent domain","B. Foreclosure","C. Escheat","D. Reversion"],explain:"Escheat is the reversion of property to the state when no legal owner or heirs can be found. It applies to unclaimed bank accounts, abandoned property, and estates without heirs. In the US, states have escheat laws requiring financial institutions to turn over unclaimed assets after a dormancy period. It originates from feudal English law where property reverted to the lord."},
      {clue:"Labeling of agricultural chemicals is based on efficacy and safety. What is efficacy?",answer:"Ability to control the targeted pest (effectiveness)",explain:"In the context of pesticide regulation, efficacy refers to whether a product actually does what it claims — controlling the target pest, weed, or disease effectively. The EPA evaluates both safety (toxicology and environmental risk) and efficacy when registering pesticides. A product can be safe but fail registration if it doesn't work, and it can be effective but fail if it poses unacceptable risks."},
      {clue:"In water quality assessment, the acronym TMDL stands for:",answer:"Total Maximum Daily Load",explain:"A Total Maximum Daily Load is the maximum amount of a pollutant that a water body can receive while still meeting water quality standards. Established under the Clean Water Act, TMDLs are calculated for impaired water bodies and allocate pollution loads among point sources (like factories) and nonpoint sources (like agricultural runoff). They are a key regulatory tool for watershed management."}
    ],
    "Finance":[
      {clue:"The interest rate used by the Federal Reserve to implement US monetary policy is called this.",answer:"The discount rate",explain:"The discount rate is the interest rate the Federal Reserve charges commercial banks for short-term loans through its discount window. Lowering the discount rate makes borrowing cheaper for banks, encouraging lending and expanding the money supply. It is one of three main monetary policy tools alongside open market operations and reserve requirements, though open market operations are used most frequently."},
      {clue:"The three R's of credit — Risk, Return, and Repayment — are used to determine:",answer:"Credit worthiness of borrowers",explain:"The 3 Rs of credit assess whether a borrower is a sound lending risk. Risk evaluates the probability of default, often through credit scores and collateral. Return considers whether the interest income justifies the risk. Repayment capacity looks at cash flow and income to ensure the borrower can service the debt. Lenders use these factors alongside the traditional 5 Cs of credit (character, capacity, capital, collateral, conditions)."},
      {clue:"When a firm sells a capital asset for a price higher than the cost, the positive difference is called:",answer:"Capital gains",explain:"A capital gain is realized when an asset is sold for more than its purchase price (cost basis). Long-term capital gains (on assets held over a year) are taxed at preferential rates in the US, while short-term gains are taxed as ordinary income. For depreciable business assets, the gain may be subject to depreciation recapture, taxed as ordinary income up to the amount of depreciation taken."},
      {clue:"How would an earnings to sales ratio be calculated?",answer:"Net income divided by sales",explain:"The earnings-to-sales ratio (also called net profit margin) measures how much net income is generated for every dollar of revenue: Net Income / Sales. It indicates overall profitability and efficiency in converting revenue to profit after all expenses. A higher margin means the company retains more profit per dollar of sales. It varies widely by industry — grocery chains have thin margins; software firms have large ones."},
      {clue:"If you receive a bill stating '2/10 net 30,' what does it mean?",answer:"2% discount if paid in 10 days; entire amount due in 30 days",explain:"Trade credit terms like '2/10 net 30' are standard in business-to-business transactions. Taking the discount is almost always financially attractive — a 2% discount for paying 20 days early implies an annualized interest rate of about 36%, far exceeding most borrowing costs. Firms that don't take available early-payment discounts are effectively paying very high implicit interest rates."}

  // ── ROUND 3 ──
  {
    "Micro":[
      {clue:"What law suggests that a larger quantity will be purchased at a lower price, other things being equal?",answer:"Law of Demand",explain:"The Law of Demand states that there is an inverse relationship between price and quantity demanded, holding all else constant (ceteris paribus). It is explained by the substitution effect (higher prices make other goods relatively cheaper) and the income effect (higher prices reduce real purchasing power). Giffen goods are a rare theoretical exception where demand curves slope upward."},
      {clue:"What can generally be said about supply elasticity in the short run relative to the long run?",answer:"More inelastic (or less elastic) in the short run",explain:"Supply is more inelastic in the short run because producers have limited ability to change inputs quickly — capital and plant size are fixed. In the long run, firms can expand capacity, enter or exit, and adjust all inputs, making supply more responsive to price changes (more elastic). This distinction is critical in agricultural markets where crop supply cannot change mid-season."},
      {clue:"When a firm produces where marginal revenue equals marginal cost, it is maximizing this.",answer:"Profit",explain:"The profit-maximizing rule for any firm — competitive or not — is to produce where MR = MC. At this output level, the additional revenue from one more unit exactly equals the additional cost, so there is no gain from producing more or less. This is a foundational concept that applies across all market structures."},
      {clue:"The kinked demand curve suggests that prices in an oligopolistic market tend to:",answer:"Remain unchanged (price rigidity)",explain:"The kinked demand curve model (Sweezy, 1939) explains price rigidity in oligopolies: if one firm raises price, rivals don't follow and it loses customers (elastic response); if it cuts price, rivals match and it gains little (inelastic response). This creates a 'kink' in the demand curve at the current price, with a discontinuity in marginal revenue, meaning costs can change significantly without inducing a price change."},
      {clue:"For an inferior good, an increase in price will have a positive income effect and a negative substitution effect. This phenomenon is known as:",answer:"Giffen's Paradox (Giffen good)",choices:["A. Law of Demand","B. Substitution Effect","C. Giffen's Paradox (Giffen good)","D. Veblen Effect"],explain:"A Giffen good is an extreme inferior good where the income effect of a price increase is so large and positive that it outweighs the negative substitution effect, resulting in an upward-sloping demand curve. The classic example is staple foods like bread or rice for very poor households — as the price rises, they become poorer and must buy even more of the staple and less of more expensive foods."}
    ],
    "Macro":[
      {clue:"If government receipts minus government spending is positive, the result would be called:",answer:"A budget surplus",explain:"A budget surplus occurs when government revenues exceed expenditures in a given period. The US federal government ran surpluses in fiscal years 1998–2001 under the Clinton administration, the only surpluses since 1969. Surpluses reduce the national debt (or slow its growth) and can have a contractionary effect on the economy if they reduce aggregate demand."},
      {clue:"Net Domestic Product (NDP) is equal to GDP less this.",answer:"Depreciation",explain:"NDP = GDP minus capital consumption allowance (depreciation). Depreciation represents the wearing out of the capital stock used in production — GDP measures total output but doesn't account for the capital used up in producing it. NDP is theoretically a better measure of sustainable national income, though it is less commonly used because depreciation is difficult to measure accurately."},
      {clue:"What is the name of the curve that shows the relationship between the tax rate and tax revenue?",answer:"Laffer Curve",choices:["A. Laffer Curve","B. Phillips Curve","C. Kuznets Curve","D. Engel Curve"],explain:"The Laffer Curve, popularized by economist Arthur Laffer in the 1970s, illustrates that tax revenue is zero at both 0% and 100% tax rates, and peaks at some intermediate rate. It was used to argue that cutting high marginal tax rates could increase total revenue by stimulating economic activity — the theoretical basis for 'supply-side economics' in the Reagan era. Empirical evidence for this effect is debated."},
      {clue:"What type of unemployment exists when workers have obsolete job skills?",answer:"Structural unemployment",explain:"Structural unemployment arises from a mismatch between the skills workers have and the skills employers demand, often due to technological change or shifts in the economy. It is longer-lasting than frictional unemployment and requires retraining rather than just job search. Automation, globalization, and industry decline (like coal mining) are major sources of structural unemployment in modern economies."},
      {clue:"Under what circumstances would the sale of a combine not be included in determining GDP?",answer:"If the combine was sold as a used or second-hand piece of equipment",explain:"GDP counts only final goods and services produced during the current period — it does not count the resale of used goods because no new production occurred. When a used combine changes hands, its value was already counted in GDP in the year it was originally manufactured. Only the dealer's commission or service fee for facilitating the used sale would be included in current GDP."}
    ],
    "Management":[
      {clue:"What is the term for the process of hiring, training, and developing employees?",answer:"Staffing",explain:"Staffing is the management function focused on acquiring, deploying, and retaining human resources. It encompasses workforce planning, recruiting, selection, onboarding, training, performance management, and succession planning. Effective staffing is critical to organizational success — research consistently shows that people are among the most important sources of competitive advantage for firms."},
      {clue:"Which leadership style focuses on creating a vision of the future and inspiring employees to achieve it?",answer:"Visionary leadership",explain:"Visionary leaders articulate a compelling picture of the future and align followers around that shared direction. They are particularly effective in times of organizational change or uncertainty, when followers need a clear sense of where they are headed. This style differs from transformational leadership (which focuses on inspiring change) and is closest to the 'authoritative' style in Daniel Goleman's framework of leadership styles."},
      {clue:"Which decision-making style involves managers consulting team members but retaining final decision authority?",answer:"Consultative decision-making",explain:"In consultative decision-making, the manager gathers input, opinions, and information from team members before making a final decision, but does not share decision-making authority. It improves decision quality by incorporating diverse perspectives while maintaining clear accountability. It contrasts with autocratic (no input sought), democratic (group votes), and delegative (subordinate decides) styles."},
      {clue:"This theory proposed by Douglas McGregor assumes employees are self-motivated and seek responsibility.",answer:"Theory Y",choices:["A. Theory Z","B. Theory Y","C. Behavioral Approach","D. Theory X"],explain:"Douglas McGregor's 1960 Theory X vs. Theory Y framework contrasts two views of human nature. Theory X assumes workers are lazy, dislike work, and must be coerced and controlled. Theory Y assumes workers are self-motivated, seek responsibility, and find work naturally fulfilling. Theory Y management — participative, empowering, and trust-based — generally produces better outcomes in knowledge work environments."},
      {clue:"Which advanced management tool measures organizational performance from four perspectives: financial, customer, internal processes, and learning/growth?",answer:"Balanced Scorecard",choices:["A. Balanced Scorecard","B. SWOT Analysis","C. Gantt Chart","D. Six Sigma"],explain:"The Balanced Scorecard, developed by Kaplan and Norton in 1992, moves beyond purely financial metrics to give managers a comprehensive view of organizational health. Financial metrics tell you past results; customer metrics indicate market position; internal process metrics show operational efficiency; and learning/growth metrics capture capability development. Together they translate strategy into a measurable set of performance targets."}
    ],
    "Marketing":[
      {clue:"A request for additional money that a futures trader must deposit to maintain their position is called this.",answer:"Margin call",explain:"A margin call occurs when the value of a futures account falls below the maintenance margin level, requiring the trader to deposit additional funds (variation margin) to bring the account back to the initial margin level. Failure to meet a margin call results in the broker liquidating the position. Margin calls can force traders to exit positions at unfavorable times, amplifying losses."},
      {clue:"An undifferentiated marketing strategy is based upon what assumption about the target market?",answer:"The market has no individual segments and is best served with a single marketing mix",explain:"An undifferentiated (mass market) strategy treats all consumers as essentially similar and offers one product with one marketing mix to the entire market. It maximizes economies of scale in production and marketing. It was common in early mass production eras (Ford's Model T) but is increasingly rare as consumer preferences have diversified and data-driven targeting has become cost-effective."},
      {clue:"Under what specific circumstances would an increase in demand raise the equilibrium price but not the equilibrium quantity?",answer:"When supply is perfectly inelastic",choices:["A. When supply is perfectly inelastic","B. When demand is perfectly elastic","C. When supply is perfectly elastic","D. When demand is unit elastic"],explain:"When supply is perfectly inelastic (a vertical supply curve), quantity supplied cannot change regardless of price. An increase in demand shifts the demand curve right, but since no additional quantity can be produced, the entire adjustment falls on price — it rises with no change in quantity. This is relevant for fixed-supply goods like land in a specific location or tickets to a sold-out event."},
      {clue:"The functional approach to food marketing focuses on:",answer:"The major specialized activities performed: exchange, physical, and facilitating functions",explain:"The functional approach to food marketing categorizes marketing activities by what they do. Exchange functions include buying and selling. Physical functions include storage, transportation, and processing — activities that change the form, place, or time utility of products. Facilitating functions include financing, risk management (hedging), market information, and standardization/grading. This framework helps analyze the costs and efficiency of the marketing system."},
      {clue:"The current futures price of Dec wheat is 320 cents. A 310 put with a premium of 14 cents has an implied time value of:",answer:"14 cents",explain:"A 310 put option gives the right to sell at 310 cents. With the futures at 320 cents, this put is out of the money — exercising it would mean selling at 310 when the market is at 320, so intrinsic value = 0. The entire 14-cent premium is therefore time value, reflecting the probability that prices could fall below 310 before expiration. Time value = Premium - Intrinsic Value = 14 - 0 = 14 cents."}
    ],
    "Quantitative":[
      {clue:"What statistical distribution is associated with the bell-shaped curve?",answer:"Normal distribution",explain:"The normal (Gaussian) distribution is symmetric and bell-shaped, completely described by its mean (center) and standard deviation (spread). It is central to statistics because of the Central Limit Theorem: the sampling distribution of the mean approaches normality for large samples regardless of the population's distribution. Many natural phenomena — heights, measurement errors — follow approximately normal distributions."},
      {clue:"In the linear function y = a + bx, the slope of the function is given by the value of what variable?",answer:"b",explain:"In the equation y = a + bx, 'a' is the y-intercept (value of y when x = 0) and 'b' is the slope, representing the change in y for a one-unit increase in x. In regression analysis, 'b' is the estimated coefficient on x and represents the marginal effect of x on y. The sign of b indicates direction; the magnitude indicates strength of the relationship."},
      {clue:"The difference between a normal distribution and a standard normal distribution is that:",answer:"The standard normal has a mean of zero and a standard deviation of one",explain:"Any normal distribution can be converted to a standard normal (Z-distribution) through standardization: Z = (X - μ) / σ. This transformation allows us to use a single standard normal table for any normal distribution. Z-scores tell you how many standard deviations an observation is from the mean, enabling comparison across different scales."},
      {clue:"The omission of an economically relevant variable in an OLS equation leads to what problem with the estimated coefficients?",answer:"Biased parameter estimates",choices:["A. Biased parameter estimates","B. Multicollinearity","C. Heteroskedasticity","D. Perfect collinearity"],explain:"Omitted variable bias (OVB) occurs when a variable that belongs in the regression is left out and is correlated with both the included variable(s) and the dependent variable. The OLS estimator then attributes to the included variable the effect that actually belongs to the omitted variable, causing bias. The direction of bias can often be predicted from the sign of the correlation between the omitted variable and both the included variable and the outcome."},
      {clue:"When using a double-log model to estimate a traditional demand model, what does the coefficient on the price variable directly represent?",answer:"Own price elasticity of demand",explain:"In a double-log (log-linear) demand model — ln(Q) = a + b·ln(P) + ... — the coefficient 'b' on the log of price directly equals the own-price elasticity of demand. This is because d(lnQ)/d(lnP) = (dQ/Q)/(dP/P) = percentage change in Q / percentage change in P, which is the definition of elasticity. This is a key reason economists prefer double-log specifications for demand estimation."}
    ],
    "Policy":[
      {clue:"The value that people place on knowing future generations will have the option to enjoy certain environmental resources is called what?",answer:"Bequest value",explain:"Bequest value is a component of non-use (passive use) value in environmental economics. It reflects people's willingness to pay to preserve resources for their children and future generations, even if they never use the resource themselves. Along with existence value and option value, bequest value contributes to total economic value and is typically measured through contingent valuation surveys."},
      {clue:"How are 'net exports' determined?",answer:"Total exports minus total imports",explain:"Net exports (NX) = Exports (X) - Imports (M). When NX > 0, the country has a trade surplus; when NX < 0, a trade deficit. Net exports are one of the four components of GDP in the expenditure approach (GDP = C + I + G + NX). They reflect a country's international competitiveness, exchange rate effects, and relative economic growth rates compared to trading partners."},
      {clue:"An import duty that must be constantly adjusted to reflect the difference between an internal price target and the world market price is called what?",answer:"A variable levy",explain:"A variable levy automatically adjusts to maintain a target domestic price by changing with world market price fluctuations. When world prices fall, the levy rises to protect domestic producers; when world prices rise, the levy falls. The EU used variable levies extensively under the Common Agricultural Policy before the WTO required conversion to fixed tariffs under the Uruguay Round agreement."},
      {clue:"These are costs or benefits that exist outside of the normal cost/benefit analysis of a market transaction and affect third parties.",answer:"Externalities",explain:"Externalities are spillover effects of economic activities on third parties not involved in the transaction. Negative externalities (like pollution) impose costs on society; positive externalities (like education or vaccination) create benefits beyond the direct parties. Markets fail to account for externalities, leading to overproduction of goods with negative externalities and underproduction of goods with positive externalities."},
      {clue:"What U.S. law, enacted in 1972, is the primary federal regulation governing water pollution?",answer:"The Clean Water Act",explain:"The Clean Water Act established the framework for regulating pollutant discharges into US waters and set water quality standards for surface waters. It requires permits (NPDES permits) for point source discharges and led to major reductions in industrial and municipal water pollution. Section 404 regulates dredge-and-fill activities in wetlands, creating significant implications for agricultural drainage."}
    ],
    "Finance":[
      {clue:"On the balance sheet, how is debt payable within the next accounting period classified?",answer:"As a current liability",explain:"Current liabilities are obligations due within one year (or the operating cycle, whichever is longer). They include accounts payable, accrued expenses, short-term notes payable, and the current portion of long-term debt. The distinction between current and long-term liabilities matters for liquidity analysis — the current ratio and quick ratio both use current liabilities as the denominator."},
      {clue:"The firm should cease production in the short run if the output price is below what per unit?",answer:"Average variable cost",explain:"The shutdown rule says a firm should stop production when price falls below average variable cost (AVC), because at that point revenue doesn't even cover the variable costs of producing. Above AVC but below ATC, the firm loses money but covers variable costs and some fixed costs — so it's better to produce than shut down (fixed costs are sunk). The price = AVC point is the shutdown point on the firm's supply curve."},
      {clue:"What name is commonly given to projected income statements and balance sheets?",answer:"Pro forma",explain:"Pro forma financial statements are forward-looking projections of future financial performance based on assumptions about sales growth, margins, capital expenditures, and financing. They are essential for business planning, loan applications, and investment analysis. The term comes from Latin meaning 'for the sake of form' and signals that the statements are hypothetical rather than historical."},
      {clue:"What is the term for the premium paid on an options contract, representing the right but not the obligation to buy or sell a commodity?",answer:"Option premium",explain:"The option premium is the price paid by the buyer to the seller (writer) for the rights conveyed by the option. It consists of intrinsic value (the immediate exercise value, if any) and time value (reflecting the probability of favorable price movement before expiration). Premiums are determined by the underlying price, strike price, time to expiration, volatility, and the risk-free rate — formalized in the Black-Scholes model."},
      {clue:"With a nominal interest rate of 10.0% and inflation of 2.5%, the real interest rate is about:",answer:"7.5 percent",explain:"The Fisher equation approximates the real interest rate as: real rate ≈ nominal rate − inflation rate = 10% − 2.5% = 7.5%. The exact Fisher equation is (1 + real) = (1 + nominal) / (1 + inflation), which gives 7.32%, but the approximation is commonly used for small rates. The real interest rate represents the actual purchasing power return on an investment after adjusting for inflation."}
