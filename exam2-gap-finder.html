// ── Embedded deterministic supply/demand graph generator ──────────────────────
// Correct-by-construction problems used as live practice for price-control surplus
// misses (Q14 = PS under a floor, Q17 = DWL under a ceiling). No AI: every value
// is exact, every equilibrium is a real Qd = Qs crossing.
function buildSDPool() {
  const pool = [];
  const slopes = [0.5, 1, 1.5, 2];
  const QEs = [4, 5, 6, 8];
  const PEs = [4, 5, 6, 7, 8];
  for (const Qe of QEs)
    for (const Pe of PEs)
      for (const b of slopes)
        for (const d of slopes) {
          const a = Pe + b * Qe, c = Pe - d * Qe;
          if (c < 0 || !Number.isInteger(a) || !Number.isInteger(c)) continue;
          const xint = a / b;
          if (!Number.isInteger(xint) || a > 16 || xint > 16) continue;
          let mFloor = null, mCeil = null;
          for (const m of [1, 2, 3, 4]) {
            const Qd = (a - (Pe + m)) / b, Qsf = ((Pe + m) - c) / d;
            if (mFloor === null && Number.isInteger(Qd) && Number.isInteger(Qsf) && Qd >= 1) mFloor = m;
            const Qsc = ((Pe - m) - c) / d, Qdc = (a - (Pe - m)) / b;
            if (mCeil === null && (Pe - m) >= 1 && Number.isInteger(Qsc) && Number.isInteger(Qdc) && Qsc >= 1) mCeil = m;
          }
          pool.push({ Qe, Pe, a, b, c, d, xint, mFloor, mCeil });
        }
  return pool;
}
const SD_POOL = buildSDPool();
const sdFmt = (x) => (Number.isInteger(x) ? String(x) : x.toFixed(2));

// Clip a line P = cy + m(Q − cx) to the box; return two endpoints.
function clipLineR(cx, cy, m, Qmax, Pmax) {
  const pts = [];
  const push = (q, p) => { if (q >= -1e-6 && q <= Qmax + 1e-6 && p >= -1e-6 && p <= Pmax + 1e-6) pts.push([q, p]); };
  push(0, cy + m * (0 - cx));
  push(Qmax, cy + m * (Qmax - cx));
  push(cx + (0 - cy) / m, 0);
  push(cx + (Pmax - cy) / m, Pmax);
  const uniq = [];
  pts.forEach((p) => { if (!uniq.some((u) => Math.abs(u[0] - p[0]) < 1e-3 && Math.abs(u[1] - p[1]) < 1e-3)) uniq.push(p); });
  return uniq.slice(0, 2);
}
function makeElCfg() {
  return {
    type: Math.random() < 0.5 ? "demand" : "supply",
    ask: Math.random() < 0.5 ? "elastic" : "inelastic",
    flat: Math.random() < 0.5 ? 0.4 : 0.5,
    steep: Math.random() < 0.5 ? 1.5 : 2,
    flatIsA: Math.random() < 0.5,
  };
}

  const Y = (p) => mT + plotH - (p / Pmax) * plotH;
  const sign = type === "demand" ? -1 : 1;
  const lineA = clipLineR(cx, cy, (flatIsA ? flat : steep) * sign, Qmax, Pmax);
  const lineB = clipLineR(cx, cy, (flatIsA ? steep : flat) * sign, Qmax, Pmax);
  const answer = ask === "elastic" ? (flatIsA ? "A" : "B") : (flatIsA ? "B" : "A");

  const end = (l) => l[1] || l[0];

        <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: "#9a906f" }}>{q ? `from Q${q} · ` : ""}generated fresh</span>
      </div>
      {q && <p style={{ fontSize: 13, color: "#6a6450", margin: "4px 0 0" }}>You missed <strong>Q{q}</strong> ({skill}). Here's a fresh version.</p>}
      <p style={{ fontSize: 15, margin: "8px 0 12px" }}>Two {type} curves are shown. <strong>Which curve is more {ask}?</strong></p>
      <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", height: "auto", maxWidth: 440 }}>
        <line x1={X(0)} y1={Y(0)} x2={X(Qmax)} y2={Y(0)} stroke={NAVY} strokeWidth={1.5} />
        <line x1={X(0)} y1={Y(0)} x2={X(0)} y2={Y(Pmax)} stroke={NAVY} strokeWidth={1.5} />
        <text x={X(Qmax)} y={Y(0) + 28} fontSize={12} textAnchor="end" fill={NAVY} fontWeight={600}>Quantity</text>
        <text x={X(0) - 32} y={Y(Pmax) - 4} fontSize={12} fill={NAVY} fontWeight={600}>Price</text>
        <line x1={X(lineA[0][0])} y1={Y(lineA[0][1])} x2={X(lineA[1][0])} y2={Y(lineA[1][1])} stroke={cA} strokeWidth={2.5} />
        <line x1={X(lineB[0][0])} y1={Y(lineB[0][1])} x2={X(lineB[1][0])} y2={Y(lineB[1][1])} stroke={cB} strokeWidth={2.5} />
        <text x={X(end(lineA)[0]) + 6} y={Y(end(lineA)[1])} fontSize={15} fill={cA} fontWeight={700} stroke="#fff" strokeWidth={3.5} paintOrder="stroke" strokeLinejoin="round">A</text>
        <text x={X(end(lineB)[0]) + 6} y={Y(end(lineB)[1])} fontSize={15} fill={cB} fontWeight={700} stroke="#fff" strokeWidth={3.5} paintOrder="stroke" strokeLinejoin="round">B</text>
      </svg>
      <div style={{ display: "flex", gap: 10, marginTop: 10, flexWrap: "wrap" }}>

        <button onClick={() => { setCfg(makeElCfg()); setReveal(false); }} style={{ fontFamily: "inherit", fontSize: 13, color: NAVY, background: "transparent", border: `1px solid ${NAVY}`, padding: "8px 16px", cursor: "pointer" }}>New graph</button>
      </div>
      {reveal && (
        <p style={{ fontSize: 13.5, marginTop: 12, lineHeight: 1.5 }}>
          <strong>Curve {answer}</strong> is more {ask} — the {ask === "elastic" ? "flatter" : "steeper"} curve, where a {ask === "elastic" ? "small" : "large"} price change brings a {ask === "elastic" ? "large" : "small"} quantity change.
        </p>
      )}
    </div>
  );
}

function pickSD(control) {
  const ok = SD_POOL.filter((p) => (control === "floor" ? p.mFloor : p.mCeil));
  return ok[Math.floor(Math.random() * ok.length)];
}

function ControlGraphPractice({ control, ask, q, skill }) {
  const [prob, setProb] = useState(() => pickSD(control));
  const [reveal, setReveal] = useState(false);
  const { Qe, Pe, a, b, c, d, xint } = prob;

  const P = control === "floor" ? Pe + prob.mFloor : Pe - prob.mCeil;
  const Qd = (a - P) / b, Qs = (P - c) / d;
  const traded = Math.min(Qd, Qs);
  const priceAtTraded = control === "floor" ? c + d * traded : a - b * traded;
  const bindCurve = control === "floor" ? "supply" : "demand";
  const dwlBase = Qe - traded;
  const dwlHeight = control === "floor" ? P - priceAtTraded : priceAtTraded - P;
  const dwl = 0.5 * dwlBase * dwlHeight;
  const CSeq = 0.5 * Qe * (a - Pe), PSeq = 0.5 * Qe * (Pe - c);

  // geometry

        <strong>Scenario.</strong> In this market the free-market equilibrium is a price of <strong>${sdFmt(Pe)}</strong> at <strong>{sdFmt(Qe)} units</strong>.
        The government sets a {control === "floor" ? "price floor" : "price ceiling"} of <strong>${sdFmt(P)}</strong> (the dashed gold line).
        At that price, quantity demanded is {sdFmt(Qd)} and quantity supplied is {sdFmt(Qs)}, so <strong>{sdFmt(traded)} units</strong> actually trade.
      </div>

      <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", height: "auto", maxWidth: 460 }}>

        {Array.from({ length: Math.floor(Qmax / 2) }, (_, i) => (i + 1) * 2).map((q) => <line key={"q" + q} x1={X(q)} y1={Y(0)} x2={X(q)} y2={Y(0) + 5} stroke="#b8ad8e" />)}
        {Array.from({ length: Math.floor(Pmax / 2) }, (_, i) => (i + 1) * 2).map((p) => <line key={"p" + p} x1={X(0)} y1={Y(p)} x2={X(0) - 5} y2={Y(p)} stroke="#b8ad8e" />)}

        {Array.from({ length: Math.floor(Pmax / 2) }, (_, i) => (i + 1) * 2).map((p) => <text key={"pt" + p} x={X(0) - 8} y={Y(p) + 4} fontSize={12} textAnchor="end" fill="#666" fontFamily="'IBM Plex Mono', monospace">{p}</text>)}

        <text x={X(0) - 34} y={Y(Pmax) - 4} fontSize={12} fill={NAVY} fontWeight={600}>Price</text>

        {/* curves */}
        <line x1={X(0)} y1={Y(a)} x2={X(xint)} y2={Y(0)} stroke={DEMAND} strokeWidth={2.5} />
        <line x1={X(0)} y1={Y(c)} x2={X(QsupEnd)} y2={Y(c + d * QsupEnd)} stroke={SUPPLY} strokeWidth={2.5} />
        <text x={X(xint) + 7} y={Y(0) - 7} fontSize={14} fill={DEMAND} fontWeight={700} {...halo}>D</text>
        <text x={X(QsupEnd) + 7} y={Y(c + d * QsupEnd) + 5} fontSize={14} fill={SUPPLY} fontWeight={700} {...halo}>S</text>

        <Dot q={0} p={a} color={DEMAND} />
        <Dot q={0} p={c} color={SUPPLY} />

        {/* equilibrium */}
        <line x1={X(Qe)} y1={Y(0)} x2={X(Qe)} y2={Y(Pe)} stroke="#bbb" strokeDasharray="4 3" />

      <div style={{ display: "flex", gap: 10, marginTop: 10, flexWrap: "wrap" }}>

              <div>  rectangle = {sdFmt(traded)} × ${sdFmt(P - priceAtTraded)} = ${sdFmt(traded * (P - priceAtTraded))}</div>
              <div>  triangle = ½ × {sdFmt(traded)} × ${sdFmt(priceAtTraded - c)} = ${sdFmt(0.5 * traded * (priceAtTraded - c))}</div>
              <div>  <strong>new PS = ${sdFmt(traded * (P - priceAtTraded) + 0.5 * traded * (priceAtTraded - c))}</strong></div>
              <div>new CS = ½ × {sdFmt(traded)} × ${sdFmt(a - P)} = ${sdFmt(0.5 * traded * (a - P))}</div>

              <div>  triangle = ½ × {sdFmt(traded)} × ${sdFmt(a - priceAtTraded)} = ${sdFmt(0.5 * traded * (a - priceAtTraded))}</div>
              <div>  <strong>new CS = ${sdFmt(traded * (priceAtTraded - P) + 0.5 * traded * (a - priceAtTraded))}</strong></div>
              <div>new PS = ½ × {sdFmt(traded)} × ${sdFmt(P - c)} = ${sdFmt(0.5 * traded * (P - c))}</div>
            </>
          )}
          <div style={{ marginTop: 6, color: RED }}><strong>Deadweight loss</strong> = ½ × {sdFmt(dwlBase)} × ${sdFmt(dwlHeight)} = ${sdFmt(dwl)}</div>
        </div>
      )}
    </div>
  );
}

function RemediationTool() {
  const [student, setStudent] = useState("");
  const [view, setView] = useState("student");
  const [missed, setMissed] = useState(() => new Set());
  const [planOpen, setPlanOpen] = useState(false);
  const [practice, setPractice] = useState({}); // lo -> {items} | "failed" | undefined(loading)
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
  const planRef = useRef(null);

  const toggle = (id) =>
    setMissed((prev) => {
      const next = new Set(prev);
      next.has(id) ? next.delete(id) : next.add(id);
      return next;
    });

  // Weak LOs = every LO attached to a missed checkable item, escalated to the
  // hardest difficulty seen for that LO, with an exemplar pool for generation.
  const weakLOs = useMemo(() => {
    const order = { easy: 0, medium: 1, hard: 2 };
    const map = {};
    CHECKABLES.filter((c) => missed.has(c.id)).forEach((c) => {
      c.los.forEach((lo) => {
        if (!map[lo]) map[lo] = { lo, diff: c.diff, items: [], exemplars: [] };
        if (order[c.diff] > order[map[lo].diff]) map[lo].diff = c.diff;
        map[lo].items.push(c.qn);
        map[lo].exemplars.push(c.ex);
      });
    });
    return Object.values(map).sort((a, b) => a.lo.localeCompare(b.lo));
  }, [missed]);

  // Count of missed pure-numerical items → flags a calculation-execution pattern.
  const numericMisses = useMemo(
    () => CHECKABLES.filter((c) => c.numeric && missed.has(c.id)).map((c) => c.qn),
    [missed]
  );
  const calcPattern = numericMisses.length >= 2;

  // Price-control surplus misses → serve a real generated graph of the same control type.
  // Q14 = PS under a price floor; Q17 = DWL under a price ceiling.
  const graphTriggers = useMemo(() => {
    const out = [];
    if (missed.has("q14")) out.push({ kind: "control", q: 14, control: "floor", skill: "producer surplus under a price floor", ask: "calculate the new producer surplus" });
    if (missed.has("q17")) out.push({ kind: "control", q: 17, control: "ceiling", skill: "deadweight loss under a price ceiling", ask: "calculate the deadweight loss" });
    if (missed.has("q10b")) out.push({ kind: "elasticity", q: 10, skill: "identifying an elastic or inelastic curve" });
    return out;
  }, [missed]);

  // Build the plan instantly from the static variant bank — no API, never fails.
  // Each weak objective gets the pre-written variants of its missed (non-graph)
  // questions; objectives whose only misses were graph questions point to the figure.
  function generate() {
    if (weakLOs.length === 0) return;
    setPlanOpen(true);
    const GRAPH_IDS = new Set(["q14", "q17", "q10b"]);
    const next = {};
    weakLOs.forEach((w) => {
      const missedHere = CHECKABLES.filter((c) => missed.has(c.id) && c.los.includes(w.lo));
      const items = missedHere
        .filter((c) => !GRAPH_IDS.has(c.id))
        .map((c) => VARIANTS[c.id])
        .filter(Boolean);
      const hadGraph = missedHere.some((c) => GRAPH_IDS.has(c.id));
      next[w.lo] = items.length ? items : (hadGraph ? "graph" : "failed");
    });
    setPractice(next);
    setTimeout(() => planRef.current?.scrollIntoView({ behavior: "smooth" }), 60);
  }

  // Build the standalone HTML for the plan (used by both print and download).
  function planDocHTML() {
    const node = planRef.current;
    if (!node) return null;
    const clone = node.cloneNode(true);
    clone.querySelectorAll(".noprint, button").forEach((el) => el.remove());
    return (
      '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">' +
      "<title>Study Plan" + (student ? " — " + student : "") + "</title>" +
      '<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">' +
      "<style>body{background:#fff;color:#23283b;font-family:'IBM Plex Sans',system-ui,sans-serif;margin:0;padding:34px;line-height:1.5;}" +
      ".wrap{max-width:820px;margin:0 auto;}</style>" +
      "</head><body><div class=\"wrap\">" + clone.outerHTML + "</div></body></html>"
    );
  }

  // Open the plan in a fresh tab and trigger the print dialog (Save as PDF).
  // A new tab escapes the artifact frame's block on window.print().
  function printPlan() {
    const doc = planDocHTML();
    if (!doc) return;
    const w = window.open("", "_blank");
    if (!w) { downloadPlan(); return; } // pop-up blocked → fall back to a file
    w.document.open();
    w.document.write(doc);
    w.document.close();
    w.focus();
    setTimeout(() => { try { w.print(); } catch (_) {} }, 500);
  }

  // Fallback: save the plan as a self-contained HTML file.
  function downloadPlan() {
    const doc = planDocHTML();
    if (!doc) return;
    const safeName = student ? student.trim().replace(/\s+/g, "-") : "student";
    const blob = new Blob([doc], { type: "text/html" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "study-plan-" + safeName + ".html";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1500);
  }

  // Build a real PDF by snapshotting the rendered plan (figures and all).
  // Requires html2canvas + jsPDF, which are loaded in the standalone HTML build.
  async function generatePDF() {
    const node = planRef.current;
    if (!node || !window.html2canvas || !window.jspdf) return false;
    const { jsPDF } = window.jspdf;
    const canvas = await window.html2canvas(node, {
      scale: 2,
      backgroundColor: "#ffffff",
      useCORS: true,
      ignoreElements: (el) => (el.classList && el.classList.contains("noprint")) || el.tagName === "BUTTON",
    });
    const pdf = new jsPDF({ unit: "pt", format: "letter" });
    const pageW = pdf.internal.pageSize.getWidth();
    const pageH = pdf.internal.pageSize.getHeight();
    const margin = 28;
    const imgW = pageW - margin * 2;
    const imgH = canvas.height * (imgW / canvas.width);
    const img = canvas.toDataURL("image/jpeg", 0.95);
    let heightLeft = imgH;
    let position = margin;
    pdf.addImage(img, "JPEG", margin, position, imgW, imgH);
    heightLeft -= pageH - margin * 2;
    while (heightLeft > 0) {
      pdf.addPage();
      position = margin - (imgH - heightLeft);
      pdf.addImage(img, "JPEG", margin, position, imgW, imgH);
      heightLeft -= pageH - margin * 2;
    }
    const safeName = student ? student.trim().replace(/\s+/g, "-") : "student";
    pdf.save("study-plan-" + safeName + ".pdf");
    return true;
  }

  // Click handler: real PDF when the library is present (standalone HTML),
  // otherwise fall back to print / file download (in-app preview).
  function exportPlan() {
    if (window.html2canvas && window.jspdf) {
      generatePDF().catch(() => printPlan());
    } else {
      printPlan();
    }
  }

  const grouped = useMemo(() => {
    const g = { "6": [], "5": [], "8": [] };
    QUESTIONS.forEach((q) => g[q.unit].push(q));
    return g;
  }, []);

  // Continuous numbering of the text practice questions, so each carries a Q-number
  // and the answer key at the end can reference them in order.
  const numbering = useMemo(() => {
    const map = {}; // `${lo}:${i}` -> running number
    const key = []; // { n, lo, it }
    weakLOs.forEach((w) => {
      const set = practice[w.lo];
      if (Array.isArray(set)) set.forEach((it, i) => { const n = key.length + 1; map[`${w.lo}:${i}`] = n; key.push({ n, it }); });
    });
    return { map, key };
  }, [weakLOs, practice]);

  const missCount = missed.size;

  return (
    <div style={{ background: CREAM, minHeight: "100vh", color: INK, fontFamily: "'IBM Plex Sans', system-ui, sans-serif" }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');
        * { box-sizing: border-box; }
        .qrow { transition: background .12s, border-color .12s; }
        .qrow:hover { background: #fffdf6; }
        @media print { .noprint { display: none !important; } body { background: #fff; } }
        button:focus-visible, input:focus-visible { outline: 2px solid ${GOLD}; outline-offset: 2px; }
      `}</style>

      <div style={{ maxWidth: 1080, margin: "0 auto", padding: "32px 22px 80px" }}>
        {/* Masthead */}
        <header style={{ borderBottom: `3px solid ${NAVY}`, paddingBottom: 18, marginBottom: 8 }}>
          <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, letterSpacing: 2, color: GOLD, textTransform: "uppercase" }}>
            Dr. Tremendous · ARE 201 · Solutions, made visible
          </div>
          <h1 style={{ fontFamily: "'Playfair Display', serif", fontWeight: 800, fontSize: 38, color: NAVY, margin: "6px 0 4px", lineHeight: 1.05 }}>
            Exam 2 Gap Finder
          </h1>
          <p className="noprint" style={{ margin: 0, maxWidth: 620, fontSize: 15, color: "#555" }}>
            Check the questions a student missed. Their weak objectives light up below, each with the exact
            materials to revisit and fresh practice pitched at the level they actually slipped on.
          </p>
        </header>

        {/* View toggle */}
        <div className="noprint" style={{ display: "flex", gap: 0, margin: "18px 0 4px", border: `1px solid ${NAVY}`, width: "fit-content" }}>
          {[
            { k: "student", label: "Student plan" },
            { k: "design", label: "Exam design" },
          ].map((t) => (
            <button
              key={t.k}
              onClick={() => setView(t.k)}
              style={{
                fontFamily: "'IBM Plex Mono', monospace",
                fontSize: 12,
                letterSpacing: 0.5,
                textTransform: "uppercase",
                padding: "8px 18px",
                border: "none",
                cursor: "pointer",
                background: view === t.k ? NAVY : "transparent",
                color: view === t.k ? CREAM : NAVY,
              }}
            >
              {t.label}
            </button>
          ))}
        </div>

        {view === "design" && <DesignPanel />}

        {view === "student" && (
          <>
            {/* Student name */}
        <div className="noprint" style={{ margin: "22px 0 10px", display: "flex", gap: 12, alignItems: "center", flexWrap: "wrap" }}>
          <label style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, letterSpacing: 1, color: NAVY, textTransform: "uppercase" }}>
            Student
          </label>
          <input
            value={student}
            onChange={(e) => setStudent(e.target.value)}
            placeholder="Name (optional, prints on the plan)"
            style={{ flex: "1 1 280px", padding: "9px 12px", border: `1px solid #ccc4ad`, background: "#fff", fontSize: 14, fontFamily: "inherit" }}
          />
        </div>

        {/* Question checklist */}
        <div className="noprint">
          {["6", "5", "8"].map((u) => (
            <section key={u} style={{ marginTop: 22 }}>
              <h2 style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 13, letterSpacing: 1.5, color: NAVY, textTransform: "uppercase", borderBottom: `1px solid ${GOLD}`, paddingBottom: 6, margin: "0 0 4px" }}>
                {UNIT_NAMES[u]}
              </h2>
              {grouped[u].map((q) => {
                if (q.parts) {
                  return (
                    <div key={q.n} style={{ borderBottom: "1px solid #e7e0cd", padding: "8px 10px 6px" }}>
                      <div style={{ display: "flex", gap: 10, alignItems: "baseline", marginBottom: 4 }}>
                        <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontWeight: 500, color: NAVY }}>Q{q.n}</span>
                        <span style={{ fontSize: 14, color: INK }}>{q.topic}</span>
                        <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 10.5, color: "#9a906f" }}>check each part missed</span>
                      </div>
                      {q.parts.map((p) => {
                        const on = missed.has(p.id);
                        return (
                          <label key={p.id} className="qrow" style={{ display: "grid", gridTemplateColumns: "30px 1fr auto", gap: 12, alignItems: "center", padding: "6px 10px 6px 26px", borderLeft: on ? `3px solid ${RED}` : "3px solid transparent", background: on ? "#fbeeea" : "transparent", cursor: "pointer" }}>
                            <input type="checkbox" checked={on} onChange={() => toggle(p.id)} style={{ width: 16, height: 16, accentColor: RED }} />
                            <span style={{ fontSize: 13.5 }}>
                              {p.label}
                              <span style={{ color: "#9a906f", fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, marginLeft: 8 }}>LO {p.los.join(", ")}</span>
                            </span>
                            <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 10.5, letterSpacing: 0.5, textTransform: "uppercase", color: "#fff", background: DIFF_COLOR[p.diff || q.diff], padding: "3px 7px", borderRadius: 2, whiteSpace: "nowrap" }}>
                              {DIFF_LABEL[p.diff || q.diff]}
                            </span>
                          </label>
                        );
                      })}
                    </div>
                  );
                }
                const id = "q" + q.n;
                const on = missed.has(id);
                return (
                  <label key={q.n} className="qrow" style={{ display: "grid", gridTemplateColumns: "30px 44px 1fr auto", gap: 12, alignItems: "center", padding: "9px 10px", borderBottom: "1px solid #e7e0cd", borderLeft: on ? `3px solid ${RED}` : "3px solid transparent", background: on ? "#fbeeea" : "transparent", cursor: "pointer" }}>
                    <input type="checkbox" checked={on} onChange={() => toggle(id)} style={{ width: 17, height: 17, accentColor: RED }} />
                    <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontWeight: 500, color: NAVY }}>Q{q.n}</span>
                    <span style={{ fontSize: 14 }}>
                      {q.topic}
                      <span style={{ color: "#9a906f", fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, marginLeft: 8 }}>LO {q.los.join(", ")}</span>
                    </span>
                    <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 10.5, letterSpacing: 0.5, textTransform: "uppercase", color: "#fff", background: DIFF_COLOR[q.diff], padding: "3px 7px", borderRadius: 2, whiteSpace: "nowrap" }}>
                      {DIFF_LABEL[q.diff]}
                    </span>
                  </label>
                );
              })}
            </section>
          ))}
        </div>

        {/* Action bar */}
        <div className="noprint" style={{ position: "sticky", bottom: 0, background: CREAM, borderTop: `2px solid ${NAVY}`, marginTop: 26, padding: "14px 0", display: "flex", gap: 14, alignItems: "center", flexWrap: "wrap" }}>
          <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 13, color: NAVY }}>
            {missCount} missed · {weakLOs.length} weak objective{weakLOs.length === 1 ? "" : "s"}
          </span>
          <button
            onClick={generate}
            disabled={missCount === 0 || loading}
            style={{
              fontFamily: "'IBM Plex Sans', sans-serif",
              fontWeight: 600,
              fontSize: 14,
              color: missCount === 0 ? "#9a906f" : CREAM,
              background: missCount === 0 ? "#e7e0cd" : NAVY,
              border: "none",
              padding: "11px 22px",
              cursor: missCount === 0 || loading ? "default" : "pointer",
              letterSpacing: 0.3,
            }}
          >
            {loading ? "Building study plan…" : "Build study plan"}
          </button>
          {missCount > 0 && (
            <button
              onClick={() => { setMissed(new Set()); setPlanOpen(false); setPractice({}); setError(""); }}
              style={{ fontFamily: "inherit", fontSize: 13, color: NAVY, background: "transparent", border: `1px solid ${NAVY}`, padding: "10px 16px", cursor: "pointer" }}
            >
              Clear
            </button>
          )}
          {planOpen && !loading && (
            <button
              onClick={exportPlan}
              style={{ fontFamily: "inherit", fontSize: 13, color: NAVY, background: GOLD, border: "none", padding: "11px 18px", cursor: "pointer", fontWeight: 600 }}
            >
              Save as PDF
            </button>
          )}
        </div>

        {error && <p style={{ color: RED, fontSize: 14, marginTop: 14 }}>{error}</p>}

        {/* The plan */}
        {(weakLOs.length > 0 && planOpen) && (
          <div ref={planRef} style={{ marginTop: 34 }}>
            <div style={{ borderTop: `3px solid ${NAVY}`, paddingTop: 18 }}>
              <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, letterSpacing: 2, color: GOLD, textTransform: "uppercase" }}>
                Personalized Study Plan{student ? ` · ${student}` : ""}
              </div>
              <h2 style={{ fontFamily: "'Playfair Display', serif", fontWeight: 800, fontSize: 27, color: NAVY, margin: "4px 0 14px" }}>
                {weakLOs.length} objective{weakLOs.length === 1 ? "" : "s"} to rebuild
              </h2>
              <button className="noprint" onClick={exportPlan} style={{ fontFamily: "inherit", fontWeight: 600, fontSize: 13, color: NAVY, background: GOLD, border: "none", padding: "9px 18px", cursor: "pointer", marginBottom: 18 }}>
                Save as PDF for this student
              </button>
            </div>

            {graphTriggers.map((g, i) =>
              g.kind === "elasticity"
                ? <ElasticityPractice key={i} q={g.q} skill={g.skill} />
                : <ControlGraphPractice key={i} control={g.control} ask={g.ask} q={g.q} skill={g.skill} />
            )}

            {weakLOs.map((w) => {
              const set = practice[w.lo]; // undefined = loading, "failed" = no practice, object = ready
              return (
                <article key={w.lo} style={{ background: "#fff", border: "1px solid #e7e0cd", borderTop: `4px solid ${DIFF_COLOR[w.diff]}`, padding: "18px 20px", marginBottom: 18 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", gap: 12, flexWrap: "wrap" }}>
                    <h3 style={{ fontFamily: "'Playfair Display', serif", fontWeight: 600, fontSize: 20, color: NAVY, margin: 0 }}>
                      Learning Objective {w.lo}
                    </h3>
                    <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: "#5e5640" }}>
                      missed on Q{[...new Set(w.items)].join(", Q")}
                    </span>
                  </div>
                  <p style={{ fontSize: 14.5, color: INK, margin: "8px 0 14px", lineHeight: 1.5 }}>{LO_TEXT[w.lo]}</p>

                  <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 1, color: NAVY, textTransform: "uppercase", marginBottom: 6 }}>
                    Revisit these first
                  </div>
                  <ul style={{ margin: "0 0 16px", paddingLeft: 18, fontSize: 14, lineHeight: 1.6 }}>
                    {(LO_MATERIALS[w.lo] || ["See the unit module page on Moodle."]).map((m, i) => <li key={i}>{m}</li>)}
                  </ul>

                  <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 1, color: NAVY, textTransform: "uppercase", marginBottom: 8 }}>
                    Practice questions
                  </div>
                  {Array.isArray(set) ? (
                    set.map((it, i) => (
                      <div key={i} style={{ marginBottom: 14, paddingLeft: 12, borderLeft: `2px solid ${GOLD}` }}>
                        <div style={{ fontWeight: 600, fontSize: 14, marginBottom: 6 }}>{numbering.map[`${w.lo}:${i}`]}. {it.stem}</div>
                        {it.table && it.table.headers && it.table.rows && (
                          <table style={{ borderCollapse: "collapse", margin: "0 0 8px", fontSize: 13 }}>
                            <thead>
                              <tr>
                                {it.table.headers.map((h, k) => (
                                  <th key={k} style={{ border: "1px solid #d8cfb4", padding: "4px 12px", textAlign: "left", background: "#f2ecda", fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, color: NAVY }}>{h}</th>
                                ))}
                              </tr>
                            </thead>
                            <tbody>
                              {it.table.rows.map((row, r) => (
                                <tr key={r}>
                                  {row.map((cellv, cc) => (
                                    <td key={cc} style={{ border: "1px solid #e7e0cd", padding: "4px 12px", fontFamily: "'IBM Plex Mono', monospace", fontSize: 12.5 }}>{cellv}</td>
                                  ))}
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        )}
                        <ol style={{ margin: 0, paddingLeft: 22, fontSize: 13.5, lineHeight: 1.6, listStyleType: "lower-alpha" }}>
                          {it.options.map((o, j) => (
                            <li key={j} style={{ color: INK }}>{o}</li>
                          ))}
                        </ol>
                      </div>
                    ))
                  ) : set === "graph" ? (
                    <p style={{ fontSize: 13.5, color: INK, margin: 0 }}>
                      Practice this skill on the figure above — it's a graph calculation, so work it on the generated price-control figure.
                    </p>
                  ) : set === "failed" ? (
                    <p style={{ fontSize: 13.5, color: "#5e5640", margin: 0 }}>
                      A practice variant wasn't generated — the review materials above still target this objective directly.
                    </p>
                  ) : (
                    <p style={{ fontSize: 13.5, color: "#5e5640", margin: 0, fontStyle: "italic" }}>
                      Generating a variant of the question you missed…
                    </p>
                  )}
                </article>
              );
            })}

            {numbering.key.length > 0 && (
              <div style={{ background: "#fff", border: "1px solid #e7e0cd", borderTop: `4px solid ${NAVY}`, padding: "18px 20px", marginBottom: 18, pageBreakBefore: "always" }}>
                <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, letterSpacing: 2, color: GOLD, textTransform: "uppercase", marginBottom: 4 }}>
                  Answer key
                </div>
                <p style={{ fontSize: 13, color: "#5e5640", margin: "0 0 14px" }}>
                  Work the questions first, then check here.
                </p>
                {numbering.key.map(({ n, it }) => {
                  const letter = String.fromCharCode(97 + it.correct);
                  return (
                    <div key={n} style={{ marginBottom: 11, fontSize: 13.5, lineHeight: 1.5 }}>
                      <span style={{ fontWeight: 600, color: NAVY }}>{n}. ({letter}) {it.options[it.correct]}</span>
                      <div style={{ color: INK, fontStyle: "italic", fontSize: 13, marginTop: 2 }}>{it.why}</div>
                    </div>
                  );
                })}
              </div>
            )}

            <p style={{ fontSize: 12, color: "#5e5640", fontFamily: "'IBM Plex Mono', monospace", marginTop: 8 }}>
              Practice items are generated for concept reps and are not calibrated to predict exam difficulty.
            </p>
          </div>
        )}
          </>
        )}
      </div>
    </div>
  );
}

const _root = ReactDOM.createRoot(document.getElementById('root'));
_root.render(React.createElement(RemediationTool));
</script>
</body>
</html>
