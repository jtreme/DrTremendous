/* ═══════════════════════════════════════════
   INTERACTIVE S&D GRAPH
   ═══════════════════════════════════════════ */
function SDGraph({ dS = 0, sS = 0, onDD, onDS, frozen, dMin = -25, dMax = 25, sMin = -25, sMax = 25, showOrigEq = false, showOrigCurves = false, showEqLabels = false }) {
  const ref = useRef(null);
  const drag = useRef(null);
  const startX = useRef(0);
  const startVal = useRef(0);

  const W = 380, H = 280, PAD = 50, PADT = 16;
  const py = (p) => PADT + (H - PAD - PADT) * (1 - p / 120);
  const qx = (q) => PAD + (W - PAD - 10) * (q / 120);

  // Original equilibrium (no shifts)
  const origEqP = 60;
  const origEqQ = 40;

  const eqP = (120 + dS - sS) / 2;
  const eqQ = eqP - 20 + sS;
  const eqOk = eqP > 5 && eqP < 115 && eqQ > 5 && eqQ < 115;
  const hasShifted = Math.abs(dS) > 0.5 || Math.abs(sS) > 0.5;

  // Demand: P = 100 + dS - Q
  const dP0 = 100 + dS;
  const dQ0 = 100 + dS;

  // Supply: P = Q + 20 - sS
  const sP0 = 20 - sS;
  const sQ120 = 100 + sS;

  const handleDown = (curve) => (e) => {
    if (frozen) return;
    if (curve === "d" && !onDD) return;
    if (curve === "s" && !onDS) return;
    e.preventDefault();
    drag.current = curve;
    startX.current = e.touches ? e.touches[0].clientX : e.clientX;
    startVal.current = curve === "d" ? dS : sS;
  };

  useEffect(() => {
    const move = (e) => {
      if (!drag.current) return;
      e.preventDefault();
      const cx = e.touches ? e.touches[0].clientX : e.clientX;
      const rect = ref.current?.getBoundingClientRect();
      if (!rect) return;
      const scale = 120 / (rect.width - PAD - 10);
      const raw = startVal.current + (cx - startX.current) * scale;
      if (drag.current === "d" && onDD) {
        onDD(Math.round(Math.max(dMin, Math.min(dMax, raw))));
      }
      if (drag.current === "s" && onDS) {
        onDS(Math.round(Math.max(sMin, Math.min(sMax, raw))));
      }
    };
    const up = () => { drag.current = null; };
    window.addEventListener("mousemove", move);
    window.addEventListener("mouseup", up);
    window.addEventListener("touchmove", move, { passive: false });
    window.addEventListener("touchend", up);
    return () => { window.removeEventListener("mousemove", move); window.removeEventListener("mouseup", up); window.removeEventListener("touchmove", move); window.removeEventListener("touchend", up); };
  }, [dS, sS, onDD, onDS, dMin, dMax, sMin, sMax]);

  return (
    <svg ref={ref} viewBox={`0 0 ${W} ${H}`}
      style={{ width: "100%", maxWidth: 620, display: "block", margin: "0 auto", touchAction: "none", userSelect: "none" }}>
      <rect width={W} height={H} fill={C.bg} rx="8" />
      <defs>
        <clipPath id="plotClip">
          <rect x={PAD} y={PADT} width={W - PAD - 10} height={H - PAD - PADT} />
        </clipPath>
      </defs>

      {/* Grid */}
      {[20, 40, 60, 80, 100].map(v => (
        <g key={v}>
          <line x1={PAD} y1={py(v)} x2={W - 10} y2={py(v)} stroke={C.grid} strokeWidth="0.5" />
          <line x1={qx(v)} y1={PADT} x2={qx(v)} y2={H - PAD} stroke={C.grid} strokeWidth="0.5" />
        </g>
      ))}

      {/* Axes */}
      <line x1={PAD} y1={PADT} x2={PAD} y2={H - PAD} stroke={C.text} strokeWidth="1.5" />
      <line x1={PAD} y1={H - PAD} x2={W - 10} y2={H - PAD} stroke={C.text} strokeWidth="1.5" />
      <text x={16} y={H / 2 - 8} fontSize="12" fill={C.text} fontWeight="700" fontFamily={F}
        transform={`rotate(-90,16,${H / 2 - 8})`}>Price</text>
      <text x={W / 2 + 20} y={H - 8} fontSize="12" fill={C.text} fontWeight="700"
        textAnchor="middle" fontFamily={F}>Quantity</text>

      {/* Clipped curves and equilibrium */}
      <g clipPath="url(#plotClip)">
        {/* Original curves - dashed */}
        {showOrigCurves && hasShifted && (
          <>
            <line x1={qx(0)} y1={py(100)} x2={qx(100)} y2={py(0)}
              stroke={C.demand} strokeWidth="2" strokeDasharray="6 5" opacity="0.45" />
            <line x1={qx(0)} y1={py(20)} x2={qx(100)} y2={py(120)}
              stroke={C.supply} strokeWidth="2" strokeDasharray="6 5" opacity="0.45" />
          </>
        )}

        {/* Demand curve - solid blue */}
        <line x1={qx(0)} y1={py(dP0)} x2={qx(dQ0)} y2={py(0)}
          stroke={C.demand} strokeWidth="3" />
        {!frozen && onDD && (
          <line x1={qx(0)} y1={py(dP0)} x2={qx(dQ0)} y2={py(0)}
            stroke="transparent" strokeWidth="24" style={{ cursor: "ew-resize" }}
            onMouseDown={handleDown("d")} onTouchStart={handleDown("d")} />
        )}

        {/* Supply curve - solid green */}
        <line x1={qx(0)} y1={py(sP0)} x2={qx(sQ120)} y2={py(120)}
          stroke={C.supply} strokeWidth="3" />
        {!frozen && onDS && (
          <line x1={qx(0)} y1={py(sP0)} x2={qx(sQ120)} y2={py(120)}
            stroke="transparent" strokeWidth="24" style={{ cursor: "ew-resize" }}
            onMouseDown={handleDown("s")} onTouchStart={handleDown("s")} />
        )}

        {/* Original equilibrium */}
        {showOrigEq && hasShifted && (
          <g>
            <circle cx={qx(origEqQ)} cy={py(origEqP)} r="6" fill="#fff" stroke="#777" strokeWidth="2" />
            {showEqLabels && (
              <text x={qx(origEqQ) - 16} y={py(origEqP) - 10} fontSize="12" fill="#777" fontWeight="700" fontFamily={F}>E₀</text>
            )}
          </g>
        )}

        {/* Current equilibrium dot - filled */}
        {eqOk && (
          <g>
            <circle cx={qx(eqQ)} cy={py(eqP)} r="6" fill={C.eq} stroke="#fff" strokeWidth="2" />
            {showEqLabels && hasShifted && (
              <text x={qx(eqQ) + 8} y={py(eqP) - 8} fontSize="12" fill={C.eq} fontWeight="700" fontFamily={F}>E₁</text>
            )}
          </g>
        )}
      </g>

      {/* Curve labels */}
      <text x={Math.min(qx(dQ0), W - 20) + 3} y={py(0) + 14} fontSize="14" fill={C.demand} fontWeight="700" fontFamily={F}>D</text>
      <text x={Math.min(qx(sQ120), W - 20) + 3} y={py(120) - 4} fontSize="14" fill={C.supply} fontWeight="700" fontFamily={F}>S</text>

      {/* P* and Q* labels on axes */}
      {eqOk && (
        <>
          <text x={PAD - 6} y={py(eqP) + 4} fontSize="11" fill={C.eq} fontWeight="700" textAnchor="end" fontFamily={F}>P*</text>
          <text x={qx(eqQ)} y={H - PAD + 15} fontSize="11" fill={C.eq} fontWeight="700" textAnchor="middle" fontFamily={F}>Q*</text>
        </>
      )}

      {/* Drag hint */}
      {!frozen && (onDD || onDS) && dS === 0 && sS === 0 && (
        <text x={W / 2 + 20} y={PADT + 14} fontSize="11" fill={C.accent}
          textAnchor="middle" fontFamily={F} fontStyle="italic">
          {"← Drag " + (onDD && onDS ? "the curves" : onDD ? "demand (blue)" : "supply (green)") + " →"}
        </text>
      )}
    </svg>
  );
}

function Prog({ c, t, label }) {
  return (
    <div style={{ marginBottom: 18 }}>

function Fb({ ok, text, onNext }) {

/* ═══ LEVEL 1 ═══ */
function Level1({ onDone }) {
  const [idx, setIdx] = useState(0);
  const [sel, setSel] = useState(null);
  const [sub, setSub] = useState(false);
  const [sc, setSc] = useState(0);
  const [qs] = useState(() => [...Q1].sort(() => Math.random() - 0.5).slice(0, 8));

  const q = qs[idx];
  if (!q) return <LevelDone emoji="🎯" label="Level 1 Complete" score={sc} total={qs.length} onClick={() => onDone(sc, qs.length)} />;

  return (
    <div>
      <Prog c={idx + 1} t={qs.length} label="Level 1: Which Curve?" />
      <div style={{ padding: "18px 22px", background: C.highlight, borderRadius: 10, marginBottom: 14, border: "1px solid #e8deb5", fontFamily: F, fontSize: 15, lineHeight: 1.7 }}>{q.t}</div>
      <div style={{ fontSize: 14, fontWeight: 600, marginBottom: 10, color: C.primary, fontFamily: F }}>Supply or demand shifter?</div>
      <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
        {["supply", "demand"].map(v => (
          <button key={v} onClick={() => !sub && setSel(v)} style={{
            padding: "12px 24px", fontSize: 14, fontWeight: sel === v ? 700 : 500,
            border: `2px solid ${sel === v ? C.primary : C.border}`, borderRadius: 8,
            background: sel === v ? "#e0e7ff" : "#fff", color: C.text,
            cursor: sub ? "default" : "pointer", fontFamily: F,
          }}>
            {v === "supply" ? "📦 Supply" : "🛒 Demand"}
          </button>
        ))}
      </div>
      {sel && !sub && (
        <button onClick={() => { if (sel === q.a) setSc(s => s + 1); setSub(true); }} style={btnStyle(C.accent)}>Check</button>
      )}
      {sub && <Fb ok={sel === q.a} text={q.e} onNext={() => { setIdx(i => i + 1); setSel(null); setSub(false); }} />}
    </div>
  );
}

/* ═══ LEVEL 2 ═══ */
function Level2({ onDone }) {
  const [idx, setIdx] = useState(0);
  const [picked, setPicked] = useState(null); // which curve student chose
  const [dS, setDS] = useState(0);
  const [sS, setSS] = useState(0);
  const [sub, setSub] = useState(false);
  const [sc, setSc] = useState(0);
  const [qs] = useState(() => [...Q2].sort(() => Math.random() - 0.5).slice(0, 6));

  const q = qs[idx];
  if (!q) return <LevelDone emoji="📈" label="Level 2 Complete" score={sc} total={qs.length} onClick={() => onDone(sc, qs.length)} />;

  const shift = picked === "demand" ? dS : sS;
  const dir = shift > 0 ? "right" : shift < 0 ? "left" : null;
  const moved = Math.abs(shift) > 5;
  const ok = picked === q.c && dir === q.d;

  const reset = () => { setIdx(i => i + 1); setPicked(null); setDS(0); setSS(0); setSub(false); };

  return (
    <div>
      <Prog c={idx + 1} t={qs.length} label="Level 2: Shift the Curve" />
      <div style={{ padding: "18px 22px", background: C.highlight, borderRadius: 10, marginBottom: 14, border: "1px solid #e8deb5", fontFamily: F }}>
        <div style={{ fontSize: 11, color: C.accent, fontWeight: 700, textTransform: "uppercase", letterSpacing: 1, marginBottom: 4 }}>
          {!picked ? "Step 1: Which curve shifts?" : "Step 2: Drag it left or right"}
        </div>
        <div style={{ fontSize: 15, lineHeight: 1.7 }}>{q.t}</div>
      </div>
      {!picked && (
        <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginBottom: 14 }}>
          <button onClick={() => setPicked("supply")} style={optStyle(false)}>📦 Supply curve</button>
          <button onClick={() => setPicked("demand")} style={optStyle(false)}>🛒 Demand curve</button>
        </div>
      )}
      {picked && (
        <>
          <SDGraph dS={dS} sS={sS}
            onDD={!sub && picked === "demand" ? setDS : null}
            onDS={!sub && picked === "supply" ? setSS : null}
            frozen={sub}
            />
          {moved && !sub && (
            <div style={{ textAlign: "center", marginTop: 10 }}>
              <div style={{ fontSize: 12, color: C.textLight, fontFamily: F, marginBottom: 6 }}>
                You shifted {picked} {dir}
              </div>
              <button onClick={() => { if (ok) setSc(s => s + 1); setSub(true); }} style={btnStyle(C.accent)}>Check</button>
            </div>
          )}
          {sub && <Fb ok={ok} text={!ok && picked !== q.c ? `The correct curve was ${q.c}, not ${picked}. ${q.e}` : q.e} onNext={reset} />}
        </>
      )}
    </div>
  );
}

/* ═══ LEVEL 3 ═══ */
function Level3({ onDone }) {
  const [idx, setIdx] = useState(0);
  const [picked, setPicked] = useState(null);
  const [dS, setDS] = useState(0);
  const [sS, setSS] = useState(0);
  const [step, setStep] = useState(1); // 1=pick curve, 2=drag, 3=predict PQ
  const [pA, setPA] = useState(null);
  const [qA, setQA] = useState(null);
  const [sub, setSub] = useState(false);
  const [sc, setSc] = useState(0);
  const [qs] = useState(() => [...Q3].sort(() => Math.random() - 0.5));

  const q = qs[idx];
  if (!q) return <LevelDone emoji="⚖️" label="Level 3 Complete" score={sc} total={qs.length} onClick={() => onDone(sc, qs.length)} />;

  const shift = picked === "demand" ? dS : sS;
  const dir = shift > 0 ? "right" : shift < 0 ? "left" : null;
  const moved = Math.abs(shift) > 5;

  // Split the Level 3 check into separate pieces so the app does not
  // give a confusing all-or-nothing "wrong" message.
  const curveOk = picked === q.c;
  const dirOk = dir === q.d;
  const pqOk = pA === q.eP && qA === q.eQ;
  const allOk = curveOk && dirOk && pqOk;

  const feedbackText = allOk
    ? q.e
    : [
        !curveOk ? `Curve: you picked ${picked}, but the correct curve was ${q.c}.` : null,
        curveOk && !dirOk ? `Direction: you shifted ${picked} ${dir}, but it should shift ${q.d}.` : null,
        !pqOk ? `Equilibrium: you chose P ${pA} and Q ${qA}, but the correct result is P ${q.eP} and Q ${q.eQ}.` : null,
        q.e,
      ].filter(Boolean).join(" ");

  const reset = () => { setIdx(i => i + 1); setPicked(null); setDS(0); setSS(0); setStep(1); setPA(null); setQA(null); setSub(false); };

  return (
    <div>
      <Prog c={idx + 1} t={qs.length} label="Level 3: Find Equilibrium" />
      <div style={{ padding: "18px 22px", background: C.highlight, borderRadius: 10, marginBottom: 14, border: "1px solid #e8deb5", fontFamily: F }}>
        <div style={{ fontSize: 11, color: C.accent, fontWeight: 700, textTransform: "uppercase", letterSpacing: 1, marginBottom: 4 }}>
          {step === 1 ? "Step 1: Which curve shifts?" : step === 2 ? "Step 2: Drag it in the right direction" : "Step 3: What happens to P and Q?"}
        </div>
        <div style={{ fontSize: 15, lineHeight: 1.7 }}>{q.t}</div>
      </div>
      {step === 1 && (
        <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginBottom: 14 }}>
          <button onClick={() => { setPicked("supply"); setStep(2); }} style={optStyle(false)}>📦 Supply curve</button>
          <button onClick={() => { setPicked("demand"); setStep(2); }} style={optStyle(false)}>🛒 Demand curve</button>
        </div>
      )}
      {step >= 2 && (
        <>
          <SDGraph dS={dS} sS={sS}
            onDD={step === 2 && !sub && picked === "demand" ? setDS : null}
            onDS={step === 2 && !sub && picked === "supply" ? setSS : null}
            frozen={step === 3 || sub}
            />
          {step === 2 && moved && (
            <div style={{ textAlign: "center", marginTop: 10 }}>
              <div style={{ fontSize: 12, color: C.textLight, fontFamily: F, marginBottom: 6 }}>
                You shifted {picked} {dir}
              </div>
              <button onClick={() => setStep(3)} style={btnStyle(C.accent)}>Confirm → Predict P & Q</button>
            </div>
          )}
        </>
      )}
      {step === 3 && !sub && (
        <div style={{ marginTop: 14 }}>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14 }}>
            <div>
              <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 6, color: C.primary, fontFamily: F }}>Price will...</div>
              {["increase", "decrease"].map(o => (
                <button key={o} onClick={() => setPA(o)} style={optStyle(pA === o)}>
                  {o === "increase" ? "↑ Increase" : "↓ Decrease"}
                </button>
              ))}
            </div>
            <div>
              <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 6, color: C.primary, fontFamily: F }}>Quantity will...</div>
              {["increase", "decrease"].map(o => (
                <button key={o} onClick={() => setQA(o)} style={optStyle(qA === o)}>
                  {o === "increase" ? "↑ Increase" : "↓ Decrease"}
                </button>
              ))}
            </div>
          </div>
          {pA && qA && (
            <button onClick={() => { if (allOk) setSc(s => s + 1); setSub(true); }} style={{ ...btnStyle(C.accent), marginTop: 14 }}>Check</button>
          )}
        </div>
      )}
      {sub && <Fb ok={allOk} text={feedbackText} onNext={reset} />}
    </div>
  );
}

/* ═══ LEVEL 4 ═══ */
function Level4({ onDone }) {
  const [idx, setIdx] = useState(0);
  const [dS, setDS] = useState(0);
  const [sS, setSS] = useState(0);
  const [sc, setSc] = useState(0);
  const [step, setStep] = useState(1);
  const [dDir, setDDir] = useState(null);
  const [sDir, setSDir] = useState(null);
  const [sub, setSub] = useState(false);
  const [ambigAns, setAmbigAns] = useState(null);
  const [definiteAns, setDefiniteAns] = useState(null);
  const [challengesDone, setChallengesDone] = useState(0);
  const [dirsSub, setDirsSub] = useState(false);

  const MAX_SHIFT = 40;

  const q = Q4[idx];
  if (!q) return <LevelDone emoji="🔄" label="Level 4 Complete" score={sc} total={Q4.length} onClick={() => onDone(sc, Q4.length)} />;

  const expectedDDir = q.expectedD > 0 ? "right" : q.expectedD < 0 ? "left" : "none";
  const expectedSDir = q.expectedS > 0 ? "right" : q.expectedS < 0 ? "left" : "none";
  const dirsOk = dDir === expectedDDir && sDir === expectedSDir;

  const eqP = (120 + dS - sS) / 2;
  const eqQ = eqP - 20 + sS;
  const origP = 60;
  const origQ = 40;

  const ambigVar = q.ambigVar;
  const definiteVar = q.definiteVar;
  const definiteDir = q.definiteDir;

  const challengeLabels = ambigVar === "price"
    ? ["price INCREASES", "price DECREASES", "price STAYS THE SAME"]
    : ["quantity INCREASES", "quantity DECREASES", "quantity STAYS THE SAME"];

  // Immediate outcome feedback
  const MOVE_EPS = 2;
  const OUTCOME_EPS = 1;
  const requiredCurvesMoved =
    (expectedDDir === "none" || Math.abs(dS) > MOVE_EPS) &&
    (expectedSDir === "none" || Math.abs(sS) > MOVE_EPS);
  const currentVal = ambigVar === "price" ? eqP : eqQ;
  const originalVal = ambigVar === "price" ? origP : origQ;
  const currentOutcome = !requiredCurvesMoved
    ? null
    : currentVal > originalVal + OUTCOME_EPS
      ? "increase"
      : currentVal < originalVal - OUTCOME_EPS
        ? "decrease"
        : "same";
  const targetOutcome = challengesDone === 0 ? "increase" : challengesDone === 1 ? "decrease" : "same";
  const checkChallenge = () => currentOutcome === targetOutcome;

  const reset = () => {
    setIdx(i => i + 1); setDS(0); setSS(0); setStep(1);
    setDDir(null); setSDir(null); setSub(false); setDirsSub(false);
    setAmbigAns(null); setDefiniteAns(null); setChallengesDone(0);
  };

  const stepTag =
    step === 1 ? "Step 1: Which direction does each curve shift?" :
    step >= 2 && step <= 4 ? `Challenge ${challengesDone + 1}/3: Adjust the curves so ${challengeLabels[challengesDone]}` :
    step === 5 ? "You just showed three different outcomes. Now answer:" : "";

  return (
    <div>
      <Prog c={idx + 1} t={Q4.length} label="Level 4: Simultaneous Shifts" />
      <div style={{ padding: "18px 22px", background: C.highlight, borderRadius: 10, marginBottom: 14, border: "1px solid #e8deb5", fontFamily: F }}>
        <div style={{ fontSize: 11, color: C.accent, fontWeight: 700, textTransform: "uppercase", letterSpacing: 1, marginBottom: 4 }}>{stepTag}</div>
        <div style={{ fontSize: 15, lineHeight: 1.7 }}>{q.t}</div>
      </div>

      {/* Step 1: Pick shift directions */}
      {step === 1 && (
        <div>
          <div style={{ marginBottom: 14 }}>
            <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 6, color: C.demand, fontFamily: F }}>Demand curve...</div>
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
              {["left", "none", "right"].map(d => (
                <button key={d} onClick={() => !dirsSub && setDDir(d === "none" ? "none" : d)} style={optStyle(dDir === (d === "none" ? "none" : d))}>
                  {d === "left" ? "← Shifts left" : d === "right" ? "Shifts right →" : "Does not shift"}
                </button>
              ))}
            </div>
          </div>
          <div style={{ marginBottom: 14 }}>
            <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 6, color: C.supply, fontFamily: F }}>Supply curve...</div>
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
              {["left", "none", "right"].map(d => (
                <button key={d} onClick={() => !dirsSub && setSDir(d === "none" ? "none" : d)} style={optStyle(sDir === (d === "none" ? "none" : d))}>
                  {d === "left" ? "← Shifts left" : d === "right" ? "Shifts right →" : "Does not shift"}
                </button>
              ))}
            </div>
          </div>
          {dDir && sDir && !dirsSub && (
            <button onClick={() => setDirsSub(true)} style={btnStyle(C.accent)}>Check Shifts</button>
          )}
          {dirsSub && (
            <>
              {dirsOk ? (
                <div style={{ padding: "12px 18px", background: C.successBg, borderRadius: 8, border: `1px solid ${C.success}`, marginBottom: 10, fontFamily: F }}>
                  <span style={{ fontWeight: 700, color: C.success }}>✓ Correct!</span>
                  <span style={{ color: C.text, fontSize: 13 }}> Now let's explore what happens to equilibrium...</span>
                </div>
              ) : (
                <div style={{ padding: "12px 18px", background: C.errorBg, borderRadius: 8, border: `1px solid ${C.error}`, marginBottom: 10, fontFamily: F }}>
                  <span style={{ fontWeight: 700, color: C.error }}>✗ Not quite. </span>
                  <span style={{ color: C.text, fontSize: 13 }}>
                    {dDir !== expectedDDir && `Demand should ${expectedDDir === "none" ? "not shift" : "shift " + expectedDDir}. `}
                    {sDir !== expectedSDir && `Supply should ${expectedSDir === "none" ? "not shift" : "shift " + expectedSDir}. `}
                  </span>
                </div>
              )}
              {dirsOk && (
                <button onClick={() => { setDS(0); setSS(0); setStep(2); }} style={btnStyle(C.accent)}>Continue → Explore the Graph</button>
              )}
              {!dirsOk && (
                <button onClick={() => { setDirsSub(false); setDDir(null); setSDir(null); }} style={btnStyle(C.primary)}>Try Again</button>
              )}
            </>
          )}
        </div>
      )}

      {/* Steps 2-4: Graph challenges */}
      {step >= 2 && step <= 4 && (
        <>
          <SDGraph dS={dS} sS={sS}
            onDD={expectedDDir !== "none" ? setDS : null}
            onDS={expectedSDir !== "none" ? setSS : null}
            dMin={expectedDDir === "right" ? 0 : expectedDDir === "left" ? -MAX_SHIFT : 0}
            dMax={expectedDDir === "right" ? MAX_SHIFT : expectedDDir === "left" ? 0 : 0}
            sMin={expectedSDir === "right" ? 0 : expectedSDir === "left" ? -MAX_SHIFT : 0}
            sMax={expectedSDir === "right" ? MAX_SHIFT : expectedSDir === "left" ? 0 : 0}
            frozen={false}
            showOrigEq={true}
            showOrigCurves={true}
            showEqLabels={true}
            />

          {/* Prominent challenge goal */}
          <div style={{ margin: "12px 0", padding: "14px 20px", borderRadius: 8, background: challengesDone === 0 ? "#dbeafe" : challengesDone === 1 ? "#fce7f3" : "#fef3c7", border: `2px solid ${challengesDone === 0 ? C.demand : challengesDone === 1 ? "#9d174d" : "#92400e"}`, fontFamily: F, textAlign: "center" }}>
            <div style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: 1.5, fontWeight: 700, color: challengesDone === 0 ? C.demand : challengesDone === 1 ? "#9d174d" : "#92400e", marginBottom: 4 }}>
              Challenge {challengesDone + 1} of 3
            </div>
            <div style={{ fontSize: 17, fontWeight: 700, color: C.text }}>
              Make {ambigVar} {challengesDone === 0 ? "INCREASE ↑" : challengesDone === 1 ? "DECREASE ↓" : "STAY THE SAME ↔"}
            </div>
            <div style={{ fontSize: 12, color: C.textLight, marginTop: 4 }}>
              Both curves are already shifting in the correct direction. Drag to change which one shifts more.
            </div>
          </div>

          {/* Status indicator */}
          <div style={{ textAlign: "center", fontFamily: F }}>
            {currentOutcome && (
              <div style={{ fontSize: 13, color: C.primary, fontWeight: 700, marginBottom: 8 }}>
                Current result: {ambigVar === "price" ? "Price" : "Quantity"}{" "}
                {currentOutcome === "increase" ? "increases ↑" : currentOutcome === "decrease" ? "decreases ↓" : "stays the same ↔"}
              </div>
            )}
            {checkChallenge() ? (
              <div>
                <div style={{ padding: "12px 18px", background: C.successBg, borderRadius: 8, border: `1px solid ${C.success}`, marginBottom: 10, fontSize: 14 }}>
                  <span style={{ fontWeight: 700, color: C.success }}>✓ </span>
                  {ambigVar === "price" ? "Price" : "Quantity"} {challengesDone === 0 ? "increased" : challengesDone === 1 ? "decreased" : "stayed the same"}
                  {challengesDone < 2 && (
                    <span style={{ color: C.text }}>
                      {" — "}
                      {(() => {
                        const dBigger = Math.abs(dS) > Math.abs(sS);
                        const equal = Math.abs(Math.abs(dS) - Math.abs(sS)) < 3;
                        if (equal) return "the shifts were about equal in size.";
                        return dBigger
                          ? "because the demand shift was larger than the supply shift."
                          : "because the supply shift was larger than the demand shift.";
                      })()}
                    </span>
                  )}
                  {challengesDone === 2 && (
                    <span style={{ color: C.text }}> — the shifts were about equal in size, so they canceled out.</span>
                  )}
                </div>
                <button onClick={() => {
                  const next = challengesDone + 1;
                  setChallengesDone(next);
                  setDS(0);
                  setSS(0);
                  if (next >= 3) setStep(5);
                  else setStep(step + 1);
                }} style={btnStyle(C.accent)}>
                  {challengesDone < 2 ? "Next Challenge →" : "Continue →"}
                </button>
              </div>
            ) : (
              !currentOutcome && (
                <div style={{ fontSize: 13, color: C.accent, fontWeight: 600 }}>
                  Drag the curves to shift them...
                </div>
              )
            )}
          </div>
        </>
      )}

      {/* Step 5: Answer ambiguity questions */}
      {step === 5 && !sub && (
        <div style={{ marginTop: 10 }}>
          <div style={{ padding: "14px 18px", background: "#f0efe8", borderRadius: 8, marginBottom: 14, fontFamily: F, fontSize: 13, lineHeight: 1.6 }}>
            You just showed that by changing the relative size of the shifts, {ambigVar} can increase, decrease, or stay the same — all from the same two shifts.
          </div>
          <div style={{ marginBottom: 14 }}>
            <div style={{ fontSize: 14, fontWeight: 600, marginBottom: 8, color: C.primary, fontFamily: F }}>
              Which variable is ambiguous (could go either way)?
            </div>
            {["price", "quantity"].map(v => (
              <button key={v} onClick={() => setAmbigAns(v)} style={optStyle(ambigAns === v)}>
                {v === "price" ? "Price is ambiguous" : "Quantity is ambiguous"}
              </button>
            ))}
          </div>
          {ambigAns && (
            <div style={{ marginBottom: 14 }}>
              <div style={{ fontSize: 14, fontWeight: 600, marginBottom: 8, color: C.primary, fontFamily: F }}>
                What definitely happens to {definiteVar}?
              </div>
              {["increase", "decrease"].map(v => (
                <button key={v} onClick={() => setDefiniteAns(v)} style={optStyle(definiteAns === v)}>
                  {definiteVar === "price" ? "Price" : "Quantity"} definitely {v === "increase" ? "increases ↑" : "decreases ↓"}
                </button>
              ))}
            </div>
          )}
          {ambigAns && definiteAns && (
            <button onClick={() => {
              if (ambigAns === ambigVar && definiteAns === definiteDir) setSc(s => s + 1);
              setSub(true);
            }} style={btnStyle(C.accent)}>Check</button>
          )}
        </div>
      )}

      {sub && (
        <Fb
          ok={ambigAns === ambigVar && definiteAns === definiteDir}
          text={q.e}
          onNext={reset}
        />
      )}
    </div>
  );
}

/* ═══ LEVEL 5 ═══ */
function Level5({ onDone }) {
  const [si, setSi] = useState(0);
  const [qi, setQi] = useState(0);
  const [sel, setSel] = useState(null);
  const [sub, setSub] = useState(false);
  const [sc, setSc] = useState(0);
  const [tot, setTot] = useState(0);

  const s = Q5[si];
  if (!s) return <LevelDone emoji="🏆" label="All Levels Complete!" score={sc} total={tot} onClick={() => onDone(sc, tot)} />;
  const q = s.qs[qi];

  return (
    <div>
      <Prog c={si + 1} t={Q5.length} label="Level 5: Real World" />
      <div style={{ padding: "18px 22px", background: C.primary, borderRadius: "10px 10px 0 0", color: "#fff", fontFamily: F }}>
        <div style={{ fontSize: 10, textTransform: "uppercase", letterSpacing: 1.5, opacity: 0.6, marginBottom: 4 }}>{s.src}</div>
        <div style={{ fontSize: 18, fontWeight: 700, lineHeight: 1.3 }}>{s.hl}</div>
      </div>
      <div style={{ padding: "14px 22px", background: "#f0efe8", borderRadius: "0 0 10px 10px", marginBottom: 16, fontSize: 13, lineHeight: 1.7, color: C.text, fontFamily: F }}>{s.ctx}</div>
      <div style={{ fontSize: 11, color: C.accent, fontWeight: 700, marginBottom: 4, fontFamily: F }}>Question {qi + 1}/{s.qs.length}</div>
      <div style={{ fontSize: 15, fontWeight: 600, marginBottom: 12, color: C.primary, lineHeight: 1.5, fontFamily: F }}>{q.q}</div>
      {q.o.map((o, j) => (
        <button key={j} onClick={() => !sub && setSel(j)} style={{
          display: "block", width: "100%", padding: "12px 14px", marginBottom: 6,
          fontSize: 13, fontWeight: sel === j ? 700 : 500, textAlign: "left", lineHeight: 1.5,
          border: `2px solid ${sub ? (j === q.c ? C.success : sel === j ? C.error : C.border) : sel === j ? C.primary : C.border}`,
          borderRadius: 8,
          background: sub ? (j === q.c ? C.successBg : sel === j ? C.errorBg : "#fff") : sel === j ? "#e0e7ff" : "#fff",
          color: C.text, cursor: sub ? "default" : "pointer", fontFamily: F,
        }}>
          <span style={{ fontWeight: 700, marginRight: 6 }}>{String.fromCharCode(65 + j)}.</span>{o}
        </button>
      ))}
      {sel !== null && !sub && (
        <button onClick={() => { if (sel === q.c) setSc(x => x + 1); setTot(x => x + 1); setSub(true); }} style={btnStyle(C.accent)}>Check</button>
      )}
      {sub && (
        <div style={{ marginTop: 10, textAlign: "center" }}>
          <button onClick={() => {
            if (qi + 1 < s.qs.length) { setQi(x => x + 1); }
            else { setSi(x => x + 1); setQi(0); }
            setSel(null); setSub(false);
          }} style={btnStyle(C.primary)}>
            {qi + 1 < s.qs.length ? "Next Question →" : "Next Scenario →"}
          </button>
        </div>
      )}
    </div>
  );
}

      <div style={{ display: "inline-flex", alignItems: "center", gap: 12, opacity: 0.7 }}>
        <img src={DINO} alt="" style={{ height: 52 }} />
        <div style={{ textAlign: "left", fontFamily: "'Georgia', serif" }}>

/* ═══ MAIN APP ═══ */
function App() {
  const [lv, setLv] = useState(-1);
  const [scores, setScores] = useState([]);

  const done = useCallback((s, t) => {
    setScores(prev => [...prev, { s, t }]);
    setLv(l => l + 1);
  }, []);

  // Menu
  if (lv === -1) {
    return (
      <div style={{ maxWidth: 860, margin: "0 auto", padding: "24px 16px", fontFamily: F }}>
        <div style={{ textAlign: "center", marginBottom: 24 }}>
          <div style={{ fontSize: 16, textTransform: "uppercase", letterSpacing: 2.5, color: C.accent, fontWeight: 700, marginBottom: 6 }}>ARE 201 · Supply and Demand</div>
          <h1 style={{ fontSize: 38, fontWeight: 700, color: C.primary, margin: "0 0 4px", display: "flex", alignItems: "center", justifyContent: "center", gap: 16 }}><img src={DINO} alt="" style={{ height: 64 }} />Supply & Demand Practice</h1>
          <p style={{ fontSize: 13, color: C.textLight, margin: 0 }}>5 levels · Interactive graphs · Real-world scenarios</p>
        </div>
        <div style={{ background: "#f0efe8", borderRadius: 10, padding: "14px 18px", marginBottom: 20, fontSize: 13, lineHeight: 1.7, color: C.text }}>
          Each level builds on the last. In Levels 2–4, drag supply and demand curves on an interactive graph and watch the equilibrium move. Level 5 uses real 2026 news articles.
        </div>
        {LEVELS.map((level, i) => (
          <button key={i} onClick={() => { setLv(i); setScores([]); }} style={{
            display: "flex", alignItems: "center", width: "100%", padding: "14px 18px", marginBottom: 7,
            background: "#fff", border: `1px solid ${C.border}`, borderRadius: 10, cursor: "pointer", textAlign: "left",
          }}>
            <div style={{
              width: 32, height: 32, borderRadius: "50%", background: C.primary, color: "#fff",
              display: "flex", alignItems: "center", justifyContent: "center",
              fontWeight: 700, fontSize: 14, marginRight: 12, flexShrink: 0,
            }}>{i + 1}</div>
            <div>
              <div style={{ fontSize: 14, fontWeight: 700, color: C.primary }}>{level.l}</div>
              <div style={{ fontSize: 11, color: C.textLight }}>{level.d}</div>
            </div>
          </button>
        ))}
        <Footer />
        </div>
    );
  }

  // Summary
  if (lv >= 5) {
    const ts = scores.reduce((a, x) => a + x.s, 0);
    const tt = scores.reduce((a, x) => a + x.t, 0);
    return (
      <div style={{ maxWidth: 860, margin: "0 auto", padding: "24px 16px", fontFamily: F, textAlign: "center" }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 12, marginBottom: 16 }}>
          <img src={DINO} alt="" style={{ height: 88 }} />
          <div style={{ fontSize: 22, fontWeight: 700, color: C.primary }}>Practice Complete!</div>
        </div>
        <div style={{ fontSize: 15, color: C.textLight, margin: "8px 0 24px" }}>{ts}/{tt} ({Math.round((ts / tt) * 100)}%)</div>
        <div style={{ maxWidth: 360, margin: "0 auto", textAlign: "left" }}>
          {scores.map((s, i) => (
            <div key={i} style={{ display: "flex", justifyContent: "space-between", padding: "9px 0", borderBottom: `1px solid ${C.border}`, fontSize: 13 }}>
              <span>{LEVELS[i]?.l}</span>
              <span style={{ fontWeight: 700, color: s.s / s.t >= 0.7 ? C.success : C.error }}>{s.s}/{s.t}</span>
            </div>
          ))}
        </div>
        <button onClick={() => { setLv(-1); setScores([]); }} style={{ marginTop: 24, ...btnStyle(C.primary) }}>Start Over</button>
        <Footer />
      </div>
    );
  }

  const Comp = [Level1, Level2, Level3, Level4, Level5][lv];

  return (
    <div style={{ maxWidth: 860, margin: "0 auto", padding: "24px 16px", fontFamily: F }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 18 }}>
        <div>
          <div style={{ fontSize: 14, textTransform: "uppercase", letterSpacing: 2, color: C.accent, fontWeight: 700 }}>ARE 201 · Supply and Demand</div>
          <div style={{ fontSize: 17, fontWeight: 700, color: C.primary }}>{LEVELS[lv]?.l}</div>
        </div>
        <button onClick={() => { setLv(-1); setScores([]); }} style={{
          padding: "5px 12px", background: "none", border: `1px solid ${C.border}`,
          borderRadius: 6, fontSize: 11, color: C.textLight, cursor: "pointer", fontFamily: F,
        }}>← Menu</button>
      </div>
      <Comp onDone={done} />
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>

</body>
</html>
