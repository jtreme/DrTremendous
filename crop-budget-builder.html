function linearTrend(points) {
  const valid = points.filter(p => p.y !== null && p.y !== undefined && p.y !== "");
  if (valid.length < 3) return null;
  const n = valid.length;
  const sumX = valid.reduce((s, p) => s + p.x, 0);
  const sumY = valid.reduce((s, p) => s + p.y, 0);
  const sumXY = valid.reduce((s, p) => s + p.x * p.y, 0);
  const sumXX = valid.reduce((s, p) => s + p.x * p.x, 0);
  const slope = (n * sumXY - sumX * sumY) / (n * sumXX - sumX * sumX);
  const intercept = (sumY - slope * sumX) / n;
  const predicted = slope * CURRENT_YEAR + intercept;
  const sorted = [...valid].map(p => p.y).sort((a, b) => a - b);
  const p25 = pctile(sorted, 0.25);
  const p75 = pctile(sorted, 0.75);
  // Multiple averages
  // valid is sorted newest-first (from sortedYears), so slice(0, N) gets the most recent N years
  const recent5 = valid.slice(0, 5);
  const recent10 = valid.slice(0, 10);
  const avg5 = recent5.reduce((s, p) => s + p.y, 0) / recent5.length;
  const avg10 = recent10.reduce((s, p) => s + p.y, 0) / recent10.length;
  const avgAll = sumY / n;
  return { slope, intercept, predicted: Math.max(0, predicted), avg5, avg10, avgAll, n, n5: recent5.length, n10: recent10.length, points: valid, p25, p75 };
}

function pctile(sorted, p) {
  if (!sorted.length) return 0;
  const i = p * (sorted.length - 1), lo = Math.floor(i), hi = Math.ceil(i);
  return lo === hi ? sorted[lo] : sorted[lo] + (sorted[hi] - sorted[lo]) * (i - lo);
}

function calcBudget(crop, yieldVal, costOverrides, priceOverride) {
  const cfg = CROPS[crop];
  const price = priceOverride ?? cfg.defaultPrice;
  const gross = yieldVal * price;

  let opSubtotal = 0;
  let interestBearingSubtotal = 0;
  Object.entries(cfg.operating).forEach(([key, c]) => {
    const ov = costOverrides?.[key];
    let amt;
    if (c.yieldBased) {
      const rate = ov !== undefined ? ov / cfg.defaultYield : c.perUnit;
      amt = rate * yieldVal;
    } else { amt = ov !== undefined ? ov : c.default; }
    opSubtotal += amt;
    if (c.interestBearing) interestBearingSubtotal += amt;
  });
  // Match published budgets exactly: interest is on selected items only (seed, fertilizer, lime,
  // chemicals, machinery, labor — not drying/hauling/spreading/consulting/insurance). Overhead is
  // 7% of total operating costs INCLUDING interest. See Corn Mod formulas D22 and D27.
  const interest = interestBearingSubtotal * 0.5 * cfg.interestRate;
  const opTotal = opSubtotal + interest;
  const overhead = opTotal * cfg.overheadRate;

  let ownTotal = 0;
  Object.entries(cfg.ownership).forEach(([key, c]) => {
    ownTotal += (costOverrides?.[key] !== undefined ? costOverrides[key] : c.default);
  });

  const totalCost = opTotal + ownTotal + overhead;
  const netReturn = gross - totalCost;
  const incAboveOp = gross - opTotal;

  return {
    gross, opTotal, ownTotal, overhead, totalCost, netReturn, incAboveOp, price, yield: yieldVal,
    beYieldTotal: price > 0 ? totalCost / price : 0,
    bePriceTotal: yieldVal > 0 ? totalCost / yieldVal : 0,
    beYieldOp: price > 0 ? opTotal / price : 0,
    bePriceOp: yieldVal > 0 ? opTotal / yieldVal : 0,
  };
}

function tornadoAnalysis(crop, baseYield, co, po, swing = 0.15) {
  const base = calcBudget(crop, baseYield, co, po);
  const results = [];
  const yL = calcBudget(crop, baseYield * (1 - swing), co, po);
  const yH = calcBudget(crop, baseYield * (1 + swing), co, po);
  results.push({ label: "Yield", low: yL.netReturn, high: yH.netReturn, spread: yH.netReturn - yL.netReturn });
  const pBase = po ?? CROPS[crop].defaultPrice;
  const pL = calcBudget(crop, baseYield, co, pBase * (1 - swing));
  const pH = calcBudget(crop, baseYield, co, pBase * (1 + swing));
  results.push({ label: "Price", low: pL.netReturn, high: pH.netReturn, spread: pH.netReturn - pL.netReturn });
  const allCosts = { ...CROPS[crop].operating, ...CROPS[crop].ownership };
  Object.entries(allCosts).forEach(([key, c]) => {
    const val = co?.[key] ?? c.default;
    if (val < 5) return;
    const oL = { ...co, [key]: val * (1 - swing) };
    const oH = { ...co, [key]: val * (1 + swing) };
    const bL = calcBudget(crop, baseYield, oL, po);
    const bH = calcBudget(crop, baseYield, oH, po);
    results.push({ label: c.label, low: bH.netReturn, high: bL.netReturn, spread: Math.abs(bL.netReturn - bH.netReturn) });
  });
  results.sort((a, b) => b.spread - a.spread);
  return results.slice(0, 8);
}

// "What would have to change?" analysis
function breakEvenAnalysis(crop, yieldVal, co, po) {
  const b = calcBudget(crop, yieldVal, co, po);
  const cfg = CROPS[crop];
  // Max land rent to break even: current rent + net return (if negative, reduces max rent)
  const currentRent = co?.landRent ?? cfg.ownership.landRent.default;
  const maxRent = Math.max(0, currentRent + b.netReturn);
  // Required cost reduction to break even (total, spread across operating costs)
  const costReduction = b.netReturn < 0 ? Math.abs(b.netReturn) : 0;
  // Price sensitivity: $/acre change per $0.10 price change
  const priceSens = yieldVal * 0.10;
  // Price × yield combo table
  const priceSteps = [-0.50, -0.25, 0, 0.25, 0.50];
  const yieldPcts = [-15, -10, 0, 10, 15];
  const comboTable = yieldPcts.map(yPct => {
    const y = Math.round(yieldVal * (1 + yPct / 100));
    return {
      yieldLabel: yPct === 0 ? `${y} (base)` : `${y} (${yPct > 0 ? "+" : ""}${yPct}%)`,
      cells: priceSteps.map(pDelta => {
        const p = (po ?? cfg.defaultPrice) + pDelta;
        return { price: p, net: calcBudget(crop, y, co, p).netReturn };
      }),
    };
  });
  // Warnings
  const warnings = [];
  const yieldRatio = yieldVal / cfg.defaultYield;
  if (yieldRatio > 1.35) warnings.push({ type: "caution", msg: `Your yield (${Math.round(yieldVal)}) is ${Math.round((yieldRatio - 1) * 100)}% above the budget default of ${cfg.defaultYield}.` });
  if (yieldRatio < 0.65) warnings.push({ type: "caution", msg: `Your yield (${Math.round(yieldVal)}) is ${Math.round((1 - yieldRatio) * 100)}% below the budget default of ${cfg.defaultYield}.` });
  if (b.price < b.bePriceTotal) warnings.push({ type: "alert", msg: `Price ($${b.price.toFixed(2)}) is below total-cost break-even ($${b.bePriceTotal.toFixed(2)}).` });
  if (b.incAboveOp >= 0 && b.netReturn < 0) warnings.push({ type: "info", msg: "Covers operating costs but not total costs. May still be worth planting short-term, but not sustainable long-term." });
  if (b.incAboveOp < 0) warnings.push({ type: "alert", msg: "At these assumptions, the crop does not cover operating costs before ownership and overhead." });
  if (currentRent > 0 && currentRent / b.totalCost > 0.15 && b.netReturn < 0) warnings.push({ type: "info", msg: `Land rent ($${currentRent.toFixed(0)}/ac) is ${Math.round(currentRent / b.totalCost * 100)}% of total cost and a major driver of the negative return.` });
  return { maxRent, costReduction, priceSens, comboTable, priceSteps, warnings, coversOp: b.incAboveOp >= 0, coversTotal: b.netReturn >= 0 };
}

const fmtD = v => { if (v == null) return "—"; const neg = v < 0; const s = Math.abs(v).toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, ","); return neg ? `($${s})` : `$${s}`; };
const fmtDec = v => { if (v == null) return "—"; const neg = v < 0; return neg ? `($${Math.abs(v).toFixed(2)})` : `$${v.toFixed(2)}`; };

function FarmBudgetTool() {
  const [tab, setTab] = useState("projections"); // projections | risk | history
  const [farmName, setFarmName] = useState("");
  const [activeCrops, setActiveCrops] = useState(["corn", "soybeans"]);
  const [acres, setAcres] = useState({ corn: "", soybeans: "", wheat: "" });
  const [yieldOverrides, setYieldOverrides] = useState({}); // manual yield per crop
  const [costOverrides, setCostOverrides] = useState({ corn: {}, soybeans: {}, wheat: {} });
  const [priceOverrides, setPriceOverrides] = useState({});
  const [expandedCosts, setExpandedCosts] = useState({});
  const [histYears, setHistYears] = useState([...DEFAULT_YEARS]);
  const [yields, setYields] = useState({
    corn: Object.fromEntries(DEFAULT_YEARS.map(y => [y, ""])),
    soybeans: Object.fromEntries(DEFAULT_YEARS.map(y => [y, ""])),
    wheat: Object.fromEntries(DEFAULT_YEARS.map(y => [y, ""])),
  });
  const [projMethod, setProjMethod] = useState("trend"); // trend | avg5 | avg10 | avgAll
  // Quick scenario toggles
  const [priceScenario, setPriceScenario] = useState("base");
  const [yieldScenario, setYieldScenario] = useState("base");
  const [fertScenario, setFertScenario] = useState("base");
  const [fuelScenario, setFuelScenario] = useState("base");

  const addYear = () => {
    const minYear = histYears.length > 0 ? Math.min(...histYears) : CURRENT_YEAR;
    const newYear = minYear - 1;
    if (newYear < 1980) return;
    setHistYears(prev => [...prev, newYear].sort((a, b) => b - a));
    setYields(prev => {
      const next = { ...prev };
      Object.keys(next).forEach(crop => { next[crop] = { ...next[crop], [newYear]: "" }; });
      return next;
    });
  };

  const removeYear = (year) => {
    if (histYears.length <= 3) return;
    setHistYears(prev => prev.filter(y => y !== year));
    setYields(prev => {
      const next = { ...prev };
      Object.keys(next).forEach(crop => { const c = { ...next[crop] }; delete c[year]; next[crop] = c; });
      return next;
    });
  };

  const toggleCrop = crop => {
    setActiveCrops(prev => {
      if (prev.includes(crop) && prev.length <= 1) return prev;
      return prev.includes(crop) ? prev.filter(c => c !== crop) : [...prev, crop];
    });
  };

  const sortedYears = useMemo(() => [...histYears].sort((a, b) => b - a), [histYears]);

  const trends = useMemo(() => {
    const r = {};
    activeCrops.forEach(crop => {
      const pts = sortedYears.map(y => ({ x: y, y: yields[crop][y] === "" ? null : parseFloat(yields[crop][y]) }));
      r[crop] = linearTrend(pts);
    });
    return r;
  }, [yields, activeCrops, sortedYears]);

  // Reset projMethod if the selected option is no longer available
  useEffect(() => {
    const maxN = Math.max(...activeCrops.map(c => trends[c]?.n || 0));
    if (projMethod === "avg10" && maxN < 10) setProjMethod("avg5");
    if (projMethod === "avgAll" && maxN < 7) setProjMethod("avg5");
  }, [activeCrops, trends, projMethod]);

  // Effective yield: manual override > projection method > default
  const getYield = useCallback((crop) => {
    if (yieldOverrides[crop] !== undefined && yieldOverrides[crop] !== "") return parseFloat(yieldOverrides[crop]);
    const t = trends[crop];
    if (t) {
      if (projMethod === "avg5") return Math.round(t.avg5);
      if (projMethod === "avg10") return Math.round(t.avg10);
      if (projMethod === "avgAll") return Math.round(t.avgAll);
      return Math.round(t.predicted); // trend
    }
    return CROPS[crop].defaultYield;
  }, [yieldOverrides, trends, projMethod]);

  // Apply quick-scenario multipliers
  const getEffectiveCosts = useCallback((crop) => {
    const co = { ...costOverrides[crop] };
    if (fertScenario === "+15%") {
      const fertKeys = ["nitrogen", "dap", "potash", "phosphate", "lime", "fertSpreading"];
      const allCosts = { ...CROPS[crop].operating, ...CROPS[crop].ownership };
      fertKeys.forEach(k => { if (allCosts[k]) co[k] = (co[k] ?? allCosts[k].default) * 1.15; });
    }
    if (fuelScenario === "+15%") {
      const fuelKeys = ["hauling", "drying", "machinery"];
      const allCosts = { ...CROPS[crop].operating };
      fuelKeys.forEach(k => { if (allCosts[k]) co[k] = (co[k] ?? allCosts[k].default) * 1.15; });
    }
    return co;
  }, [costOverrides, fertScenario, fuelScenario]);

  const getEffectivePrice = useCallback((crop) => {
    const base = priceOverrides[crop] ?? CROPS[crop].defaultPrice;
    if (priceScenario === "-10%") return base * 0.9;
    if (priceScenario === "+10%") return base * 1.1;
    return base;
  }, [priceOverrides, priceScenario]);

  const getEffectiveYield = useCallback((crop) => {
    const base = getYield(crop);
    if (yieldScenario === "-10%") return Math.round(base * 0.9);
    if (yieldScenario === "+10%") return Math.round(base * 1.1);
    return base;
  }, [getYield, yieldScenario]);

  const budgets = useMemo(() => {
    const r = {};
    activeCrops.forEach(crop => {
      r[crop] = calcBudget(crop, getEffectiveYield(crop), getEffectiveCosts(crop), getEffectivePrice(crop));
    });
    return r;
  }, [activeCrops, getEffectiveYield, getEffectiveCosts, getEffectivePrice]);

  const farmTotal = useMemo(() => {
    let total = 0; let hasAcres = false;
    activeCrops.forEach(crop => {
      const a = parseFloat(acres[crop]);
      if (a > 0) { total += a * (budgets[crop]?.netReturn || 0); hasAcres = true; }
    });
    return hasAcres ? total : null;
  }, [budgets, acres, activeCrops]);

  const riskBudgets = useMemo(() => {
    const r = {};
    activeCrops.forEach(crop => {
      const t = trends[crop]; if (!t) return;
      const poor = Math.round(t.p25);
      const typical = getEffectiveYield(crop); // respects selected projection method
      const strong = Math.round(t.p75);
      const co = getEffectiveCosts(crop), po = getEffectivePrice(crop);
      const yearsNeg = t.points.filter(p => calcBudget(crop, p.y, co, po).netReturn < 0).length;
      r[crop] = {
        poor: { ...calcBudget(crop, poor, co, po), yieldUsed: poor },
        typical: { ...calcBudget(crop, typical, co, po), yieldUsed: typical },
        strong: { ...calcBudget(crop, strong, co, po), yieldUsed: strong },
        yearsNeg, yearsTotal: t.points.length,
      };
    });
    return r;
  }, [trends, activeCrops, getEffectiveYield, getEffectiveCosts, getEffectivePrice]);

  const tornadoData = useMemo(() => {
    const r = {};
    activeCrops.forEach(crop => {
      r[crop] = tornadoAnalysis(crop, getEffectiveYield(crop), getEffectiveCosts(crop), getEffectivePrice(crop));
    });
    return r;
  }, [activeCrops, getEffectiveYield, getEffectiveCosts, getEffectivePrice]);

  const beData = useMemo(() => {
    const r = {};
    activeCrops.forEach(crop => {
      r[crop] = breakEvenAnalysis(crop, getEffectiveYield(crop), getEffectiveCosts(crop), getEffectivePrice(crop));
    });
    return r;
  }, [activeCrops, getEffectiveYield, getEffectiveCosts, getEffectivePrice]);

  const cropRankings = useMemo(() => {
    if (activeCrops.length < 2) return null;
    const items = activeCrops.map(c => ({ crop: c, label: CROPS[c].label, b: budgets[c], be: beData[c] }));
    return {
      byNetReturn: [...items].sort((a, b) => b.b.netReturn - a.b.netReturn),
      byBEPrice: [...items].sort((a, b) => a.b.bePriceTotal - b.b.bePriceTotal),
      byOpMargin: [...items].sort((a, b) => b.b.incAboveOp - a.b.incAboveOp),
    };
  }, [activeCrops, budgets, beData]);

  const resetAll = () => {
    setPriceScenario("base"); setYieldScenario("base"); setFertScenario("base"); setFuelScenario("base");
    setCostOverrides({ corn: {}, soybeans: {}, wheat: {} }); setPriceOverrides({}); setYieldOverrides({});
  };

  const hasAnyHistory = activeCrops.some(c => trends[c]);
  const anyScenarioActive = priceScenario !== "base" || yieldScenario !== "base" || fertScenario !== "base" || fuelScenario !== "base";

  // Check if a crop has any user modifications
  const isModified = useCallback((crop) => {
    const hasYieldOv = yieldOverrides[crop] !== undefined && yieldOverrides[crop] !== "";
    const hasPriceOv = priceOverrides[crop] !== undefined;
    const hasCostOv = Object.keys(costOverrides[crop] || {}).some(k => costOverrides[crop][k] !== undefined);
    const hasTrend = !!trends[crop];
    return hasYieldOv || hasPriceOv || hasCostOv || hasTrend || anyScenarioActive;
  }, [yieldOverrides, priceOverrides, costOverrides, trends, anyScenarioActive]);

  // Assumption status label for a crop
  const assumptionStatus = useCallback((crop) => {
    const parts = [];
    if (anyScenarioActive) parts.push("scenario active");
    if (yieldOverrides[crop] !== undefined && yieldOverrides[crop] !== "") parts.push("yield: manual");
    else if (trends[crop]) {
      const methodLabels = { trend: "trend", avg5: "5-yr avg", avg10: "10-yr avg", avgAll: "all-yr avg" };
      parts.push(`yield: ${methodLabels[projMethod] || "trend"}`);
    }
    else parts.push("yield: budget default");
    if (priceOverrides[crop] !== undefined) parts.push("price: adjusted");
    const numCostChanges = Object.keys(costOverrides[crop] || {}).filter(k => costOverrides[crop][k] !== undefined).length;
    if (numCostChanges > 0) parts.push(`${numCostChanges} cost${numCostChanges > 1 ? "s" : ""} adjusted`);
    return parts;
  }, [yieldOverrides, priceOverrides, costOverrides, trends, anyScenarioActive, projMethod]);

  // Default budget (no overrides, no scenarios) for comparison
  const defaultBudgets = useMemo(() => {
    const r = {};
    activeCrops.forEach(crop => {
      r[crop] = calcBudget(crop, CROPS[crop].defaultYield, {}, undefined);
    });
    return r;
  }, [activeCrops]);

  const hasAnyAcres = activeCrops.some(c => parseFloat(acres[c]) > 0);
  const allDefaults = activeCrops.every(c => !isModified(c));

  return (
    <div style={{ fontFamily: FONT, background: "#faf8f4", minHeight: "100vh", color: "#2d2a24" }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; }
        input[type=number] { -moz-appearance: textfield; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; }
      `}</style>

      {/* ── HEADER ── */}
      <div style={{ background: "linear-gradient(135deg, #2d2a24 0%, #4a4435 100%)", padding: "22px 20px 18px", borderBottom: "4px solid #d4a843" }}>
        <div style={{ maxWidth: 980, margin: "0 auto" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
            <div style={{ width: 38, height: 38, borderRadius: "50%", background: "#d4a843", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 18 }}>🌾</div>
            <div>
              <div style={{ color: "#d4a843", fontSize: 10, fontFamily: MONO, letterSpacing: "0.15em", textTransform: "uppercase" }}>NC State · ARE Extension</div>
              <h1 style={{ color: "#faf8f4", fontSize: 19, fontWeight: 700 }}>NC Crop Budget Scenario Builder</h1>
            </div>
          </div>
        </div>
      </div>

      <div style={{ maxWidth: 980, margin: "0 auto", padding: "16px 14px 60px" }}>
        {/* ── START HERE BOX ── */}
        <div style={{ ...card, padding: "14px 18px", marginBottom: 12, background: "linear-gradient(135deg, #fdf8ec 0%, #faf8f4 100%)", border: "1.5px solid #d4a843" }}>
          <div style={{ display: "flex", alignItems: "baseline", gap: 10, marginBottom: 6, flexWrap: "wrap" }}>
            <span style={{ fontFamily: MONO, fontSize: 10, fontWeight: 700, color: "#b8912e", letterSpacing: "0.1em", textTransform: "uppercase" }}>Start Here</span>
            <span style={{ fontSize: 11, color: "#6b6457" }}>The simplest path through the tool.</span>
          </div>
          <ol style={{ margin: 0, paddingLeft: 22, fontSize: 12, color: "#3d3a32", lineHeight: 1.55 }}>
            <li style={{ marginBottom: 1 }}>Choose your crops below.</li>
            <li style={{ marginBottom: 1 }}>Enter your acres for each.</li>
            <li style={{ marginBottom: 1 }}>Enter your expected yield and price, or leave the NC State defaults in place.</li>
            <li>Look at net return, break-even price, and break-even yield for each crop.</li>
          </ol>
          <div style={{ fontSize: 11, color: "#6b6457", marginTop: 8, paddingTop: 8, borderTop: "1px dashed #d4a843" }}>
            Want a more personalized result? <strong>Add your yield history</strong> in the Personalize tab to replace the default NC State yields with your own farm record.
          </div>
          <div style={{ fontSize: 11, color: "#6b6457", marginTop: 6 }}>
            Need to adjust costs? <strong>Every cost line is editable</strong> — scroll to the per-crop budget tables below to override fertilizer, seed, chemicals, and other inputs individually. The "Fertilizer +15%" and "Fuel/Hauling +15%" toggles above apply a quick stress test across all crops at once.
          </div>
        </div>

        {/* ── FARM SETUP BAR ── */}
        <div style={{ ...card, padding: 18, display: "flex", gap: 14, flexWrap: "wrap", alignItems: "flex-end" }}>
          <div style={{ flex: "1 1 200px" }}>
            <label style={labelSt}>Farm Name</label>
            <input value={farmName} onChange={e => setFarmName(e.target.value)} placeholder="Optional" style={{ ...inputSt, padding: "7px 10px", fontSize: 13 }} />
          </div>
          <div style={{ flex: "2 1 280px" }}>
            <label style={labelSt}>Crops</label>
            <div style={{ display: "flex", gap: 6 }}>
              {Object.entries(CROPS).map(([key, c]) => (
                <button key={key} onClick={() => toggleCrop(key)} style={{
                  flex: 1, padding: "7px 8px", border: `2px solid ${activeCrops.includes(key) ? c.color : "#ddd"}`,
                  borderRadius: 5, cursor: "pointer", fontSize: 12, fontWeight: activeCrops.includes(key) ? 600 : 400,
                  background: activeCrops.includes(key) ? c.lightBg : "#faf8f4",
                  color: activeCrops.includes(key) ? c.accent : "#aaa", fontFamily: FONT, transition: "all 0.15s",
                }}>{activeCrops.includes(key) ? "✓ " : ""}{c.label}</button>
              ))}
            </div>
          </div>
        </div>

        {/* ── ACRES + YIELD ROW ── */}
        <div style={{ ...card, padding: 18 }}>
          <div style={{ overflowX: "auto" }}>
            <table style={{ width: "100%", borderCollapse: "collapse" }}>
              <thead><tr>
                <th style={{ ...thSt, width: 90 }}></th>
                {activeCrops.map(c => <th key={c} style={{ ...thSt, color: CROPS[c].accent, textAlign: "center" }}>{CROPS[c].label}</th>)}
              </tr></thead>
              <tbody>
                <tr>
                  <td style={{ ...tdSt, fontWeight: 600, fontSize: 12 }}>Acres</td>
                  {activeCrops.map(c => (
                    <td key={c} style={{ ...tdSt, textAlign: "center" }}>
                      <input type="number" min="0" value={acres[c]} onChange={e => setAcres(p => ({ ...p, [c]: e.target.value }))}
                        placeholder="—" style={{ ...numIn, width: 90, borderColor: acres[c] ? CROPS[c].color : "#dcd6ca" }} />
                    </td>
                  ))}
                </tr>
                <tr>
                  <td style={{ ...tdSt, fontWeight: 600, fontSize: 12 }}>
                    Expected Yield
                    <div style={{ fontSize: 9, color: "#a89e8c", fontWeight: 400 }}>Override or use default</div>

                  {activeCrops.map(c => {
                    const t = trends[c];
                    const src = yieldOverrides[c] !== undefined && yieldOverrides[c] !== "" ? "manual" : t ? "method" : "default";
                    const methodLabels = { trend: "from trend", avg5: "from 5-yr avg", avg10: "from 10-yr avg", avgAll: "from all-yr avg" };

                    return (
                      <td key={c} style={{ ...tdSt, textAlign: "center" }}>

                          style={{ ...numIn, width: 90, borderColor: CROPS[c].color }} />
                        <div style={{ fontSize: 9, color: "#a89e8c", marginTop: 2 }}>
                          {src === "manual" ? "manual" : src === "method" ? (methodLabels[projMethod] || "from trend") : "budget default"} · {CROPS[c].unit}/ac
                        </div>
                      </td>
                    );
                  })}
                </tr>
                <tr>
                  <td style={{ ...tdSt, fontWeight: 600, fontSize: 12 }}>Price ($/{activeCrops.length > 0 ? "unit" : ""})</td>
                  {activeCrops.map(c => (
                    <td key={c} style={{ ...tdSt, textAlign: "center" }}>
                      <input type="number" step="0.01" value={priceOverrides[c] ?? ""} onChange={e => setPriceOverrides(p => ({ ...p, [c]: e.target.value === "" ? undefined : parseFloat(e.target.value) }))}
                        placeholder={CROPS[c].defaultPrice.toFixed(2)}
                        style={{ ...numIn, width: 90, borderColor: CROPS[c].color }} />
                      <div style={{ fontSize: 9, color: "#a89e8c", marginTop: 2 }}>${CROPS[c].futuresPrice}+{CROPS[c].basis} basis</div>
                    </td>
                  ))}
                </tr>
              </tbody>
            </table>
          </div>
          
        </div>

        {/* ── QUICK SCENARIO BAR ── */}
        <div style={{ ...card, padding: "14px 18px" }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 8 }}>
            <div style={{ fontSize: 11, fontFamily: MONO, fontWeight: 600, color: "#7a7265", textTransform: "uppercase", letterSpacing: "0.08em" }}>Quick Scenarios</div>
            {anyScenarioActive && <button onClick={resetAll} style={{ fontSize: 11, border: "1px solid #dcd6ca", borderRadius: 4, padding: "3px 10px", cursor: "pointer", background: "#fff", color: "#e5484d", fontWeight: 600, fontFamily: MONO }}>Reset Assumptions</button>}
          </div>
          <div style={{ display: "flex", gap: 16, marginTop: 10, flexWrap: "wrap" }}>
            <div>
              <div style={{ fontSize: 10, color: "#8a8175", marginBottom: 4 }}>Price</div>
              <div style={{ display: "flex", gap: 4 }}>
                {["-10%", "base", "+10%"].map(s => <Pill key={s} label={s === "base" ? "Base" : s} active={priceScenario === s} onClick={() => setPriceScenario(s)} />)}
              </div>
            </div>
            <div>
              <div style={{ fontSize: 10, color: "#8a8175", marginBottom: 4 }}>Yield</div>
              <div style={{ display: "flex", gap: 4 }}>
                {["-10%", "base", "+10%"].map(s => <Pill key={s} label={s === "base" ? "Base" : s} active={yieldScenario === s} onClick={() => setYieldScenario(s)} />)}
              </div>
            </div>
            <div>
              <div style={{ fontSize: 10, color: "#8a8175", marginBottom: 4 }}>Fertilizer</div>
              <div style={{ display: "flex", gap: 4 }}>
                {["base", "+15%"].map(s => <Pill key={s} label={s === "base" ? "Base" : s} active={fertScenario === s} onClick={() => setFertScenario(s)} />)}
              </div>
            </div>
            <div>
              <div style={{ fontSize: 10, color: "#8a8175", marginBottom: 4 }}>Fuel / Hauling</div>
              <div style={{ display: "flex", gap: 4 }}>
                {["base", "+15%"].map(s => <Pill key={s} label={s === "base" ? "Base" : s} active={fuelScenario === s} onClick={() => setFuelScenario(s)} />)}
              </div>
            </div>
          </div>
        </div>

        {/* ── TAB NAV ── */}
        <div style={{ display: "flex", gap: 3, marginBottom: 18 }}>
          {[
            { key: "projections", label: "Budget Projections" },
            { key: "risk", label: "Risk & Sensitivity" },
            { key: "history", label: "Personalize (Yield History)" },
            { key: "methodology", label: "Methodology" },
          ].map((t, i, arr) => (
            <button key={t.key} onClick={() => setTab(t.key)} style={{
              flex: 1, padding: "10px 8px", border: "none", cursor: "pointer",
              background: tab === t.key ? "#2d2a24" : "#e8e4db", color: tab === t.key ? "#d4a843" : "#6b6457",
              fontSize: 11, fontWeight: 600, fontFamily: MONO, letterSpacing: "0.03em",
              borderRadius: i === 0 ? "5px 0 0 5px" : i === arr.length - 1 ? "0 5px 5px 0" : 0,
            }}>{t.label}</button>
          ))}
        </div>

        {/* ═══════ TAB: PROJECTIONS ═══════ */}
        {tab === "projections" && (
          <div>
            {/* Farm Total Banner */}
            {farmTotal !== null && (
              <div style={{ ...card, padding: 18, background: farmTotal >= 0 ? "#f0faf2" : "#fef3f2", border: `2px solid ${farmTotal >= 0 ? "#2d7a3a" : "#e5484d"}`, textAlign: "center" }}>
                <div style={{ fontSize: 11, fontFamily: MONO, color: "#7a7265", textTransform: "uppercase", letterSpacing: "0.1em" }}>
                  Projected Total Farm Net Return{farmName ? ` · ${farmName}` : ""}
                </div>
                <div style={{ fontSize: 36, fontWeight: 700, color: farmTotal >= 0 ? "#2d7a3a" : "#e5484d", marginTop: 4 }}>{fmtD(farmTotal)}</div>
                <div style={{ fontSize: 11, color: "#8a8175", marginTop: 4 }}>
                  {activeCrops.filter(c => parseFloat(acres[c]) > 0).map(c => `${CROPS[c].label}: ${acres[c]} ac × ${fmtD(budgets[c]?.netReturn)}/ac = ${fmtD(parseFloat(acres[c]) * (budgets[c]?.netReturn || 0))}`).join("  ·  ")}
                </div>
              </div>
            )}

            {/* Active scenario label */}
            {anyScenarioActive && (
              <div style={{ padding: "8px 14px", background: "#fff8e6", border: "1px solid #e8d89c", borderRadius: 6, fontSize: 11, color: "#8a7530", marginBottom: 14, display: "flex", alignItems: "center", gap: 6 }}>
                <span style={{ fontWeight: 700 }}>Scenario active:</span>
                {priceScenario !== "base" && <span>Price {priceScenario}</span>}
                {yieldScenario !== "base" && <span>Yield {yieldScenario}</span>}
                {fertScenario !== "base" && <span>Fertilizer {fertScenario}</span>}
                {fuelScenario !== "base" && <span>Fuel/Hauling {fuelScenario}</span>}
              </div>
            )}

            {/* Defaults warning */}
            {hasAnyAcres && allDefaults && (
              <div style={{ padding: "8px 14px", background: "#f4f1eb", border: "1px solid #dcd6ca", borderRadius: 6, fontSize: 11, color: "#7a7265", marginBottom: 14 }}>
                Using NC State budget defaults. Adjust yield, price, or costs above to reflect your operation.
              </div>
            )}

            {/* Crop Ranking */}
            {cropRankings && (
              <div style={{ ...card, padding: "14px 18px", marginBottom: 14 }}>
                <div style={{ display: "flex", gap: 20, flexWrap: "wrap", fontSize: 12 }}>
                  <div>
                    <div style={{ fontSize: 10, fontFamily: MONO, color: "#7a7265", textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 5 }}>By Net Return</div>
                    {cropRankings.byNetReturn.map((r, i) => (
                      <div key={r.crop} style={{ display: "flex", gap: 6, alignItems: "center", marginBottom: 2 }}>
                        <span style={{ fontSize: 10, fontFamily: MONO, color: "#a89e8c", width: 14 }}>{i + 1}.</span>
                        <span style={{ color: CROPS[r.crop].accent, fontWeight: 600 }}>{r.label}</span>
                        <span style={{ fontFamily: MONO, color: r.b.netReturn >= 0 ? "#2d7a3a" : "#e5484d" }}>{fmtD(r.b.netReturn)}</span>
                      </div>
                    ))}
                  </div>
                  <div>
                    <div style={{ fontSize: 10, fontFamily: MONO, color: "#7a7265", textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 5 }}>Lowest Break-Even Price</div>
                    {cropRankings.byBEPrice.map((r, i) => (
                      <div key={r.crop} style={{ display: "flex", gap: 6, alignItems: "center", marginBottom: 2 }}>
                        <span style={{ fontSize: 10, fontFamily: MONO, color: "#a89e8c", width: 14 }}>{i + 1}.</span>
                        <span style={{ color: CROPS[r.crop].accent, fontWeight: 600 }}>{r.label}</span>
                        <span style={{ fontFamily: MONO, color: "#6b6457" }}>${r.b.bePriceTotal.toFixed(2)}</span>
                      </div>
                    ))}
                  </div>
                  <div>
                    <div style={{ fontSize: 10, fontFamily: MONO, color: "#7a7265", textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 5 }}>By Operating Margin</div>
                    {cropRankings.byOpMargin.map((r, i) => (
                      <div key={r.crop} style={{ display: "flex", gap: 6, alignItems: "center", marginBottom: 2 }}>
                        <span style={{ fontSize: 10, fontFamily: MONO, color: "#a89e8c", width: 14 }}>{i + 1}.</span>
                        <span style={{ color: CROPS[r.crop].accent, fontWeight: 600 }}>{r.label}</span>
                        <span style={{ fontFamily: MONO, color: r.b.incAboveOp >= 0 ? "#2d7a3a" : "#e5484d" }}>{fmtD(r.b.incAboveOp)}</span>
                      </div>
                    ))}
                  </div>
                </div>
              </div>

            <div style={{ display: "flex", gap: 14, flexWrap: "wrap", marginBottom: 18 }}>
              {activeCrops.map(crop => {
                const b = budgets[crop]; const db = defaultBudgets[crop]; const a = parseFloat(acres[crop]);
                const status = assumptionStatus(crop);
                const yieldDiff = Math.round(b.yield) !== CROPS[crop].defaultYield;
                const priceDiff = b.price !== CROPS[crop].defaultPrice;
                const netDiff = Math.abs(b.netReturn - db.netReturn) > 0.5;
                const be = beData[crop];
                return (
                  <div key={crop} style={{ flex: "1 1 220px", ...card, marginBottom: 0, padding: 18, border: `2px solid ${b.netReturn >= 0 ? CROPS[crop].color : "#e5484d"}`, background: b.netReturn >= 0 ? CROPS[crop].lightBg : "#fef3f2" }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
                      <div style={tag(CROPS[crop].accent)}>{CROPS[crop].label}</div>
                      {/* Operating cost coverage signal */}

              <DocH2 n="1" title="Overview" />
              <p>The NC Crop Budget Scenario Builder turns NC State's published enterprise budgets into an interactive, personalized planning aid. Rather than asking a farmer to download an Excel workbook and locate the right cells across multiple tabs, the tool lets a user enter a small number of inputs about their own operation and immediately see projected returns, break-even thresholds, risk scenarios, and sensitivity to key assumptions.</p>
              <p>This page explains exactly which source spreadsheets were used, what numbers were extracted, how the budget math was reproduced, and what was added on top. The goal is full transparency so reviewers can verify the tool faithfully represents the underlying budgets before it goes in front of farmers or Extension agents.</p>
              <DocCallout>
                The budget numbers in the tool come from one of three sources: (1) values extracted from the four NC State enterprise budget spreadsheets, (2) standard budget math applied to those numbers, or (3) calculations the user controls. On top of that, the tool adds a layer of <strong>decision aids</strong> — quick scenario steps, warning thresholds, data-quality tiers, and the ±15% tornado swing — that are heuristic conventions, not extracted from the budgets. They are flagged in Section 7 so reviewers can adjust or reject them.
              </DocCallout>

              <DocH2 n="2" title="Source Materials" />
              <p>Four spreadsheets prepared by NC State Extension served as the basis:</p>
              <DocTable headers={["File", "Sheets used", "Author(s)", "What was extracted"]} rows={[
                ["Corn-Interactive-2026.xlsx", "Corn High, Corn Mod, Corn Low, Corn No Till", "D. Washburn, C. Scanlan", "Corn cost categories, defaults, yield tiers, machinery fixed costs"],

                ["Sweetpotato-Interactive-2026.xlsx", "Sweetpotato Budget", "ARE Extension", "Reviewed for structure. Not in v1."],
                ["crop-comparison-tool_2026_with_nep-updates.xlsx", "Crop Comparison, Yield Predictor, NASS Data", "N. Piggott (prices), D. Washburn (costs)", "Soybean & wheat cost categories, prices, yield-trend methodology, NASS county yields"],
              ]} />
              <p style={{ marginTop: 10 }}>The v1 tool includes corn, soybeans, and wheat — chosen first because they share a consistent budget structure, prices tie to publicly traded futures plus a basis adjustment, and the Crop Comparison yield predictor was already designed for them.</p>

              <DocH2 n="3" title="Numbers Extracted from the Budgets" />
              <p>For each crop, the tool stores default cost line items, a default yield, and a price (futures + basis). All values are editable; the defaults serve as the starting point when no farm-specific information has been entered.</p>
              <DocH3 title="3.1 Corn (Corn Mod sheet)" />

              <DocH2 n="4" title="Budget Math" />
              <p>The calculation structure follows the published enterprise budgets closely. Interest on operating capital is calculated only on selected interest-bearing operating items, that interest is added to operating costs, and general overhead is then calculated as 7% of total operating costs <em>including</em> interest. The tool separates costs into "Operating" and "Ownership" sections so land rent and fixed machinery are visually separated from variable inputs. The calculation logic matches the source budget formulas; review flags are noted in Section 4.5.</p>
              <DocH3 title="4.1 The Seven Lines of an Enterprise Budget" />
              <ol>
                <li>Gross Receipts = Yield × Price</li>
                <li>Total Operating Costs = Sum of operating line items + interest (on selected items — see 4.3)</li>
                <li>Income Above Operating Costs = Gross Receipts − Total Operating Costs</li>
                <li>Ownership Costs = Land rent + machinery fixed cost</li>
                <li>General Overhead = 7% × Total Operating Costs (post-interest)</li>
                <li>Total Costs = Operating + Ownership + Overhead</li>
                <li>Net Return = Gross Receipts − Total Costs</li>
              </ol>
              <DocH3 title="4.2 Yield-Based Cost Items" />
              <p>Three cost items scale with yield rather than being flat per-acre amounts: drying ($0.20/bu for corn), hauling ($0.60/bu for corn and soybeans, $0.15/bu for wheat), and the implicit base on which interest is calculated. The tool reproduces this behavior.</p>
              <DocH3 title="4.3 Interest on Operating Capital & General Overhead" />
              <p>These two formulas are the most technically subtle part of the published budgets, and an early version of this tool got both of them wrong. They have been corrected to match the source spreadsheets exactly (Corn Mod cells D22 and D27):</p>
              <p><strong>Interest is not calculated on all operating costs.</strong> It applies only to inputs typically financed before harvest: seed, fertilizer, lime, herbicides/insecticides/fungicides, variable machinery costs, and labor. It does NOT apply to drying, hauling, fertilizer spreading, consulting, or crop insurance.</p>
              <p><strong>General overhead is 7% of operating costs INCLUDING interest.</strong> The formula in the spreadsheet is D27 = F23 (Total Variable Costs), and Total Variable Costs is SUM(F8:F22), which includes the interest line.</p>
              <DocCode>interest = interestBearingSubtotal × 0.5 × 0.0725{"\n"}opTotal  = operatingSubtotal + interest{"\n"}overhead = opTotal × 0.07</DocCode>
              <p>The 0.5 multiplier reflects average 6-month loan length; 7.25% matches cell E22; 7% matches cell E27.</p>
              <DocH3 title="4.4 Break-Even Calculations" />
              <DocCode>Break-even yield (variable)  = Operating Costs ÷ Price{"\n"}Break-even yield (total)     = Total Costs ÷ Price{"\n"}Break-even price  (variable) = Operating Costs ÷ Yield{"\n"}Break-even price  (total)    = Total Costs ÷ Yield</DocCode>
              <DocH3 title="4.5 Departures from the Published Budgets in Wording" />
              <DocCallout>
                Three small organizational/wording choices depart from the published budgets — flagged so reviewers can confirm or override. None change the underlying math.
                <ol style={{ marginTop: 10, paddingLeft: 20 }}>
                  <li><strong>Land rent default.</strong> Derek's individual crop budgets do not include land rent as a line item — only the Crop Comparison workbook does. The tool defaults rent to $100/ac (matching Crop Comparison), editable to $0.</li>
                  <li><strong>Net Return label.</strong> Published: "Net Returns to Land, Risk, and Management." Tool: "Net Return to Risk &amp; Management" (because land rent is already an explicit cost line). Same number.</li>
                  <li><strong>Cost category labels.</strong> Tool uses "Income Above Operating Costs" vs. published "Income Above Variable Costs." Same number.</li>
                </ol>
              </DocCallout>

              <DocH2 n="5" title="Yield Projection Methods" />
              <p>If no yield history is entered, the tool uses the budget default. If history is entered, four projection methods are offered, matching the methodology in the New2023-Farm-Yield_Predictor sheet:</p>
              <ul>
                <li><strong>Trend yield (linear regression):</strong> OLS regression of yield on year, projected at 2026. Matches the formulas in cells Q18, R18, T18, U18 of the predictor sheet.</li>
                <li><strong>Recent 5-year / 10-year averages:</strong> arithmetic mean of the most recent N years entered. If fewer years available than the window requires, the tool uses what it has and labels the cell "only X yrs."</li>
                <li><strong>All-year average:</strong> available with 7+ years entered. Simple arithmetic average of all entered years.</li>
                <li><strong>Manual override:</strong> typing a value directly in the Expected Yield row overrides any method.</li>
              </ul>

              <DocH2 n="6" title="Risk and Sensitivity Analysis" />
              <p>Three forms of risk analysis, all derived from the farmer's own yield history. No probabilistic forecasts, distributions, or Monte Carlo simulations are used in this version.</p>
              <DocH3 title="6.1 Historical Percentile Scenarios" />
              <p>With 3+ years of yield history, the tool calculates the 25th and 75th percentiles of actual yields and runs the full budget at each, labeled <em>Historical Lower-Yield (25%)</em>, <em>Selected Expected</em>, and <em>Historical Higher-Yield (75%)</em>. A warning fires if the selected expected yield falls outside the 25–75 range.</p>
              <DocH3 title="6.2 Years Negative" />
              <p>For each crop, the tool reports how many entered yield years would have produced a negative return at current prices and costs — phrased as a historical count, not a probability: <em>"Using the 6 yield years entered, 2 would have produced a negative return at current prices and costs."</em> With only 3–6 observations, this is not reliable as a probability estimate, and the tool does not claim it is.</p>
              <DocH3 title="6.3 Tornado Sensitivity Chart" />
              <p>For each crop, the tool computes how much net return changes when each input is varied by ±15%. The eight largest swings are displayed as horizontal bars, sorted widest to narrowest.</p>
              <DocH3 title="6.4 'What Would Have to Change?' Panel" />
              <p>For each crop: break-even price, break-even yield, maximum land rent before break-even is lost, required cost reduction (if currently losing money), and a 5×5 price-by-yield combination grid with the base case highlighted.</p>
              <DocH3 title="6.5 Data Quality Indicator" />
              <p>Quality tier based on the <em>minimum</em> number of years across active crops (the weakest history governs):</p>
              <DocTable headers={["Years (min)", "Label", "Message"]} rows={[
                ["0–2", "Insufficient for some crops", "At least one active crop has fewer than 3 years."],
                ["3–4", "Limited history", "Usable for trend projection; risk scenarios cautiously."],
                ["5–9", "Useful history", "Enough for basic scenarios."],
                ["10–14", "Good history", "Solid for percentile-based scenarios."],
                ["15+", "Strong history", "Good candidate for risk analysis."],
              ]} />

              <DocH2 n="7" title="Decision Aids Added on Top of the Budgets" />
              <p>These are reasonable tool conventions, not extracted from the source spreadsheets. Flagged here so reviewers can adjust or reject them.</p>
              <ul>
                <li><strong>Quick scenario toggles:</strong> Price ±10%, Yield ±10%, Fertilizer +15%, Fuel/Hauling +15%. Apply a global multiplier across all crops simultaneously.</li>
                <li><strong>Contextual warning thresholds:</strong> yield more than 35% above/below default; price below total-cost break-even; covers operating but not total costs; land rent exceeding 15% of total cost when net return is negative.</li>
                <li><strong>Tornado swing range:</strong> ±15% applied to each input to identify the eight inputs with most leverage on net return.</li>
                <li><strong>Acres & whole-farm totals:</strong> per-crop net return × acres, summed. Reproduces the Crop Comparison Farm Summary concept but updates live.</li>
                <li><strong>Comparison to NC State default:</strong> when a user has changed any assumption, each crop card shows a small comparison table to keep the published baseline visible.</li>
                <li><strong>Crop ranking:</strong> with two or more crops active, side-by-side rankings by Net Return, Lowest Break-Even Price, and Operating Margin.</li>
              </ul>

              <DocH2 n="8" title="Limitations" />
              <ul>
                <li><strong>Crops:</strong> only corn, soybeans, and wheat are wired in. Tobacco, sweet potatoes, peanuts, cotton, sorghum follow the same structure but are not yet included.</li>
                <li><strong>County selector:</strong> considered but removed. Asking for an input that does not change any output is misleading. Will be added back when the underlying calculation uses it.</li>
                <li><strong>Government program payments:</strong> ARC/PLC and other federal program payments are not included. Net return is to land, risk, and management before any program payments.</li>
                <li><strong>Crop insurance indemnities:</strong> premiums are included as a cost; expected indemnity is not added back. The published budgets work this way as well.</li>
                <li><strong>Probabilistic forecasts:</strong> no Monte Carlo, no predicted probabilities of loss. Risk numbers are descriptive: "how many of your historical years would have lost money."</li>
                <li><strong>Land-use constraints:</strong> the tool assumes acres can be freely shifted between crops. In reality, some ground is suited only to certain crops. The crop ranking should be read as a per-acre comparison, not a whole-farm allocation, when this matters.</li>
                <li><strong>Multi-year & financial planning:</strong> single-season decision aid only. Cash flow, debt service, and tax effects are out of scope.</li>
              </ul>

              <DocH2 n="9" title="Verifying the Tool Against the Source Budgets" />
              <DocH3 title="9.1 Corn at Default Settings" />
              <p>Activate only corn. Set both Land Rent and Crop Insurance to $0 in the cost adjustments (the Corn Mod sheet does not include either). Leave all other assumptions at default. The entire cost side reproduces the Corn Mod sheet to the penny:</p>
              <DocTable headers={["Line", "Tool", "Spreadsheet (Corn Mod)", "Match"]} rows={[
                ["Interest-Bearing Subtotal", "$397.87", "$397.87 (=F18 + F8:F15 + F21)", "Exact"],
                ["Interest on Operating Capital", "$14.42", "$14.42", "Exact"],
                ["Total Operating Costs (incl. interest)", "$552.29", "$552.29", "Exact"],
                ["General Overhead (7% × post-interest)", "$38.66", "$38.66", "Exact"],
                ["Ownership (machinery only, no rent)", "$135.71", "$135.71", "Exact"],
                ["Total Costs", "$726.66", "$726.66", "Exact"],
                ["Revenue", "$742.00", "$732.20", "Differs by price"],
                ["Net Return", "$15.34", "$5.54", "Differs by price"],
              ]} />
              <p style={{ marginTop: 10 }}>The only difference is on the revenue line, and it comes entirely from the price source: the tool uses $5.30/bu (Crop Comparison, for cross-crop consistency); Corn Mod uses $5.23/bu. At 140 bu/ac, that $0.07 produces exactly $9.80 more revenue and net return. The cost calculations are identical. If you prefer the Corn Mod price of $5.23, it's a one-line change.</p>
              <DocH3 title="9.2 Test Suite" />
              <p>A standalone test file (<code style={{ background: "#f5f0e6", padding: "2px 5px", borderRadius: 3, fontFamily: MONO, fontSize: 12 }}>budget-tests.js</code>) extracts the real budget functions from this tool and runs 46 assertions covering: corn cost reproduction to the penny, the interest-bearing-items logic, the overhead convention, soybean and wheat default budgets, price/basis reconciliation, break-even consistency, the linear-trend slope on a known series, and the percentile helper. All 46 currently pass. Run with <code style={{ background: "#f5f0e6", padding: "2px 5px", borderRadius: 3, fontFamily: MONO, fontSize: 12 }}>node budget-tests.js</code>.</p>

              <DocH2 n="10" title="Questions for Reviewers" />
              <p>Before this goes in front of farmers or Extension agents, the specific points where reviewer judgment is needed:</p>
              <ul>
                <li><strong>Are the budget categories represented correctly?</strong> Especially the split between operating and ownership costs. Does separating land rent and fixed machinery from variable inputs improve readability, or create confusion against the published budgets?</li>
                <li><strong>Is the land rent default acceptable?</strong> Tool defaults to $100/ac matching Crop Comparison. Derek's individual budgets don't include rent. Should default be $0?</li>
                <li><strong>Is "Net Return to Risk &amp; Management" the right label?</strong> Or revert to the published "Net Returns to Land, Risk, and Management"?</li>
                <li><strong>Is the "What Would Have to Change?" section useful?</strong> Does the break-even framing match how farmers actually think about whether a crop can work?</li>
                <li><strong>Are the contextual warnings helpful or too strong?</strong> Section 7 lists them.</li>
                <li><strong>Does the yield-history and projection-method logic feel trustworthy?</strong> Particularly the data-quality message based on the minimum years across crops.</li>
                <li><strong>What is missing for a farmer to actually use this?</strong> The most important question. Features were chosen from spreadsheets and ag-econ principles, not from real-world farmer feedback. Introductions to producers welcome.</li>
              </ul>

              <DocH2 n="11" title="Closing Note" />
              <p>The intent is not to replace the published NC State enterprise budgets — those remain the authoritative source. The intent is to make them easier to use as a decision tool, in the same way the Crop Comparison workbook is a step beyond the individual crop budgets.</p>
              <p>Every number can be traced back to one of the four source spreadsheets plus the user's own inputs. The calculation logic matches the source budget formulas. The departures from the source files are organizational and naming choices flagged in Section 4.5. The risk and sensitivity features are descriptive summaries of the farmer's own data, not forecasts.</p>
              <p style={{ marginTop: 16, paddingTop: 12, borderTop: "1px solid #e8e4db", fontSize: 12, color: "#8a8175", fontStyle: "italic" }}>
                Contact for questions or corrections: Julianne Treme, Director of Undergraduate Programs, ARE, NC State.
              </p>
            </div>
          </div>
        )}

        {/* Disclaimer */}
        <div style={{ padding: 12, background: "#e8e4db", borderRadius: 6, fontSize: 10, color: "#6b6457", lineHeight: 1.6, marginTop: 8 }}>
          <strong>Disclaimer:</strong> For planning purposes only. Based on 2026 enterprise budgets by Derek Washburn and Nick Piggott, NC State Dept. of Agricultural & Resource Economics.{" "}

        </div>
      </div>
    </div>
  );
}

}
