<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ABM World V6</title>
<style>
:root{--paper:#f7f1e3;--paper2:#eee3cd;--ink:#27231d;--soft:#6d655b;--red:#a9362d;--green:#39724a;--gold:#c5962e;--card:#fffdf7;--blue:#2d7182}
*{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif} body.modal-open{overflow:hidden;position:fixed;inset:0;width:100%}
button{font:inherit;cursor:pointer} .hidden{display:none!important}
header{display:flex;align-items:center;gap:18px;padding:14px 22px;border-bottom:1.5px solid var(--ink);background:rgba(255,253,247,.94)}
.brand{font-family:Georgia,serif;font-size:26px;font-weight:800;display:flex;align-items:center} .brand .compass-o{width:.82em;height:.82em;margin:0 .02em;color:var(--red)} .brand span{color:var(--red)} .sub{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--soft)} .spacer{flex:1}
.reset{border:0;background:none;text-decoration:underline;color:var(--soft)}
.app{display:grid;grid-template-columns:minmax(0,1fr) 500px;min-height:calc(100vh - 64px)} @media(max-width:1080px){.app{grid-template-columns:1fr}}
.worldcol{padding:14px 18px} aside{border-left:1.5px solid var(--ink);background:var(--card);padding:22px;overflow:auto;max-height:calc(100vh - 64px)} @media(max-width:980px){aside{border-left:0;border-top:1.5px solid var(--ink);max-height:none}}
.world-title{font-family:Georgia,serif;font-size:24px;margin:0 0 12px}
.world{position:relative;width:100%;margin:auto;border:1.5px solid var(--ink);border-radius:15px;overflow:hidden;background:#d9cfbb;box-shadow:0 8px 28px rgba(0,0,0,.16)}
.world img{display:block;width:100%;filter:url(#mapSharpen) saturate(1.02) contrast(1.03) brightness(1.02);transition:.5s;image-rendering:auto}
.world.has-progress img{filter:url(#mapSharpen) saturate(1.02) contrast(1.03) brightness(1.02)}
.world::after{content:"";position:absolute;inset:0;background:transparent;pointer-events:none;z-index:1;transition:.5s}
.world.has-progress::after{background:transparent}



.region-glow{
  position:absolute;
  z-index:2;
  pointer-events:none;
  transform:translate(-50%,-50%);
  border-radius:50%;
  opacity:0;
  transition:opacity .55s ease;
  background:transparent;
}
.region-glow.active{
  opacity:1;
  animation:breath 4.4s ease-in-out infinite;
}
.region-glow::before{
  content:"";
  position:absolute;
  inset:8% 5% 0;
  border-radius:50%;
  background:
    radial-gradient(ellipse at 50% 62%,
      rgba(var(--rgb),var(--core)) 0%,
      rgba(var(--rgb),var(--mid)) 30%,
      rgba(var(--rgb),var(--edge)) 55%,
      rgba(var(--rgb),0) 79%);
  filter:blur(13px) saturate(1.25);
  mix-blend-mode:screen;
}
.region-glow::after{
  content:"";
  position:absolute;
  left:20%;
  right:20%;
  bottom:8%;
  height:42%;
  border-radius:50%;
  background:
    radial-gradient(ellipse at center,
      rgba(255,245,190,var(--shine)) 0%,
      rgba(249,215,111,calc(var(--shine)*.58)) 48%,
      rgba(249,215,111,0) 80%);
  filter:blur(11px);
  mix-blend-mode:screen;
}
@keyframes breath{
  50%{
    transform:translate(-50%,-50%) scale(1.04);
    opacity:.92;
  }
}
.marker{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);z-index:3;border:0;background:none;padding:0}
.marker .dot{display:block;width:7px;height:7px;border-radius:50%;background:rgba(93,85,74,.5);border:1px solid rgba(255,255,255,.7);opacity:0;transition:opacity .25s,transform .25s,box-shadow .25s}
.marker:hover .dot,.marker:focus .dot{opacity:.28}
.marker.done .dot{width:8px;height:8px;background:#f1d875;opacity:.9;box-shadow:0 0 7px rgba(229,191,65,.7)}
.marker.next .dot{background:#e6cf7b;opacity:.74;box-shadow:0 0 5px rgba(229,191,65,.5)} .marker .label{position:absolute;left:50%;top:14px;transform:translateX(-50%);white-space:nowrap;background:rgba(255,253,247,.97);border:1px solid #b9afa1;border-radius:12px;padding:3px 8px;font-size:10px;font-weight:700;opacity:0;pointer-events:none} .marker:hover .label,.marker:focus .label{opacity:1}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--soft)} .legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.kicker{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--soft)} h2,h3,h4{font-family:Georgia,serif} .count{font-family:Georgia,serif;font-size:40px;font-weight:800}
.profile{background:var(--paper2);padding:10px 12px;border-radius:10px;font-size:12px;color:var(--soft);margin:8px 0 16px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px} .tabs button{border:1px solid #bdb3a5;background:transparent;border-radius:16px;padding:6px 10px;font-size:11px;font-weight:700} .tabs button.on{background:var(--ink);color:white}
.section{margin:18px 0} .section h3{margin:0 0 3px} .section-sub{font-size:12px;color:var(--soft);margin-bottom:8px}
.card{border:1.5px solid #c9c0b2;border-radius:12px;padding:12px;margin:8px 0;background:var(--paper)} .card.next{border-color:var(--gold)} .card.eligible{border-color:var(--green)} .card.build{border-color:var(--blue);background:#f2fbfd} .card.future{border-color:#8f7ca8;background:#faf7ff}
.tier{font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--soft)} .card h4{font-size:18px;margin:3px 0} .where{font-size:10px;color:var(--soft);margin-bottom:6px} .why{font-size:12px;color:#8f2a24;font-weight:700} .card p{font-size:12.5px;line-height:1.45}
.note{background:var(--paper2);border-left:3px solid var(--gold);padding:9px 11px;border-radius:0 8px 8px 0;margin:10px 0;font-size:12px}
.btns{display:flex;gap:6px;flex-wrap:wrap} .btns button,.nav button{border:1px solid var(--ink);border-radius:18px;background:transparent;padding:6px 11px;font-size:11px;font-weight:700} .btns .primary,.nav .primary{background:var(--red);border-color:var(--red);color:white} .btns .saved{background:var(--gold);border-color:var(--gold);color:white}
.overlay{position:fixed;inset:0;background:rgba(38,34,28,.6);z-index:20;display:grid;place-items:center;padding:18px} .modal{width:min(760px,100%);max-height:92vh;overflow:auto;background:var(--paper);border:2px solid var(--ink);border-radius:16px;padding:28px}
.chapter{font-size:10px;letter-spacing:.17em;text-transform:uppercase;color:var(--red)} .modal h1{font-family:Georgia,serif;font-size:42px;line-height:1;margin:10px 0} .modal h1 span{color:var(--red)} .modal h2{font-size:28px;margin:8px 0} .lead{color:var(--soft)} .chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0} .chip{border:1.5px solid #aaa095;border-radius:18px;background:var(--card);padding:8px 14px;font-weight:700} .chip.on{background:var(--red);border-color:var(--red);color:white}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px} @media(max-width:620px){.grid{grid-template-columns:1fr}} .check{display:flex;gap:8px;align-items:flex-start;border:1px solid #d2c9bb;border-radius:9px;padding:8px;background:var(--card);font-size:12.5px} .check input{accent-color:var(--green)} .nav{display:flex;align-items:center;gap:9px;margin-top:18px} .nav .step{margin-left:auto;font-size:11px;color:var(--soft)} .back{border:0;background:none;text-decoration:underline;color:var(--soft);padding:0}
.coursebox{border:1px solid #cfc5b7;border-radius:10px;padding:12px;background:var(--card);margin:10px 0} .coursebox label{display:block;margin:5px 0} input[type=number]{width:90px;padding:7px;border:1px solid #aaa;border-radius:7px}
.badge{display:inline-block;border-radius:12px;padding:3px 8px;font-size:10px;font-weight:700;background:var(--paper2);margin:2px}

.goal-list{margin:10px 0 0;padding:0;list-style:none}
.goal-item{display:flex;gap:10px;align-items:flex-start;border:1.5px solid #bfb5a6;background:#fffdf7;border-radius:10px;padding:10px;margin:7px 0}
.goal-num{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:white;font-weight:800;flex:0 0 auto}
.goal-copy{flex:1;font-size:12.5px;line-height:1.4}
.goal-copy b{display:block;font-family:Georgia,serif;font-size:16px;margin-bottom:2px}
.goal-remove{border:0;background:none;color:var(--soft);text-decoration:underline;font-size:11px}
.region-focus{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.region-pill{border:2px solid var(--gold);background:#fff7d6;border-radius:18px;padding:7px 11px;font-weight:800;font-size:12px;box-shadow:0 0 0 3px rgba(197,150,46,.12);cursor:pointer}.region-pill:hover,.region-pill:focus{background:#ffeaa3;transform:translateY(-1px)}
.region-pulse{animation:regionPulse 1.8s ease-in-out infinite}
@keyframes regionPulse{50%{transform:scale(1.04);box-shadow:0 0 0 6px rgba(197,150,46,.18)}}
.sport-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}
@media(max-width:620px){.sport-grid{grid-template-columns:1fr}}

.tab-nudge{background:#fff7d6;border:1.5px solid var(--gold);border-radius:10px;padding:9px 11px;margin:8px 0 12px;font-size:12px;font-weight:700}
.tabs button.has-items{position:relative;box-shadow:0 0 0 2px rgba(197,150,46,.16)}
.tabs button.has-items::after{content:"";position:absolute;right:-3px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--gold)}
.tabs button.attention{animation:tabPulse 1.8s ease-in-out infinite}
@keyframes tabPulse{50%{transform:translateY(-2px);box-shadow:0 0 0 4px rgba(197,150,46,.18)}}

.region-hotspot{position:absolute;z-index:4;transform:translate(-50%,-50%);border:0;background:transparent;color:transparent;border-radius:50%;padding:0;cursor:pointer}
.region-hotspot:hover,.region-hotspot:focus{outline:3px solid rgba(197,150,46,.72);outline-offset:2px;background:rgba(255,235,150,.10)}
.region-hotspot.active{outline:4px solid rgba(197,150,46,.88);outline-offset:2px;background:rgba(255,235,150,.14)}
.region-plaque{position:absolute;z-index:5;transform:translate(-50%,-50%);background:rgba(24,20,12,.82);border:1px solid #caa14e;border-radius:6px;color:#f0dca8;font-family:Georgia,serif;font-size:clamp(8px,1.05vw,12px);letter-spacing:.06em;padding:3px 8px;white-space:nowrap;cursor:pointer;text-shadow:0 1px 2px #000;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.region-plaque:hover,.region-plaque:focus{background:rgba(46,36,16,.92);border-color:#f0c46a;color:#ffe9b0}
.region-plaque.active{border-color:#f0c46a;box-shadow:0 0 0 2px rgba(240,196,106,.55),0 2px 8px rgba(0,0,0,.5)}
.region-plaque.lit{background:rgba(64,48,14,.9);border-color:#f0c46a;color:#ffe9b0;box-shadow:0 0 10px rgba(240,196,106,.45),0 2px 8px rgba(0,0,0,.5)}
.live-key{position:absolute;z-index:6;left:1%;bottom:1%;width:64%;min-height:12%;background:#111927;border:1px solid #2a3a52;border-radius:8px;display:flex;align-items:center;gap:2.2%;padding:.6% 1.4%;color:#e8eefa;font-size:clamp(9px,1.05vw,14px);line-height:1.25}
.live-key b{font-family:Georgia,serif;letter-spacing:.12em;color:#f0c46a;font-size:clamp(10px,1.15vw,15px);white-space:nowrap}
.live-key span{display:flex;align-items:center;gap:6px}
.live-key i{font-style:normal}
.live-key .k-lit{background:rgba(64,48,14,.95);border:1px solid #f0c46a;color:#ffe9b0;border-radius:5px;padding:1px 7px;font-family:Georgia,serif;white-space:nowrap;font-size:.9em}
.live-key .k-fw{color:#9d8be8;text-shadow:0 0 6px rgba(157,139,232,.9);font-size:1.2em}
.live-key .k-hand{font-size:1.15em}
.live-key .k-dim{display:inline-block;width:14px;height:14px;border-radius:4px;background:linear-gradient(135deg,#3a4a3c 50%,#151d2c 50%);border:1px solid #2a3a52}
@media(max-width:700px){.live-key{position:static;width:100%;margin-top:6px;flex-wrap:wrap}}
@media(max-width:600px){
  .chip{padding:11px 16px;min-height:44px;display:inline-flex;align-items:center;font-size:14px}
  .nav button,.btns button,.tabs button{min-height:44px;padding:10px 16px}
  .nav{flex-wrap:wrap}
  .region-plaque{padding:7px 11px;font-size:clamp(10px,3vw,13px);min-height:30px;display:flex;align-items:center}
  .modal{padding:18px}
  .modal h1{font-size:clamp(28px,8vw,36px)}
  .modal h2{font-size:clamp(20px,6vw,25px)}
  header{flex-wrap:wrap;row-gap:6px}
}
.region-planner{border:2px solid var(--gold);background:linear-gradient(135deg,#fffdf7,#fff4c7);border-radius:14px;padding:14px;margin:12px 0}
.region-planner h3{margin:0 0 4px}
.region-planner .region-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
@media(max-width:620px){.region-planner .region-grid{grid-template-columns:1fr}}
.region-card{border:1px solid #c9b776;background:rgba(255,255,255,.7);border-radius:10px;padding:10px}
.region-card b{font-family:Georgia,serif;font-size:15px}
.region-card small{display:block;color:var(--soft);margin-top:3px}
.goal-board{background:linear-gradient(135deg,#2f2a24,#4a4035);border-radius:16px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.22);margin-top:10px}
.goal-board-title{color:white;font-family:Georgia,serif;font-size:22px;margin:0 0 4px}
.goal-board-sub{color:#e8dcc9;font-size:12px;margin-bottom:10px}
.goal-list{display:grid;gap:10px}
.goal-item{position:relative;overflow:hidden;background:linear-gradient(135deg,#fffdf7,#f7edd2);border:0;border-left:6px solid var(--gold);border-radius:12px;padding:12px 12px 12px 14px;box-shadow:0 5px 14px rgba(0,0,0,.15)}
.goal-item::after{content:"";position:absolute;right:-18px;top:-18px;width:68px;height:68px;border-radius:50%;background:rgba(197,150,46,.13)}
.goal-num{background:var(--red);box-shadow:0 2px 8px rgba(0,0,0,.18)}
.goal-region{display:inline-block;margin-top:4px;border-radius:12px;padding:3px 8px;background:#ead8a1;font-size:10px;font-weight:800}
.goal-action{margin-top:7px;font-size:12px}
.goal-remove{position:relative;z-index:2}
.empty-goals{color:#f2e8d8;border:1px dashed rgba(255,255,255,.45);border-radius:10px;padding:12px;text-align:center}

.landmark-section{margin:14px 0}
.landmark-section h4{margin:0 0 7px;font-size:17px}
.landmark-section .section-count{font-family:Inter,system-ui,sans-serif;font-size:11px;color:var(--soft);font-weight:600}
.landmark-empty{font-size:12px;color:var(--soft);font-style:italic;padding:6px 0}
.completed-summary{
  background:linear-gradient(135deg,#fff8dd,#f2e1a7);
  border:1.5px solid #c5962e;
  border-radius:14px;
  padding:14px;
  margin:10px 0 14px;
  box-shadow:0 5px 16px rgba(82,61,20,.12);
}
.completed-summary strong{
  display:block;
  font-family:Georgia,serif;
  font-size:20px;
  margin-bottom:3px;
}
.completed-stats{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:9px;
}
.completed-stat{
  background:rgba(255,253,247,.78);
  border:1px solid rgba(145,107,31,.32);
  border-radius:16px;
  padding:5px 9px;
  font-size:11px;
  font-weight:800;
}
.completed-region{
  border:1px solid #d1c5b4;
  border-radius:12px;
  overflow:hidden;
  margin:10px 0;
  background:#fffdf7;
}
.completed-region-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  background:#eee3cd;
  padding:9px 11px;
  font-family:Georgia,serif;
  font-size:16px;
  font-weight:800;
}
.completed-region-count{
  font-family:Inter,system-ui,sans-serif;
  font-size:10px;
  color:var(--soft);
  font-weight:800;
}
.completed-list{
  list-style:none;
  margin:0;
  padding:4px 10px 8px;
}
.completed-list li{
  position:relative;
  padding:8px 30px 8px 22px;
  border-top:1px solid #eee5d8;
  font-size:12.5px;
  line-height:1.35;
}
.completed-list li:first-child{border-top:0}
.completed-list li::before{
  content:"✓";
  position:absolute;
  left:1px;
  top:8px;
  width:15px;
  height:15px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:var(--green);
  color:white;
  font-size:10px;
  font-weight:900;
}
.completed-hie{
  display:inline-block;
  margin-left:5px;
  padding:2px 6px;
  border-radius:9px;
  background:#e7faff;
  border:1px solid #48cde6;
  color:#315a87;
  font-size:8.5px;
  font-weight:900;
  letter-spacing:.04em;
}
.completed-undo{
  position:absolute;
  right:0;
  top:6px;
  border:0;
  background:none;
  color:var(--soft);
  font-size:10px;
  text-decoration:underline;
  padding:2px;
}

.download-record-row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin:12px 0 2px;
}
.download-record-note{
  font-size:11px;
  color:var(--soft);
  margin-top:6px;
}
.completed-celebration{
  margin-top:12px;
  padding:11px;
  border-left:4px solid var(--red);
  background:#f8eee8;
  border-radius:0 9px 9px 0;
  font-family:Georgia,serif;
  font-size:16px;
}


.reconsider{margin-top:14px;border:1px dashed #b9aa8f;background:#fbf7ee;border-radius:12px;padding:12px}
.reconsider h4{margin:0 0 5px}
.reconsider p{font-size:12px;color:var(--soft);margin:0 0 8px}
.reconsider-item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:7px 0;border-top:1px solid #e0d6c5}
.reconsider-item:first-of-type{border-top:0}

.goal-board .btns button{
  background:#fffdf7;
  color:#27231d;
  border:2px solid #f0cf67;
  box-shadow:0 3px 10px rgba(0,0,0,.25);
}
.goal-board .btns button:hover,
.goal-board .btns button:focus{
  background:#f0cf67;
  color:#27231d;
  transform:translateY(-1px);
}
.goal-save-status{
  color:#f6e7b0;
  font-size:11px;
  margin-top:7px;
  min-height:16px;
}

.room-created,
.visit-room,
.room-summary,
.hesitated,
.you-hesitated{
  color:#2b241e !important;
  font-size:15px !important;
  line-height:1.45 !important;
  font-weight:600 !important;
}
.room-created .label,
.visit-room .label,
.room-summary .label{
  color:#1f1a16 !important;
  font-size:16px !important;
  font-weight:800 !important;
}
.hesitated,
.you-hesitated{
  color:#4a3a2b !important;
}

aside{
  font-size:15px;
  line-height:1.5;
}
aside .kicker{font-size:11px}
aside h2{font-size:31px;line-height:1.12}
aside h3{font-size:23px}
aside h4{font-size:19px}
aside .section-sub,
aside .profile,
aside .where,
aside .tier,
aside .note,
aside .card p,
aside .goal-copy,
aside .region-card,
aside .tab-nudge{
  font-size:13.5px;
}
aside .tabs button,
aside .btns button{
  font-size:12.5px;
  padding:7px 12px;
}
aside .goal-board-sub{font-size:13px}
aside .goal-action{font-size:13px}
aside .region-card small{font-size:11.5px}

.map-foundation-message{
  max-width:none;
  margin:12px auto 0;
  padding:13px 16px;
  color:#2a241e;
  background:linear-gradient(135deg,#fffdf7,#f2e7cf);
  border:1px solid #cfc1aa;
  border-left:4px solid var(--gold);
  border-radius:10px;
  box-shadow:0 4px 14px rgba(0,0,0,.08);
  font-family:Inter,Arial,sans-serif;
  font-size:14px;
  line-height:1.42;
  font-weight:500;
  text-rendering:optimizeLegibility;
  -webkit-font-smoothing:antialiased;
}
.map-foundation-message p{margin:0 0 .3em}
.map-foundation-message p:last-child{margin-bottom:0}
.map-foundation-message strong{font-weight:800;color:#18130f}

#worldActivity{
  position:absolute;
  inset:0;
  z-index:3;
  pointer-events:none;
  overflow:hidden;
}
.activity{
  position:absolute;
  opacity:0;
  transition:opacity .5s ease, transform .5s ease;
}
.activity.show{opacity:1}
.activity.level2{opacity:.82}
.activity.level3{opacity:1}

/* Belonging Commons: people gathering */
.people-cluster{
  width:56px;height:34px;
}
.people-cluster i{
  position:absolute;
  width:7px;height:7px;border-radius:50%;
  background:#5a4430;
  box-shadow:0 7px 0 -1px #5a4430;
}
.people-cluster i:nth-child(1){left:4px;top:9px}
.people-cluster i:nth-child(2){left:18px;top:2px}
.people-cluster i:nth-child(3){left:32px;top:8px}
.people-cluster i:nth-child(4){left:44px;top:1px}
.people-cluster.level1 i:nth-child(n+3){display:none}
.people-cluster.level2 i:nth-child(4){display:none}

/* Industry District: truck, workers, lit activity */
.industry-truck{
  width:46px;height:19px;
  border-radius:4px 5px 3px 3px;
  background:#6b4d2f;
}
.industry-truck::before{
  content:"";
  position:absolute;right:-13px;top:5px;
  width:15px;height:14px;border-radius:3px 4px 3px 2px;
  background:#7f5b38;
}
.industry-truck::after{
  content:"";
  position:absolute;left:7px;bottom:-5px;
  width:8px;height:8px;border-radius:50%;
  background:#2f2a24;
  box-shadow:28px 0 0 #2f2a24,43px 0 0 #2f2a24;
}
.activity.level3 .industry-truck{animation:truckMove 5s ease-in-out infinite}
@keyframes truckMove{50%{transform:translateX(9px)}}
.industry-lights{
  width:54px;height:18px;
  display:flex;gap:5px;
}
.industry-lights i{
  width:9px;height:9px;border-radius:2px;
  background:#f6d36c;
  box-shadow:0 0 8px rgba(246,211,108,.75);
}
.industry-lights.level1 i:nth-child(n+2){opacity:.15}
.industry-lights.level2 i:nth-child(n+4){opacity:.15}

/* Discovery Lab: active windows and moving figures */
.lab-windows{
  width:58px;height:30px;
  display:grid;grid-template-columns:repeat(4,1fr);gap:4px;
}
.lab-windows i{
  background:#f0c95b;
  border-radius:2px;
  box-shadow:0 0 7px rgba(240,201,91,.72);
}
.lab-windows.level1 i:nth-child(n+3){opacity:.12}
.lab-windows.level2 i:nth-child(n+6){opacity:.12}
.lab-figure{
  width:7px;height:7px;border-radius:50%;
  background:#47382b;
  box-shadow:0 7px 0 -1px #47382b;
}
.activity.level3 .lab-figure{animation:labWalk 3.8s ease-in-out infinite}
@keyframes labWalk{50%{transform:translateX(12px)}}

/* Career Launchpad: bridge/activity line */
.bridge-progress{
  height:5px;
  background:#c59a45;
  border-radius:5px;
  box-shadow:0 0 8px rgba(197,154,69,.55);
  transform-origin:left center;
}
.bridge-progress.level1{width:34px}
.bridge-progress.level2{width:62px}
.bridge-progress.level3{width:92px}
.bridge-progress::before,.bridge-progress::after{
  content:"";
  position:absolute;top:-8px;width:4px;height:20px;background:#7d6335;
}
.bridge-progress::before{left:15%}.bridge-progress::after{right:15%}

/* Exploration Coast: boat movement */
.coast-boat{
  width:35px;height:11px;
  border-radius:0 0 16px 16px;
  background:#6a4b32;
}
.coast-boat::before{
  content:"";
  position:absolute;left:15px;bottom:9px;
  width:2px;height:19px;background:#4c3b2f;
}
.coast-boat::after{
  content:"";
  position:absolute;left:17px;bottom:14px;
  border-left:11px solid #d8c58f;
  border-top:7px solid transparent;
  border-bottom:7px solid transparent;
}
.activity.level3 .coast-boat{animation:boatDrift 4.5s ease-in-out infinite}
@keyframes boatDrift{50%{transform:translateX(10px) translateY(-2px)}}

/* Health & Wellness: moving activity dots */
.wellness-motion{
  width:52px;height:28px;
}
.wellness-motion i{
  position:absolute;width:7px;height:7px;border-radius:50%;
  background:#527a4d;
  box-shadow:0 7px 0 -1px #527a4d;
}
.wellness-motion i:nth-child(1){left:3px;top:9px}
.wellness-motion i:nth-child(2){left:21px;top:2px}
.wellness-motion i:nth-child(3){left:40px;top:8px}
.wellness-motion.level1 i:nth-child(n+2){display:none}
.wellness-motion.level2 i:nth-child(3){display:none}
.activity.level3 .wellness-motion i:nth-child(2){animation:wellnessMove 2.8s ease-in-out infinite}
@keyframes wellnessMove{50%{transform:translateY(-5px)}}

/* Faculty Grove: office windows and path walker */
.faculty-lights{
  width:48px;height:24px;
  display:grid;grid-template-columns:repeat(3,1fr);gap:4px;
}
.faculty-lights i{
  background:#f1cf6e;
  border-radius:2px;
  box-shadow:0 0 6px rgba(241,207,110,.7);
}
.faculty-lights.level1 i:nth-child(n+2){opacity:.12}
.faculty-lights.level2 i:nth-child(n+4){opacity:.12}
.faculty-walker{
  width:7px;height:7px;border-radius:50%;
  background:#4d3b2c;
  box-shadow:0 7px 0 -1px #4d3b2c;
}
.activity.level3 .faculty-walker{animation:facultyWalk 4s ease-in-out infinite}
@keyframes facultyWalk{50%{transform:translateX(10px)}}

/* Pathfinder Headquarters: signpost lights */
.pathfinder-beacon{
  width:14px;height:14px;border-radius:50%;
  background:#f3ce67;
  box-shadow:0 0 12px rgba(243,206,103,.85);
}
.pathfinder-beacon.level2{box-shadow:0 0 18px rgba(243,206,103,.95)}
.pathfinder-beacon.level3{animation:beaconPulse 2.5s ease-in-out infinite}
@keyframes beaconPulse{50%{transform:scale(1.18)}}

@media(max-width:700px){
  .activity{transform:scale(.82)}
}


#hieLayer{
  position:absolute;
  inset:0;
  z-index:6;
  pointer-events:none;
  overflow:hidden;
}
.hie-firework{
  position:absolute;
  inset:0;
}
.hie-rocket{
  position:absolute;
  left:var(--sx);
  top:var(--sy);
  width:4px;
  height:20px;
  border-radius:4px;
  background:linear-gradient(to top,rgba(82,238,255,0),rgba(82,238,255,.98));
  box-shadow:0 0 10px rgba(55,225,255,.95);
  transform:translate(-50%,-50%) rotate(var(--angle));
  opacity:0;
  animation:hieRocket 5.2s ease-in-out infinite;
  animation-delay:var(--delay);
}
.hie-rocket::after{
  content:"";
  position:absolute;
  left:1px;
  bottom:-12px;
  width:2px;
  height:16px;
  background:linear-gradient(to bottom,rgba(132,244,255,.92),rgba(132,244,255,0));
  filter:blur(1px);
}
.hie-burst{
  position:absolute;
  left:var(--bx);
  top:var(--by);
  width:64px;
  height:64px;
  transform:translate(-50%,-50%) scale(.25);
  opacity:0;
  animation:hieBurst 5.2s ease-out infinite;
  animation-delay:var(--delay);
}
.hie-burst i{
  position:absolute;
  left:50%;
  top:50%;
  width:4px;
  height:24px;
  margin-left:-2px;
  margin-top:-24px;
  border-radius:4px;
  background:linear-gradient(to top,rgba(184,82,255,0),rgba(73,232,255,1));
  transform-origin:50% 100%;
  box-shadow:0 0 11px rgba(78,223,255,.95),0 0 17px rgba(183,82,255,.5);
}
.hie-burst i:nth-child(1){transform:rotate(0deg)}
.hie-burst i:nth-child(2){transform:rotate(45deg)}
.hie-burst i:nth-child(3){transform:rotate(90deg)}
.hie-burst i:nth-child(4){transform:rotate(135deg)}
.hie-burst i:nth-child(5){transform:rotate(22deg)}
.hie-burst i:nth-child(6){transform:rotate(67deg)}
.hie-burst i:nth-child(7){transform:rotate(112deg)}
.hie-burst i:nth-child(8){transform:rotate(157deg)}
.hie-burst .hie-count{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  min-width:22px;
  height:22px;
  padding:0 5px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#e9fbff;
  border:2px solid #3bcfe7;
  color:#173b67;
  font-size:11px;
  font-weight:900;
  box-shadow:0 0 14px rgba(61,220,245,.85);
}
.hie-planned{
  position:absolute;
  left:var(--px);
  top:var(--py);
  width:28px;
  height:28px;
  transform:translate(-50%,-50%);
  opacity:.78;
}
.hie-planned::before,
.hie-planned::after{
  content:"";
  position:absolute;
  left:50%;
  top:50%;
  width:3px;
  height:24px;
  margin-left:-1.5px;
  margin-top:-12px;
  border-radius:3px;
  background:rgba(225,207,255,.96);
  border:1px solid rgba(135,89,210,.82);
}
.hie-planned::after{transform:rotate(90deg)}
.hie-planned .diag1,
.hie-planned .diag2{
  position:absolute;
  left:50%;
  top:50%;
  width:3px;
  height:20px;
  margin-left:-1.5px;
  margin-top:-10px;
  border-radius:3px;
  background:rgba(225,207,255,.96);
  border:1px solid rgba(135,89,210,.82);
}
.hie-planned .diag1{transform:rotate(45deg)}
.hie-planned .diag2{transform:rotate(-45deg)}
.hie-planned .planned-count{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  min-width:18px;
  height:18px;
  padding:0 4px;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#f5efff;
  border:1px solid #9a6ad7;
  color:#5b378c;
  font-size:9px;
  font-weight:900;
}
@keyframes hieRocket{
  0%,12%{
    left:var(--sx);
    top:var(--sy);
    opacity:0;
  }
  18%{opacity:1}
  46%{
    left:var(--bx);
    top:var(--by);
    opacity:1;
  }
  48%,100%{opacity:0}
}
@keyframes hieBurst{
  0%,46%{opacity:0;transform:translate(-50%,-50%) scale(.2)}
  51%{opacity:1;transform:translate(-50%,-50%) scale(.8)}
  62%{opacity:1;transform:translate(-50%,-50%) scale(1)}
  78%{opacity:0;transform:translate(-50%,-50%) scale(1.16)}
  100%{opacity:0}
}
.hie-key{
  display:inline-flex;
  align-items:center;
  gap:6px;
}
.hie-key-firework{
  position:relative;
  width:16px;
  height:16px;
}
.hie-key-firework::before,
.hie-key-firework::after{
  content:"";
  position:absolute;
  left:7px;
  top:1px;
  width:2px;
  height:14px;
  background:#35cee7;
  border-radius:2px;
}
.hie-key-firework::after{transform:rotate(90deg)}
.hie-key-planned{
  position:relative;
  width:14px;
  height:14px;
}
.hie-key-planned::before,
.hie-key-planned::after{
  content:"";
  position:absolute;
  left:6px;
  top:1px;
  width:2px;
  height:12px;
  border:1px solid #9566ce;
  background:#f1eaff;
}
.hie-key-planned::after{transform:rotate(90deg)}
  50%{transform:scale(1.08) rotate(var(--rot)); opacity:1}
}

function renderHIELayer(){
  const box=document.getElementById("hieLayer");
  if(!box) return;
  const counts=hieCountsByLandmark();
  let index=0;
  box.innerHTML=Object.entries(HIE_MARKERS).map(([landmark,p])=>{
    const completed=counts.completed[landmark]||0;
    const planned=counts.planned[landmark]||0;
    if(!completed && !planned) return "";
    const dx=p.bx-p.sx;
    const dy=p.by-p.sy;
    const angle=Math.atan2(dy,dx)*180/Math.PI+90;
    const delay=(index++*.55).toFixed(2)+"s";
    const firework=completed?`
      <div class="hie-firework" style="--sx:${p.sx}%;--sy:${p.sy}%;--bx:${p.bx}%;--by:${p.by}%;--angle:${angle}deg;--delay:${delay}">

        <span class="hie-burst">
          <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>

        </span>

    const plannedMarker=planned?`

    return firework+plannedMarker;

}

function hasCourse(c){if(c==="Target course completed at NC State")return false;if(c==="3 ARE courses completed or in progress")return state.areCount>=3;if(c==="Course of interest with a B or higher")return false;return state.courses.has(c)}
function identityAllowed(e){const rule=normalize(e.eligibilityRule);if(rule.includes("marks it relevant")&&e.name.includes("Women"))return state.communities.includes("women");if(rule.includes("faith-based"))return state.communities.includes("faith");if(rule.includes("fraternity"))return state.communities.includes("greek");return true}
function interestMatches(e){
  if(e.name==="Fraternity and Sorority Life") return state.communities.includes("greek");

function specialEligibility(e){
  if(e.name==="Sales Competition"){
    return state.done.has("Sales Workshop");
  }
  if(e.name==="Club Sports") return state.done.has("ABM Intramurals");
  if(e.name==="Develop a Faculty Mentoring Relationship") return hasFacultyContact();
  return null;
}

function classify(e){
  if(state.done.has(e.name))return "completed";
  if(!identityAllowed(e))return "hidden";
  const special=specialEligibility(e);
  const yearOK=(YEAR_RANK[state.stage]||1)>=e.minYearRank;
  const coursesOK=e.requiredCourses.every(hasCourse);
  const predOK=predecessorMet(e);
  if(special===false)return "build";
  if(special===true && yearOK)return "next";
  if(yearOK&&coursesOK&&predOK){
    if(e.predecessor&&predOK)return "next";
    return "eligible";
  }
  return "build";
}
function reason(e,status){
  if(status==="next")return "This is the natural next step from something already in your world.";
  if(status==="eligible")return "You meet the current timing and prerequisite rules.";
  if(status==="build"){
    const missing=[];
    if((YEAR_RANK[state.stage]||1)<e.minYearRank)missing.push("reach "+e.minYear);
    const c=e.requiredCourses.filter(x=>!hasCourse(x));if(c.length)missing.push("complete "+c.map(displayCourse).join(", "));
    if(e.name==="Sales Competition"&&!state.done.has("Sales Workshop"))missing.push("complete Sales Workshop");
    if(e.name==="Club Sports"&&!state.done.has("ABM Intramurals"))missing.push("participate in ABM Intramurals first");
    if(e.name==="Develop a Faculty Mentoring Relationship"&&!hasFacultyContact())missing.push("begin through Office Hours, ABM Club, a faculty-led team, research, teaching, or another repeated faculty interaction");
    return missing.length?"Build toward this by: "+missing.join("; ")+".":"One requirement for this is still outstanding.";
  }
  return "A future possibility to keep in view.";
}

function completedCountByRegion(){
  const counts={};
  for(const e of DATA){
    if(!state.done.has(e.name)) continue;
    for(const region of (ACTIVATION_REGIONS[e.name]||[e.region])){
      counts[region]=(counts[region]||0)+1;
    }
  }
  return counts;
}
function regionBalanceBoost(e){
  const counts=completedCountByRegion();
  const regions=ACTIVATION_REGIONS[e.name]||[e.region];
  let boost=0;
  for(const region of regions){
    const count=counts[region]||0;
    if(count===0) boost=Math.max(boost,18);
    else if(count===1) boost=Math.max(boost,12);
    else if(count===2) boost=Math.max(boost,5);
  }
  return boost;
}
function score(e,status){
  let s=100-e.priority*5;
  for(const g of state.goals)if(e.interestTrigger.some(t=>normalize(t).includes(g)||g.includes(normalize(t))))s+=12;
  if(status==="next")s+=30;if(status==="eligible")s+=15;
  if(e.name==="ABM Intramurals")s+=12;
  if(e.name==="Connect to ABM on Flare")s+=18;
  if(e.name==="Fraternity and Sorority Life" && state.communities.includes("greek")) s+=28;
  if(e.name==="Women in Agribusiness Club" && state.communities.includes("women")) s+=20;
  if(e.name==="Cru" && state.communities.includes("faith")) s+=20;
  if(e.name==="Club Sports")s-=16;
  s+=regionBalanceBoost(e);
  if(state.hiePreference==="yes" && HIE_EXPERIENCES.has(e.name)) s+=22;
  if(state.hiePreference==="maybe" && HIE_EXPERIENCES.has(e.name)) s+=8;
  return s;
}

function wellRoundedRegions(){
  const completed={};
  const planned={};

  for(const e of DATA){
    const er=ACTIVATION_REGIONS[e.name]||[e.region];
    for(const [landmark,mapped] of Object.entries(LANDMARK_TO_REGIONS)){
      if(!er.some(r=>mapped.includes(r))) continue;
      if(state.done.has(e.name)) completed[landmark]=(completed[landmark]||0)+1;
      else if(state.saved.has(e.name)) planned[landmark]=(planned[landmark]||0)+1;
    }
  }

  // Include derived and gateway goals that may not be part of DATA.
  if(state.done.has("ABM Intramurals")){
    const extraSports=Math.max(0,state.intramuralSports.size-1);
    completed["Health & Wellness Park"]=(completed["Health & Wellness Park"]||0)+extraSports+(state.intramuralCaptain?1:0);
    completed["Belonging Commons"]=(completed["Belonging Commons"]||0)+extraSports+(state.intramuralCaptain?1:0);
  }

  for(const name of state.saved){
    if(DATA.some(e=>e.name===name)) continue;
    const derived=[...gatewayCourseRecommendations(),...derivedNextSteps(),...wellnessOpportunities()].find(r=>r.e.name===name)?.e;
    if(!derived) continue;
    const er=ACTIVATION_REGIONS[derived.name]||[derived.region];
    for(const [landmark,mapped] of Object.entries(LANDMARK_TO_REGIONS)){
      if(er.some(r=>mapped.includes(r))) planned[landmark]=(planned[landmark]||0)+1;
    }
  }

  return Object.keys(REGION_GLOWS)
    .filter(r=>r!=="Pathfinder Headquarters")
    .map(region=>{
      const done=completed[region]||0;
      const goal=planned[region]||0;
      return {region,completed:done,planned:goal,balanceScore:done+(goal*0.75)};
    })
    .sort((a,b)=>a.balanceScore-b.balanceScore || a.completed-b.completed || a.region.localeCompare(b.region))
    .slice(0,3);
}

function groups(){
  const raw=DATA.map((e,i)=>({e,i,status:classify(e)})).filter(r=>r.status!=="hidden"&&r.status!=="completed"&&!state.dismissed.has(r.e.name)&&!state.saved.has(r.e.name));

  // Reclassify distant-year items as Future instead of Build Toward This.
  for(const r of raw){
    const yearGap=r.e.minYearRank-(YEAR_RANK[state.stage]||1);
    const missingCourses=r.e.requiredCourses.filter(c=>!hasCourse(c));
    const hasImmediatePredecessor=r.e.predecessor && r.e.predecessor.split(";").some(p=>state.done.has(p.trim()));
    if(r.status==="build" && yearGap>=2 && !hasImmediatePredecessor){
      r.status="future";
    } else if(r.status==="build" && yearGap>=1 && missingCourses.length===0 && !r.e.predecessor){
      r.status="future";
    }
  }

  for(const r of raw)r.score=score(r.e,r.status);
  raw.sort((a,b)=>b.score-a.score);

  let next=[
    ...salesSequenceRecommendation(),
    ...gatewayCourseRecommendations(),
    ...derivedNextSteps(),
    ...raw.filter(r=>r.status==="next")
  ].filter(r=>!state.dismissed.has(r.e.name)&&!state.saved.has(r.e.name));

  // Keep Recommended Next useful at all times.
  if(next.length===0){
    const fallback=[
      ...raw.filter(r=>r.status==="eligible"),
      ...raw.filter(r=>r.status==="build"),
      ...raw.filter(r=>r.status==="future")
    ].sort((a,b)=>b.score-a.score).slice(0,3).map(r=>({...r,status:"next"}));
    next=fallback;
  }
  const dedup=new Set();
  let uniqueNext=next.filter(r=>!dedup.has(r.e.name)&&dedup.add(r.e.name));

  // Top up Recommended Next so it is never a one-card list.
  if(uniqueNext.length<3){
    const topUp=raw
      .filter(r=>r.status==="eligible"&&!dedup.has(r.e.name))
      .sort((a,b)=>b.score-a.score)
      .slice(0,3-uniqueNext.length)
      .map(r=>({...r,status:"next"}));
    for(const r of topUp) dedup.add(r.e.name);
    uniqueNext=[...uniqueNext,...topUp];
  }
  uniqueNext.sort((a,b)=>b.score-a.score);

  // An item lives in exactly one tab.
  const inNext=new Set(uniqueNext.map(r=>r.e.name));
  const rest=s=>raw.filter(r=>r.status===s&&!inNext.has(r.e.name));

  return {
    next:uniqueNext,
    eligible:rest("eligible"),
    build:rest("build"),
    future:rest("future")
  };
}

function landmarkOpportunities(landmark){
  const regions=LANDMARK_TO_REGIONS[landmark]||[landmark];

  const regular=DATA.filter(e=>{
    const er=ACTIVATION_REGIONS[e.name]||[e.region];
    return er.some(r=>regions.includes(r)) && !state.dismissed.has(e.name);
  }).map(e=>{
    let status;
    if(state.done.has(e.name)) status="completed";
    else if(state.saved.has(e.name)) status="saved";
    else {
      const personalized=classify(e);
      status=personalized==="hidden" ? "conditional" : personalized;
    }
    return {e,i:DATA.indexOf(e),status};
  });

  const derived=[...gatewayCourseRecommendations(),...derivedNextSteps(),...wellnessOpportunities()]
    .filter(r=>{
      const er=ACTIVATION_REGIONS[r.e.name]||[r.e.region];
      return er.some(x=>regions.includes(x)) && !state.dismissed.has(r.e.name);
    })
    .map(r=>({...r,status:state.saved.has(r.e.name)?"saved":r.status}));

  const combined=[...regular,...derived];
  const seen=new Set();
  return combined.filter(r=>!seen.has(r.e.name)&&seen.add(r.e.name));
}

function markerPosition(e,i){
  const lm=mapPlace(e);

function completedExperienceGroups(){
  const grouped={};
  const unknown=[];
  for(const name of state.done){
    const e=DATA.find(item=>item.name===name);
    if(!e){
      unknown.push({name,region:"Other Completed Experiences",hie:HIE_EXPERIENCES.has(name)});
      continue;
    }
    const region=mapPlace(e)||"Other Completed Experiences";
    (grouped[region]||(grouped[region]=[])).push({
      name:e.name,
      region,
      hie:HIE_EXPERIENCES.has(e.name),
      category:e.category||""
    });
  }
  if(unknown.length) grouped["Other Completed Experiences"]=(grouped["Other Completed Experiences"]||[]).concat(unknown);
  const preferred=[
    "Belonging Commons","Faculty Grove","Industry District","Discovery Lab",
    "Pathfinder Headquarters","Health & Wellness Park","Career Launchpad",
    "Exploration Coast","Other Completed Experiences"
  ];
  return Object.entries(grouped)
    .filter(([,items])=>items.length)
    .sort((a,b)=>{
      const ai=preferred.indexOf(a[0]),bi=preferred.indexOf(b[0]);
      return (ai<0?99:ai)-(bi<0?99:bi)||a[0].localeCompare(b[0]);
    })
    .map(([region,items])=>[region,items.sort((a,b)=>a.name.localeCompare(b.name))]);
}

function renderFoundationMessage(){
  const box=document.getElementById("foundationMsg");
  if(!box) return;
  const c=regionProgressCounts();
  const active=Object.entries(c).filter(([,n])=>n>0).sort((a,b)=>b[1]-a[1]);
  const closing="There is no single correct ABM path. Lit regions show what you have built. Unlit regions remain unexplored possibilities, not evidence that you are behind.";
  if(!active.length){
    box.innerHTML=`<p><strong>Your world is full of unexplored possibilities.</strong></p><p>Mark one experience you have already completed and that part of your world will wake up. Unlit regions are not missing pieces. They are places you may choose to explore next.</p><p>${closing}</p>`;
    return;
  }
  const strong=active.filter(([,n])=>n>=2).map(([r])=>r);
  const starting=active.filter(([,n])=>n===1).map(([r])=>r);
  const lines=[];
  if(strong.length) lines.push(`<p><strong>You have already built a strong foundation in ${esc(strong.slice(0,2).join(" and "))}.</strong></p>`);
  else lines.push(`<p><strong>Your world has started to light up in ${esc(active[0][0])}.</strong></p>`);
  if(starting.length) lines.push(`<p>You are also beginning to explore ${esc(starting.slice(0,2).join(" and "))}.</p>`);
  lines.push(`<p>${closing}</p>`);
  box.innerHTML=lines.join("");
}

function bindOnboarding(){
document.querySelectorAll("[data-exp]").forEach(x=>x.addEventListener("change",()=>{
  const e=DATA[+x.dataset.exp];
  x.checked?state.done.add(e.name):state.done.delete(e.name);

  if(e.name==="ABM Intramurals"){
    const follow=document.getElementById("intramuralFollowup");
    follow?.classList.toggle("hidden",!x.checked);
    if(!x.checked){
      state.intramuralSports.clear();
      state.intramuralCaptain=false;
      follow?.querySelectorAll("[data-intramural-sport]").forEach(s=>s.checked=false);
      const captain=document.getElementById("intramuralCaptain");
      if(captain) captain.checked=false;
    }
  }

  const leadershipClubs=["ABM Club","Women in Agribusiness Club","Cru","Fraternity and Sorority Life"];
  if(leadershipClubs.includes(e.name)){
    const row=document.querySelector(`[data-leadership-row="${CSS.escape(e.name)}"]`);
    row?.classList.toggle("hidden",!x.checked);
    if(!x.checked){
      state.clubLeadership.delete(e.name);
      const cb=document.querySelector(`[data-club-leadership="${CSS.escape(e.name)}"]`);
      if(cb) cb.checked=false;
    }
    const anySelected=leadershipClubs.some(name=>state.done.has(name));
    document.getElementById("clubLeadershipFollowup")?.classList.toggle("hidden",!anySelected);
  }
}));
